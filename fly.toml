app = 'otchenashhair-warehouse'
primary_region = 'ams'

[build]

[env]
  SERVER_PORT = "8080"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'suspend'
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']

  [[http_service.checks]]
  grace_period = "360s"
  interval = "15s"
  method = "GET"
  path = "/login"
  timeout = "10s"

[[vm]]
  memory = '512mb'
  cpu_kind = 'shared'
  cpus = 1
