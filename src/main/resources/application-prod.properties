spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.hikari.maximum-pool-size=3
spring.datasource.hikari.minimum-idle=1

spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.thymeleaf.cache=true
spring.devtools.restart.enabled=false
logging.level.root=WARN
logging.level.com.hairmony=INFO
server.address=0.0.0.0
server.port=8080

spring.datasource.hikari.connection-timeout=60000
spring.datasource.hikari.initialization-fail-timeout=120000
spring.datasource.hikari.keepalive-time=60000
spring.datasource.hikari.idle-timeout=300000

gemini.api.key=${GEMINI_API_KEY}

# Telegram Bot
telegram.bot.token=${TELEGRAM_BOT_TOKEN}
telegram.bot.username=${TELEGRAM_BOT_USERNAME}
telegram.master.chat-id=${TELEGRAM_MASTER_CHAT_ID}
telegram.webhook.secret=${TELEGRAM_WEBHOOK_SECRET}

# Internal trigger
internal.secret=${INTERNAL_SECRET}