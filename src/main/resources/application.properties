spring.application.name=warehouse

# JPA
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Liquibase
spring.liquibase.change-log=classpath:db/changelog/db.changelog-master.yaml

server.address=0.0.0.0
server.port=8080

# Google Drive Service Account (set GOOGLE_SERVICE_ACCOUNT_JSON env var)
google.service-account.json=${GOOGLE_SERVICE_ACCOUNT_JSON:}
# Google Drive root folder (set GOOGLE_DRIVE_ROOT_FOLDER_ID env var)
google.drive.root-folder-id=${GOOGLE_DRIVE_ROOT_FOLDER_ID:}
