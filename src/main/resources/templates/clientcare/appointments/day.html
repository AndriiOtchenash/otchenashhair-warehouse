<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout/clientcare :: layout(#{appointments.title}, ~{::content})}">
<body>
<div th:fragment="content">
    <style>
        /* ── FullCalendar accent override ── */

        /* Global FC variables — replace all default blues */
        .fc {
            --fc-event-bg-color:     #6b9e79;   /* default event color (PLANNED) before JS mount */
            --fc-event-border-color: #6b9e79;
            --fc-highlight-color:    var(--accent-light);   /* slot hover / selection */
            --fc-more-link-text-color: var(--accent);
            --fc-now-indicator-color: #ff0000;
            font-family: var(--bs-body-font-family);
        }

        /* Today column background + header text */
        .fc .fc-day-today { --fc-today-bg-color: #f1f9f2 !important; }
        .fc .fc-col-header-cell.fc-day-today { background-color: var(--accent); }
        .fc .fc-col-header-cell.fc-day-today .fc-col-header-cell-cushion { color: #fff; font-weight: 700; text-decoration: none; }
        .fc .fc-daygrid-day.fc-day-today .fc-daygrid-day-number {
            color: #fff;
            font-weight: 700;
            background: var(--accent);
            border-radius: 50%;
            width: 1.8em;
            height: 1.8em;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            line-height: 1;
        }

        /* Day numbers + column header links — remove Bootstrap blue */
        .fc .fc-daygrid-day-number,
        .fc .fc-col-header-cell-cushion {
            color: #1e2d24;
            text-decoration: none;
        }
        .fc .fc-daygrid-day-number:hover,
        .fc .fc-col-header-cell-cushion:hover { color: var(--accent); }

        /* "More events" link in month view */
        .fc .fc-more-link { color: var(--accent); font-weight: 600; }
        .fc .fc-more-link:hover { color: #2f5439; }

        /* "Now" indicator line */
        .fc .fc-timegrid-now-indicator-line { border-color: #ff0000; border-width: 1px; }
        .fc .fc-timegrid-now-indicator-arrow { border-bottom-color: #ff0000; border-top-color: #ff0000; }

        .fc .fc-button-primary {
            background-color: var(--accent);
            border-color: var(--accent);
        }
        .fc .fc-button-primary:hover {
            background-color: #3d6b4a;
            border-color: #3d6b4a;
        }
        .fc .fc-button-primary:not(:disabled).fc-button-active,
        .fc .fc-button-primary:not(:disabled):active {
            background-color: #2f5439;
            border-color: #2f5439;
        }
        .fc .fc-button-primary:disabled {
            background-color: var(--accent);
            border-color: var(--accent);
            opacity: 0.55;
        }

        /* Toolbar wraps on narrow screens (desktop only) */
        .fc .fc-toolbar.fc-header-toolbar {
            flex-wrap: wrap;
            gap: 0.4rem;
            margin-bottom: 0.75rem;
        }
        .fc .fc-toolbar-chunk {
            display: flex;
            align-items: center;
            gap: 0.2rem;
        }

        /* Day view: hide redundant column header row */
        .fc-timeGridDay-view .fc-col-header { display: none; }

        /* Events are clickable */
        .fc-event { cursor: pointer; }

        /* Phone inline next to name inside timeGrid event */
        .fc-event-phone {
            font-size: 0.78em;
            opacity: 0.92;
            white-space: nowrap;
            flex-shrink: 0;
        }

        /* Context banner (link-visit flow) */
        .cal-context-banner {
            background: var(--accent-light);
            border: 1px solid var(--accent);
            border-radius: 8px;
            padding: 0.5rem 0.75rem;
            margin-bottom: 0.75rem;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 0.5rem;
            font-size: 0.875rem;
            flex-wrap: wrap;
        }

        /* ── Month view: desktop — single-line pill ──────────────────── */
        @media (min-width: 768px) {
            .fc-month-pill {
                display: flex;
                align-items: center;
                gap: 0.25rem;
                overflow: hidden;
                padding: 0 2px;
                line-height: 1.4;
            }
            .fc-month-pill-time {
                font-size: 0.72em;
                font-weight: 700;
                opacity: 0.9;
                flex-shrink: 0;
                letter-spacing: -0.02em;
            }
            .fc-month-pill-title {
                font-size: 0.82em;
                overflow: hidden;
                text-overflow: ellipsis;
                white-space: nowrap;
            }
        }

        /* ── Mobile: hide FC toolbar, show custom one ────────────────── */
        @media (max-width: 767px) {
            .fc .fc-toolbar.fc-header-toolbar { display: none !important; }

            /* Today banner - full-width, accent background */
            .today-banner {
                display: flex;
                align-items: center;
                justify-content: center;
                gap: 0.4rem;
                width: 100%;
                background: var(--accent);
                color: #fff;
                border: none;
                padding: 0.7rem 1rem;
                font-size: 0.9rem;
                font-weight: 600;
                letter-spacing: 0.01em;
                cursor: pointer;
                text-align: center;
                transition: background 0.15s;
            }
            .today-banner:active { background: #2f5439; }

            /* Nav row: < period > [D][W][M] */
            .cal-nav-row {
                display: flex;
                align-items: center;
                gap: 0.35rem;
                padding: 0.45rem 0.6rem;
                background: #fff;
                border-top: 1px solid rgba(74,124,89,0.15);
                border-bottom: 1px solid #e9ecef;
            }
            .cal-period-label {
                flex: 1;
                text-align: center;
                font-size: 0.82rem;
                font-weight: 600;
                color: #1e2d24;
                white-space: nowrap;
                overflow: hidden;
                text-overflow: ellipsis;
            }
            .cal-nav-btn {
                display: flex;
                align-items: center;
                justify-content: center;
                width: 2.1rem;
                height: 2.1rem;
                border: 1px solid #dee2e6;
                border-radius: 6px;
                background: #fff;
                color: #495057;
                cursor: pointer;
                flex-shrink: 0;
                font-size: 0.9rem;
                padding: 0;
            }
            .cal-nav-btn:active { background: var(--accent-light); border-color: var(--accent); }

            .cal-view-btns {
                display: flex;
                border: 1px solid #dee2e6;
                border-radius: 6px;
                overflow: hidden;
                flex-shrink: 0;
            }
            .cal-view-btn {
                display: flex;
                align-items: center;
                justify-content: center;
                width: 2.1rem;
                height: 2.1rem;
                border: none;
                border-left: 1px solid #dee2e6;
                background: #fff;
                color: #6c757d;
                cursor: pointer;
                font-size: 0.85rem;
                padding: 0;
                transition: background 0.1s, color 0.1s;
            }
            .cal-view-btn:first-child { border-left: none; }
            .cal-view-btn.active {
                background: var(--accent-light);
                color: var(--accent);
            }

            /* Month view: strip event block so only dot is visible */
            .fc-daygrid-event {
                background: transparent !important;
                border: none !important;
                box-shadow: none !important;
                padding: 0 !important;
                margin: 1px 0 !important;
            }
            .fc-daygrid-event-harness { height: 13px !important; }

            .fc-dot-pill {
                display: flex;
                align-items: center;
                padding: 2px 3px;
            }
            .fc-dot-circle {
                width: 9px;
                height: 9px;
                border-radius: 50%;
                flex-shrink: 0;
            }

            .fc-daygrid-day-frame { cursor: pointer; }
            .cal-context-banner { align-items: flex-start; }


            .fc-more-link {
                font-size: 0.65rem !important;
                font-weight: 600;
                padding: 0 3px;
            }

            /* Back arrow in today-banner: same bg, left border separates from date */
            .today-back-btn {
                border-right: 1px solid rgba(255,255,255,0.3);
                padding-left: 1rem;
                padding-right: 1rem;
            }
        }

        /* Desktop: back button in FC toolbar styled as outline-secondary */
        .fc .fc-backBtn-button {
            background-color: transparent !important;
            border-color: #6c757d !important;
            color: #6c757d !important;
        }
        .fc .fc-backBtn-button:hover,
        .fc .fc-backBtn-button:focus {
            background-color: #6c757d !important;
            border-color: #6c757d !important;
            color: #fff !important;
        }

        /* Desktop: legend (ⓘ) button in FC toolbar */
        .fc .fc-legendBtn-button {
            background-color: transparent !important;
            border-color: var(--accent) !important;
            color: var(--accent) !important;
            font-size: 1rem !important;
            line-height: 1 !important;
        }
        .fc .fc-legendBtn-button:hover,
        .fc .fc-legendBtn-button:focus {
            background-color: var(--accent-light) !important;
            border-color: var(--accent) !important;
            color: var(--accent) !important;
        }

        /* Task inline-edit save button — disabled must not look blue */
        .cal-task-edit-save:disabled {
            background-color: transparent;
            border-color: #6c757d;
            color: #6c757d;
            opacity: 0.65;
        }
    </style>

    <!-- Context banner — visible when booking for a specific client -->
    <div th:if="${calClientId != null}" class="cal-context-banner">
        <div class="d-flex flex-column flex-md-row align-items-md-center gap-md-1">
            <div>
                <i class="bi bi-person-check me-1"></i>
                <span th:text="#{appointments.calendar.pickSlot}">Оберіть час для запису</span><span th:if="${calClientName != null}"> :</span>
            </div>
            <strong th:if="${calClientName != null}" th:text="${calClientName}"></strong>
        </div>
        <a th:href="${calReturnTo != null} ? ${calReturnTo} : '/clientcare/clients/' + ${calClientId}"
           class="btn btn-outline-secondary btn-sm flex-shrink-0"
           th:text="#{btn.cancel}">Скасувати</a>
    </div>

    <!-- overflow-hidden clips children to the card's border-radius -->
    <div class="card overflow-hidden">

        <!-- ── Mobile custom header (hidden on desktop) ── -->
        <div class="d-md-none">
            <!-- Today banner row: optional back arrow (left) + date label (flex-grow) -->
            <div class="d-flex">
                <a th:if="${calReturnTo != null and calClientId == null}"
                   th:href="${calReturnTo}"
                   class="today-banner today-back-btn"
                   style="width:auto; flex-shrink:0; text-decoration:none;"
                   aria-label="Назад">
                    <i class="bi bi-arrow-left"></i>
                </a>
                <button id="todayBanner" class="today-banner flex-grow-1" type="button">
                    <i class="bi bi-calendar-heart"></i>
                    <span id="todayLabel"></span>
                </button>
            </div>
            <!-- Nav row: prev / period title / next / view switcher -->
            <div class="cal-nav-row">
                <button class="cal-nav-btn" id="calPrev" type="button" aria-label="Попередній">
                    <i class="bi bi-chevron-left"></i>
                </button>
                <span class="cal-period-label" id="calPeriodLabel"></span>
                <button class="cal-nav-btn" id="calNext" type="button" aria-label="Наступний">
                    <i class="bi bi-chevron-right"></i>
                </button>
                <div class="cal-view-btns" role="group">
                    <button class="cal-view-btn" id="viewDay"   type="button" title="День">
                        <i class="bi bi-calendar-day"></i>
                    </button>
                    <button class="cal-view-btn" id="viewWeek"  type="button" title="Тиждень">
                        <i class="bi bi-calendar2-week"></i>
                    </button>
                    <button class="cal-view-btn" id="viewMonth" type="button" title="Місяць">
                        <i class="bi bi-calendar3"></i>
                    </button>
                </div>
                <button id="calLegendMobile" class="cal-nav-btn" type="button"
                        aria-label="Легенда кольорів"
                        style="margin-left:0.15rem; color:var(--accent); border-color:var(--accent); display:none;">
                    <i class="bi bi-info-circle"></i>
                </button>
                <button id="calTasksBtn" class="cal-nav-btn" type="button"
                        th:title="#{calendar.tasks.btn.title}"
                        style="margin-left:0.15rem; color:var(--accent); border-color:var(--accent); position:relative;"
                        data-bs-toggle="modal" data-bs-target="#calTasksModal">
                    <i class="bi bi-list-task"></i>
                    <span id="calTasksBadge" class="position-absolute top-0 start-100 translate-middle badge rounded-pill bg-danger"
                          style="font-size:0.55rem; display:none;"></span>
                </button>
            </div>
        </div>

        <!-- ── Today tasks alert (shown only in day view when today has pending tasks) ── -->
        <div id="todayTasksAlert" class="alert alert-warning py-2 mx-2 mx-md-3 mt-3 mb-0 d-none align-items-center gap-2">
            <i class="bi bi-exclamation-circle flex-shrink-0"></i>
            <span class="small" th:text="#{calendar.tasks.today.alert.label}">Незавершених завдань</span>
            <strong id="todayTasksAlertCount" class="me-auto"></strong>
            <button type="button" class="btn-close flex-shrink-0" style="font-size:0.65em" aria-label="Close"
                    onclick="this.closest('#todayTasksAlert').classList.add('d-none');this.closest('#todayTasksAlert').classList.remove('d-flex')"></button>
        </div>

        <!-- ── Calendar grid ── -->
        <div class="card-body p-2 p-md-3">
            <div id="calendar"></div>
        </div>
    </div>

    <!-- Calendar Tasks modal -->
    <div class="modal fade" id="calTasksModal" tabindex="-1">
        <div class="modal-dialog modal-dialog-centered modal-sm">
            <div class="modal-content">
                <div class="modal-header border-0 pb-1">
                    <h6 class="modal-title fw-semibold" id="calTasksModalTitle" th:text="#{calendar.tasks.btn.title}">Завдання</h6>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body pt-1 pb-2" id="calTasksList">
                    <div class="text-muted small text-center py-2" id="calTasksEmpty"
                         th:text="#{calendar.tasks.empty}">Завдань немає</div>
                </div>
                <div class="modal-footer border-0 pt-0 flex-column align-items-stretch gap-1">
                    <div id="calTaskNoteRow" style="display:none">
                        <textarea id="calTaskText" class="form-control form-control-sm mb-1" rows="2"
                                  th:placeholder="#{calendar.reminder.note.placeholder}"></textarea>
                        <div class="d-flex gap-1 justify-content-end">
                            <button type="button" class="btn btn-outline-secondary btn-sm" id="calTaskCancelAdd"
                                    th:text="#{btn.cancel}">Скасувати</button>
                            <button type="button" class="btn btn-primary btn-sm" id="calTaskSaveBtn"
                                    th:text="#{calendar.tasks.save}">Зберегти</button>
                        </div>
                    </div>
                    <button type="button" class="btn btn-outline-primary btn-sm" id="calTaskAddBtn"
                            th:text="#{calendar.tasks.add}">+ Додати завдання</button>
                </div>
            </div>
        </div>
    </div>

    <!-- FullCalendar v6 — CDN -->
    <script src="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.15/index.global.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@fullcalendar/core@6.1.15/locales-all.global.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@fullcalendar/interaction@6.1.15/index.global.min.js"></script>

    <script th:inline="javascript">
        /*<![CDATA[*/
        const INITIAL_DATE   = /*[[${initialDate}]]*/ null;
        const CAL_CLIENT_ID  = /*[[${calClientId}]]*/ null;
        const CAL_LINK_VISIT = /*[[${calLinkVisitId}]]*/ null;
        const CAL_RETURN_TO      = /*[[${calReturnTo}]]*/ null;
        const CAL_SERVICE_ID     = /*[[${calServiceId}]]*/ null;
        const CAL_REBOOKED_FROM  = /*[[${calRebookedFromId}]]*/ null;
        const CAL_EDIT_APPT_ID   = /*[[${calEditApptId}]]*/ null;
        const CSRF_PARAM     = /*[[${_csrf != null ? _csrf.parameterName : '_csrf'}]]*/ '_csrf';
        const CSRF_TOKEN     = /*[[${_csrf != null ? _csrf.token : ''}]]*/ '';
        const TODAY_LABEL    = /*[[#{common.today}]]*/ 'Сьогодні';

        const FC_LOCALE = (function () {
            const lang = /*[[${#locale.language}]]*/ 'uk';
            return (lang === 'uk' || lang === 'pl') ? lang : 'en';
        })();

        function isMobile() { return window.innerWidth < 768; }

        // ── Event color (computed client-side from status + time) ──────────

        // Solid-bg events (white text)
        const STATUS_COLORS = {
            NO_SHOW: '#fd7e14',
        };

        // CANCELLED
        const CANCELLED_BG     = '#f59898';
        const CANCELLED_BORDER = '#f59898';
        const CANCELLED_TEXT   = '#1e2d24';
        const CANCELLED_DOT    = '#f59898';

        // COMPLETED — Bootstrap secondary-subtle
        const COMPLETED_BG     = '#e2e3e5';
        const COMPLETED_BORDER = '#c4c8cb';
        const COMPLETED_TEXT   = '#41464b';
        const COMPLETED_DOT    = '#6c757d';

        // PLANNED — matches .days-warn on /clientcare/followups
        const PLANNED_BG     = '#fff3cd';
        const PLANNED_BORDER = '#ffe69c';
        const PLANNED_TEXT   = '#664d03';
        const PLANNED_DOT    = '#ffc107';  // visible yellow dot in month/mobile view

        // Overdue — matches .days-urgent on /clientcare/followups
        const OVERDUE_BG     = '#f8d7da';
        const OVERDUE_BORDER = '#f1aeb5';
        const OVERDUE_TEXT   = '#842029';
        const OVERDUE_DOT    = '#b02a37';  // visible red dot in month/mobile view

        // In progress — matches .days-ok on /clientcare/followups
        const IN_PROGRESS_BG     = '#d1e7dd';
        const IN_PROGRESS_BORDER = '#a3cfbb';
        const IN_PROGRESS_TEXT   = '#0a3622';
        const IN_PROGRESS_DOT    = '#198754';

        function isInProgress(status, start, end) {
            if (status !== 'PLANNED' && status !== 'CONFIRMED') return false;
            const now = new Date();
            return start <= now && end != null && end > now;
        }

        function isOverdue(status, start, end) {
            if (status !== 'PLANNED' && status !== 'CONFIRMED') return false;
            const now = new Date();
            return start < now && (end == null || end <= now);
        }

        const STATUS_LABELS = {
            inProgress: /*[[#{appointments.status.inProgress}]]*/ 'У процесі',
            overdue:    /*[[#{appointments.status.overdue}]]*/ 'Прострочено',
            CONFIRMED:  /*[[#{appointments.status.CONFIRMED}]]*/ 'Підтверджено',
            PLANNED:    /*[[#{appointments.status.PLANNED}]]*/ 'Заплановано',
            COMPLETED:  /*[[#{appointments.status.COMPLETED}]]*/ 'Завершено',
            CANCELLED:  /*[[#{appointments.status.CANCELLED}]]*/ 'Скасовано',
            NO_SHOW:    /*[[#{appointments.status.NO_SHOW}]]*/ 'Не прийшов',
        };

        /** Short label shown in timeGrid time row (top-right of event block). */
        function getStatusLabel(status, start, end) {
            if (isInProgress(status, start, end)) return STATUS_LABELS.inProgress;
            if (isOverdue(status, start, end))    return STATUS_LABELS.overdue;
            return STATUS_LABELS[status] || '';
        }

        /** Compute {bg, border, text} for any view — single source of truth. */
        function eventStyle(status, start, end) {
            if (isInProgress(status, start, end)) return { bg: IN_PROGRESS_BG, border: IN_PROGRESS_BORDER, text: IN_PROGRESS_TEXT };
            if (isOverdue(status, start, end))    return { bg: OVERDUE_BG,      border: OVERDUE_BORDER,     text: OVERDUE_TEXT };
            if (status === 'CONFIRMED')           return { bg: IN_PROGRESS_BG,  border: IN_PROGRESS_BORDER, text: IN_PROGRESS_TEXT };
            if (status === 'PLANNED')             return { bg: PLANNED_BG,      border: PLANNED_BORDER,     text: PLANNED_TEXT };
            if (status === 'COMPLETED')           return { bg: COMPLETED_BG,    border: COMPLETED_BORDER,   text: COMPLETED_TEXT };
            if (status === 'CANCELLED')           return { bg: CANCELLED_BG,    border: CANCELLED_BORDER,   text: CANCELLED_TEXT };
            const solid = STATUS_COLORS[status] || '#adb5bd';
            return { bg: solid, border: solid, text: '#fff' };
        }

        /** Dot color for month/mobile view — uses the saturated variant of each state. */
        function eventColor(status, start, end) {
            if (isInProgress(status, start, end)) return IN_PROGRESS_DOT;
            if (isOverdue(status, start, end))    return OVERDUE_DOT;
            if (status === 'CONFIRMED')           return IN_PROGRESS_DOT;
            if (status === 'PLANNED')             return PLANNED_DOT;
            if (status === 'COMPLETED')           return COMPLETED_DOT;
            if (status === 'CANCELLED')           return CANCELLED_DOT;
            return STATUS_COLORS[status] || '#adb5bd';
        }

        /** Build URL after slot click — returns to existing edit form when editApptId is set. */
        function newApptUrl(dateStr) {
            const date = dateStr.slice(0, 10);
            const time = dateStr.length >= 16 ? dateStr.slice(11, 16) : null;
            if (CAL_EDIT_APPT_ID) {
                // Slot picked to reschedule an existing appointment — go back to its edit form
                let url = '/clientcare/appointments/' + CAL_EDIT_APPT_ID + '/edit?startDate=' + date;
                if (time)          url += '&startTime=' + time;
                if (CAL_RETURN_TO) url += '&returnTo='  + encodeURIComponent(CAL_RETURN_TO);
                return url;
            }
            let url = '/clientcare/appointments/new?date=' + date;
            if (time)              url += '&startTime='      + time;
            if (CAL_CLIENT_ID)     url += '&clientId='       + CAL_CLIENT_ID;
            if (CAL_SERVICE_ID)    url += '&serviceId='      + CAL_SERVICE_ID;
            if (CAL_REBOOKED_FROM) url += '&rebookedFromId=' + CAL_REBOOKED_FROM;
            if (CAL_LINK_VISIT)    url += '&linkVisitId='    + CAL_LINK_VISIT;
            if (CAL_RETURN_TO)     url += '&returnTo='       + encodeURIComponent(CAL_RETURN_TO);
            return url;
        }

        /** Format JS Date as local YYYY-MM-DDTHH:MM (no timezone suffix). */
        function toLocalISO(date) {
            const p = n => String(n).padStart(2, '0');
            return date.getFullYear() + '-' + p(date.getMonth() + 1) + '-' + p(date.getDate())
                 + 'T' + p(date.getHours()) + ':' + p(date.getMinutes());
        }

        /** POST reschedule; revert event on failure. */
        function reschedule(event, revertFn) {
            if (!event.end) { revertFn(); return; }
            const params = new URLSearchParams({ start: toLocalISO(event.start), end: toLocalISO(event.end) });
            params.append(CSRF_PARAM, CSRF_TOKEN);
            fetch('/clientcare/appointments/' + event.id + '/reschedule', {
                method:  'POST',
                headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
                body:    params.toString()
            }).then(r => { if (!r.ok) revertFn(); }).catch(() => revertFn());
        }

        /**
         * eventContent:
         *   dayGridMonth + mobile  → colored dot
         *   dayGridMonth + desktop → single-line "10:00 Клієнт"
         *   timeGrid*              → time / title / phone
         */
        function buildEventContent(arg) {
            const view   = arg.view.type;
            const status = arg.event.extendedProps.status;
            const start  = arg.event.start;
            const end    = arg.event.end;

            if (view === 'dayGridMonth') {
                if (isMobile()) {
                    const pill = document.createElement('div');
                    pill.className = 'fc-dot-pill';
                    const dot = document.createElement('span');
                    dot.className = 'fc-dot-circle';
                    dot.style.background = eventColor(status, start, end);
                    pill.appendChild(dot);
                    return { domNodes: [pill] };
                }
                // Desktop: single-line pill — colors applied directly so they
                // match timeGrid regardless of FC dot-event / block-event wrapper.
                const s = eventStyle(status, start, end);
                const pill = document.createElement('div');
                pill.className = 'fc-month-pill';
                pill.style.backgroundColor = s.bg;
                pill.style.borderLeft      = '3px solid ' + s.border;
                pill.style.borderRadius    = '3px';
                pill.style.padding         = '0 4px';
                if (arg.timeText) {
                    const t = document.createElement('span');
                    t.className   = 'fc-month-pill-time';
                    t.style.color = s.text;
                    t.textContent = arg.timeText;
                    pill.appendChild(t);
                }
                const title = document.createElement('span');
                title.className   = 'fc-month-pill-title';
                title.style.color = s.text;
                title.textContent = arg.event.title || '';
                pill.appendChild(title);
                return { domNodes: [pill] };
            }

            // Mobile week view: name only — no time row, no phone (columns too narrow)
            if (isMobile() && view === 'timeGridWeek') {
                const w = document.createElement('div');
                w.style.cssText = 'font-size:0.7rem;font-weight:600;line-height:1.2;overflow:hidden;padding:1px 2px;';
                w.textContent = arg.event.title || '';
                return { domNodes: [w] };
            }

            // timeGrid: time + status on one row, then name + phone below
            const wrapper = document.createElement('div');
            wrapper.className = 'fc-event-main-frame';
            if (arg.timeText) {
                const timeRow = document.createElement('div');
                timeRow.className = 'fc-event-time';
                timeRow.style.cssText = 'display:flex;justify-content:space-between;align-items:baseline;gap:0.3em;';
                const timeSpan = document.createElement('span');
                timeSpan.style.cssText = 'min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;';
                timeSpan.textContent = arg.timeText;
                timeRow.appendChild(timeSpan);
                const label = getStatusLabel(status, start, end);
                if (label && !(isMobile() && view === 'timeGridWeek')) {
                    const badge = document.createElement('span');
                    badge.style.cssText = 'display:inline-block;padding:0.15em 0.5em;border-radius:50rem;font-size:1em;font-weight:600;line-height:1.4;flex-shrink:0;white-space:nowrap;background:rgba(0,0,0,0.13);';
                    badge.textContent = label;
                    timeRow.appendChild(badge);
                }
                wrapper.appendChild(timeRow);
            }
            const nameRow = document.createElement('div');
            nameRow.className = 'fc-event-title fc-sticky';
            nameRow.style.cssText = 'display:flex;align-items:baseline;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;';
            const nameSpan = document.createElement('span');
            nameSpan.textContent = arg.event.title || '';
            nameRow.appendChild(nameSpan);
            const phone = arg.event.extendedProps.phone;
            if (phone) {
                const sep = document.createElement('span');
                sep.className = 'fc-event-phone';
                sep.textContent = '\u00b7';
                sep.style.cssText = 'margin:0 0.3em;';
                nameRow.appendChild(sep);
                const phoneSpan = document.createElement('span');
                phoneSpan.className = 'fc-event-phone';
                phoneSpan.textContent = phone;
                nameRow.appendChild(phoneSpan);
            }
            wrapper.appendChild(nameRow);
            return { domNodes: [wrapper] };
        }

        function bcp47() {
            return FC_LOCALE === 'uk' ? 'uk-UA' : FC_LOCALE === 'pl' ? 'pl-PL' : 'en-US';
        }

        /** Update custom mobile toolbar: period label + active view button. */
        function updateMobileToolbar(view) {
            const label = document.getElementById('calPeriodLabel');
            if (label) {
                if (view.type === 'timeGridDay') {
                    const weekday = view.currentStart.toLocaleDateString(bcp47(), { weekday: 'long' });
                    label.innerHTML = view.title
                        + '<br><span style="font-weight:700;color:#6c757d;">' + weekday + '</span>';
                    label.style.whiteSpace = 'normal';
                } else {
                    label.textContent    = view.title;
                    label.style.whiteSpace = 'nowrap';
                }
            }

            const viewMap = { timeGridDay: 'viewDay', timeGridWeek: 'viewWeek', dayGridMonth: 'viewMonth' };
            document.querySelectorAll('.cal-view-btn').forEach(b => b.classList.remove('active'));
            const activeId = viewMap[view.type];
            if (activeId) {
                const btn = document.getElementById(activeId);
                if (btn) btn.classList.add('active');
            }

            // Day view: tasks button. Week/month: legend button.
            const isDay = view.type === 'timeGridDay';
            const legendBtn = document.getElementById('calLegendMobile');
            const tasksBtn  = document.getElementById('calTasksBtn');
            if (legendBtn) legendBtn.style.display = isDay ? 'none' : '';
            if (tasksBtn)  tasksBtn.style.display  = isDay ? '' : 'none';
        }

        document.addEventListener('DOMContentLoaded', function () {
            const defaultView = isMobile() ? 'timeGridDay' : 'timeGridWeek';
            const savedView   = localStorage.getItem('fcView') || defaultView;

            const hasBack = CAL_RETURN_TO && !CAL_CLIENT_ID;

            const cal = new FullCalendar.Calendar(document.getElementById('calendar'), {
                initialView: savedView,
                initialDate: INITIAL_DATE || undefined,
                locale:      FC_LOCALE,
                height:      'auto',
                firstDay:    1,

                customButtons: Object.assign(
                    hasBack ? { backBtn: { text: '←', click: function() { window.location.href = CAL_RETURN_TO; } } } : {},
                    { legendBtn: { text: 'ⓘ', click: function() {} } }
                ),

                headerToolbar: {
                    left:   hasBack ? 'backBtn prev,next today' : 'prev,next today',
                    center: 'title',
                    right:  'timeGridDay,timeGridWeek,dayGridMonth legendBtn'
                },

                slotMinTime:  '08:00:00',
                slotMaxTime:  '21:00:00',
                slotDuration: '00:30:00',
                scrollTime:   '09:00:00',
                allDaySlot:   false,

                businessHours: {
                    daysOfWeek: [1, 2, 3, 4, 5, 6],
                    startTime:  '09:00',
                    endTime:    '19:00'
                },

                nowIndicator: true,
                editable:   true,
                selectable: false,

                events: '/clientcare/appointments/api',

                datesSet: function (info) {
                    localStorage.setItem('fcView', info.view.type);
                    updateMobileToolbar(info.view);

                    // Desktop: weekday subtitle below FC title in day view
                    const titleEl = document.querySelector('.fc-toolbar-title');
                    if (titleEl) {
                        let sub = titleEl.querySelector('.fc-title-weekday');
                        if (info.view.type === 'timeGridDay') {
                            if (!sub) {
                                sub = document.createElement('div');
                                sub.className = 'fc-title-weekday';
                                sub.style.cssText = 'font-weight:700;color:#6c757d;margin-top:1px;line-height:1;';
                                titleEl.appendChild(sub);
                            }
                            sub.textContent = info.view.currentStart.toLocaleDateString(bcp47(), { weekday: 'long' });
                        } else if (sub) {
                            sub.remove();
                        }
                    }

                    // Update tasks badge and today alert in day view
                    if (info.view.type === 'timeGridDay') {
                        loadTaskCountForDate(info.view.currentStart);
                    } else {
                        updateTasksBadge(0);
                        var alertEl = document.getElementById('todayTasksAlert');
                        if (alertEl) { alertEl.classList.add('d-none'); alertEl.classList.remove('d-flex'); }
                    }
                },

                eventContent: buildEventContent,

                eventDidMount: function (info) {
                    const s = eventStyle(
                        info.event.extendedProps.status,
                        info.event.start,
                        info.event.end
                    );
                    info.el.style.backgroundColor = s.bg;
                    info.el.style.borderColor     = s.border;
                    info.el.style.setProperty('--fc-event-text-color', s.text);
                    info.el.querySelectorAll('div, span').forEach(function(el) {
                        el.style.color      = s.text;
                        el.style.fontWeight = '700';
                    });
                },

                eventClick: function (info) {
                    info.jsEvent.preventDefault();
                    if (isMobile() && info.view.type === 'dayGridMonth') {
                        cal.changeView('timeGridDay', info.event.start);
                        return;
                    }
                    window.location.href = info.event.extendedProps.editUrl;
                },

                dateClick: function (info) {
                    if (isMobile() && info.view.type === 'dayGridMonth') {
                        cal.changeView('timeGridDay', info.date);
                        return;
                    }
                    if (info.date < new Date()) return;
                    window.location.href = newApptUrl(info.dateStr);
                },

                moreLinkClick: function (info) {
                    if (isMobile()) {
                        cal.changeView('timeGridDay', info.date);
                        return 'prevent';
                    }
                },

                eventAllow: function (dropInfo) {
                    return dropInfo.start >= new Date();
                },

                eventDrop:   function (info) { reschedule(info.event, info.revert); },
                eventResize: function (info) { reschedule(info.event, info.revert); }
            });

            cal.render();

            // ── Calendar legend popover ────────────────────────────────────
            function buildLegendHtml() {
                const items = [
                    { bg: '#fff3cd', border: '#ffe69c', text: '#664d03', label: 'Заплановано' },
                    { bg: '#d1e7dd', border: '#a3cfbb', text: '#0a3622', label: 'Підтверджено / У процесі' },
                    { bg: '#e2e3e5', border: '#c4c8cb', text: '#41464b', label: 'Завершено' },
                    { bg: '#f5e6f0', border: '#d4b8d4', text: '#6b4c6b', label: 'Скасовано' },
                    { bg: '#fd7e14', border: '#fd7e14', text: '#fff',    label: 'Не прийшов' },
                    { bg: '#f8d7da', border: '#f1aeb5', text: '#842029', label: 'Прострочено' },
                ];
                let html = '<div style="min-width:175px;font-size:0.82rem;">';
                items.forEach(function(i) {
                    html += '<div style="display:flex;align-items:center;gap:0.5rem;margin-bottom:0.3rem;">'
                        + '<span style="display:inline-block;width:13px;height:13px;border-radius:3px;'
                        + 'background:' + i.bg + ';border:1.5px solid ' + i.border + ';flex-shrink:0;"></span>'
                        + '<span>' + i.label + '</span></div>';
                });
                html += '</div>';
                return html;
            }
            const legendContent = buildLegendHtml();
            const popoverOpts = { html: true, content: legendContent, placement: 'bottom', trigger: 'click', sanitize: false };

            const mobileLegendEl = document.getElementById('calLegendMobile');
            if (mobileLegendEl) new bootstrap.Popover(mobileLegendEl, popoverOpts);

            const desktopLegendEl = document.querySelector('.fc-legendBtn-button');
            if (desktopLegendEl) new bootstrap.Popover(desktopLegendEl, popoverOpts);

            // Close legend popover when clicking outside
            document.addEventListener('click', function(e) {
                if (!e.target.closest('#calLegendMobile') && !e.target.closest('.fc-legendBtn-button') && !e.target.closest('.popover')) {
                    [mobileLegendEl, desktopLegendEl].forEach(function(el) {
                        if (el) { const p = bootstrap.Popover.getInstance(el); if (p) p.hide(); }
                    });
                }
            });

            // ── Wire up mobile custom toolbar ──────────────────────────────
            if (isMobile()) {
                // Today banner: format today's date with locale
                const bcp = FC_LOCALE === 'uk' ? 'uk-UA' : FC_LOCALE === 'pl' ? 'pl-PL' : 'en-US';
                const now = new Date();
                const datePart = new Intl.DateTimeFormat(bcp, {
                    weekday: 'long', day: 'numeric', month: 'long', year: 'numeric'
                }).format(now);
                // Capitalize first letter of TODAY_LABEL
                const label = TODAY_LABEL.charAt(0).toUpperCase() + TODAY_LABEL.slice(1);
                const todaySpan = document.getElementById('todayLabel');
                if (todaySpan) todaySpan.textContent = label + ' — ' + datePart;

                // Navigation buttons
                const el = id => document.getElementById(id);
                el('todayBanner').onclick = () => cal.today();
                el('calPrev').onclick     = () => cal.prev();
                el('calNext').onclick     = () => cal.next();
                el('viewDay').onclick     = () => cal.changeView('timeGridDay');
                el('viewWeek').onclick    = () => cal.changeView('timeGridWeek');
                el('viewMonth').onclick   = () => cal.changeView('dayGridMonth');
            }

            // ── Calendar Tasks modal ──────────────────────────────────────────
            const CAL_TASKS_TITLE_TPL  = /*[[#{calendar.tasks.modal.title}]]*/ 'Tasks for {0}';
            const CAL_TASKS_EMPTY      = /*[[#{calendar.tasks.empty}]]*/ 'No tasks';
            const CAL_TASKS_SAVE_LBL   = /*[[#{calendar.tasks.save}]]*/ 'Save';
            const CAL_TASKS_ADD_LBL    = /*[[#{calendar.tasks.add}]]*/ 'Add task';
            const CAL_TASKS_EDIT_LBL        = /*[[#{calendar.tasks.edit}]]*/ 'Edit';
            const CAL_TASKS_CANCEL_LBL      = /*[[#{btn.cancel}]]*/ 'Cancel';
            const CAL_TASKS_DELETE_CONFIRM  = /*[[#{calendar.tasks.delete.confirm}]]*/ 'Delete this task?';

            let _tasksDate = null; // ISO date string for the currently loaded day

            function todayIso() {
                return new Intl.DateTimeFormat('en-CA').format(new Date());
            }

            function dateToLocalIsoDate(dateObj) {
                return new Intl.DateTimeFormat('en-CA').format(dateObj);
            }

            function updateTasksBadge(count) {
                const badge = document.getElementById('calTasksBadge');
                if (!badge) return;
                if (count > 0) {
                    badge.textContent = count > 9 ? '9+' : count;
                    badge.style.display = '';
                } else {
                    badge.style.display = 'none';
                }
            }

            function updateTodayAlert(iso, pendingCount) {
                const alertEl = document.getElementById('todayTasksAlert');
                if (!alertEl) return;
                if (pendingCount > 0) {
                    document.getElementById('todayTasksAlertCount').textContent = pendingCount;
                    alertEl.classList.remove('d-none');
                    alertEl.classList.add('d-flex');
                } else {
                    alertEl.classList.add('d-none');
                    alertEl.classList.remove('d-flex');
                }
            }

            function loadTaskCountForDate(dateObj) {
                const iso = dateToLocalIsoDate(dateObj);
                fetch('/clientcare/calendar-tasks/api/counts?start=' + iso + '&end=' + iso)
                    .then(r => r.ok ? r.json() : {})
                    .then(function(data) {
                        const count = data[iso] || 0;
                        updateTasksBadge(count);
                        updateTodayAlert(iso, count);
                    })
                    .catch(() => {});
            }

            function buildTaskRow(t) {
                var row = document.createElement('div');
                row.className = 'cal-task-row d-flex align-items-start gap-2 py-1 border-bottom';
                row.dataset.id = t.id;

                var check = document.createElement('input');
                check.type = 'checkbox';
                check.className = 'form-check-input mt-1 flex-shrink-0';
                check.checked = t.done;
                check.addEventListener('change', function() { toggleTaskDone(t.id, row, check); });

                // View mode: text + optional client link
                var viewEl = document.createElement('div');
                viewEl.className = 'cal-task-view flex-grow-1';

                var textEl = document.createElement('span');
                textEl.className = 'small d-block';
                textEl.style.cssText = t.done ? 'text-decoration:line-through;color:#6c757d;' : '';
                if (t.clientId && t.clientName && t.text.indexOf(t.clientName) !== -1) {
                    var idx = t.text.indexOf(t.clientName);
                    textEl.appendChild(document.createTextNode(t.text.slice(0, idx)));
                    var nameLink = document.createElement('a');
                    nameLink.href = '/clientcare/clients/' + t.clientId;
                    nameLink.style.color = 'var(--accent)';
                    nameLink.textContent = t.clientName;
                    textEl.appendChild(nameLink);
                    textEl.appendChild(document.createTextNode(t.text.slice(idx + t.clientName.length)));
                } else {
                    textEl.textContent = t.text;
                }
                viewEl.appendChild(textEl);

                // Edit mode: date + textarea + save/cancel (hidden initially)
                var editEl = document.createElement('div');
                editEl.className = 'cal-task-edit flex-grow-1';
                editEl.style.display = 'none';

                var dateInput = document.createElement('input');
                dateInput.type = 'date';
                dateInput.className = 'form-control form-control-sm mb-1';
                editEl.appendChild(dateInput);

                var ta = document.createElement('textarea');
                ta.className = 'form-control form-control-sm mb-1';
                ta.rows = 2;
                ta.value = t.text;
                editEl.appendChild(ta);

                var origDate = _tasksDate; // captured when pencil clicked (see editBtn listener)

                function syncEditSaveBtn() {
                    var textChanged = ta.value.trim() !== t.text.trim();
                    var dateChanged = dateInput.value !== origDate;
                    saveEditBtn.disabled = (!textChanged && !dateChanged) || !ta.value.trim() || !dateInput.value;
                }

                var editBtns = document.createElement('div');
                editBtns.className = 'd-flex gap-1 justify-content-end';

                var cancelEditBtn = document.createElement('button');
                cancelEditBtn.type = 'button';
                cancelEditBtn.className = 'btn btn-outline-secondary btn-sm';
                cancelEditBtn.textContent = CAL_TASKS_CANCEL_LBL;
                cancelEditBtn.addEventListener('click', function() {
                    ta.value = t.text;
                    dateInput.value = origDate;
                    check.style.display   = '';
                    editEl.style.display  = 'none';
                    viewEl.style.display  = '';
                    editBtn.style.display = '';
                    delBtn.style.display  = '';
                });

                var saveEditBtn = document.createElement('button');
                saveEditBtn.type = 'button';
                saveEditBtn.className = 'btn btn-primary btn-sm cal-task-edit-save';
                saveEditBtn.textContent = CAL_TASKS_SAVE_LBL;
                saveEditBtn.disabled = true;
                ta.addEventListener('input', syncEditSaveBtn);
                dateInput.addEventListener('change', syncEditSaveBtn);

                saveEditBtn.addEventListener('click', function() {
                    var newText = ta.value.trim();
                    var newDate = dateInput.value;
                    if (!newText || !newDate) return;
                    saveEditBtn.disabled = true;
                    var params = new URLSearchParams();
                    params.append('taskDate', newDate);
                    params.append('text', newText);
                    params.append(CSRF_PARAM, CSRF_TOKEN);
                    fetch('/clientcare/calendar-tasks/api/' + t.id + '/update', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
                        body: params.toString()
                    }).then(function(r) {
                        if (r.ok) {
                            if (newDate !== origDate) {
                                // Task moved to another day — remove from this list
                                row.remove();
                                var remaining = document.querySelectorAll('.cal-task-row').length;
                                if (remaining === 0) document.getElementById('calTasksEmpty').style.display = '';
                                var pending = 0;
                                document.querySelectorAll('.cal-task-row').forEach(function(r2) {
                                    var cb = r2.querySelector('input[type=checkbox]');
                                    if (cb && !cb.checked) pending++;
                                });
                                updateTasksBadge(pending);
                                updateTodayAlert(origDate, pending);
                            } else {
                                t.text = newText;
                                // Rebuild textEl content (may include client name link)
                                while (textEl.firstChild) textEl.removeChild(textEl.firstChild);
                                if (t.clientId && t.clientName && newText.indexOf(t.clientName) !== -1) {
                                    var idx = newText.indexOf(t.clientName);
                                    textEl.appendChild(document.createTextNode(newText.slice(0, idx)));
                                    var nl = document.createElement('a');
                                    nl.href = '/clientcare/clients/' + t.clientId;
                                    nl.style.color = 'var(--accent)';
                                    nl.textContent = t.clientName;
                                    textEl.appendChild(nl);
                                    textEl.appendChild(document.createTextNode(newText.slice(idx + t.clientName.length)));
                                } else {
                                    textEl.textContent = newText;
                                }
                                ta.value = newText;
                                check.style.display   = '';
                                editEl.style.display  = 'none';
                                viewEl.style.display  = '';
                                editBtn.style.display = '';
                                delBtn.style.display  = '';
                            }
                        } else {
                            saveEditBtn.disabled = false;
                        }
                    }).catch(function() { saveEditBtn.disabled = false; });
                });

                editBtns.appendChild(cancelEditBtn);
                editBtns.appendChild(saveEditBtn);
                editEl.appendChild(editBtns);

                // Action buttons: edit + delete (shown in view mode)
                var editBtn = document.createElement('button');
                editBtn.type = 'button';
                editBtn.className = 'btn btn-link btn-sm p-0 text-secondary flex-shrink-0';
                editBtn.innerHTML = '<i class="bi bi-pencil"></i>';
                editBtn.title = CAL_TASKS_EDIT_LBL;
                editBtn.addEventListener('click', function() {
                    origDate = _tasksDate; // capture current day at open time
                    dateInput.value = origDate;
                    ta.value = t.text;
                    saveEditBtn.disabled = true;
                    check.style.display   = 'none';
                    viewEl.style.display  = 'none';
                    editBtn.style.display = 'none';
                    delBtn.style.display  = 'none';
                    editEl.style.display  = '';
                    ta.focus();
                });

                var delBtn = document.createElement('button');
                delBtn.type = 'button';
                delBtn.className = 'btn btn-link btn-sm p-0 text-danger flex-shrink-0';
                delBtn.innerHTML = '<i class="bi bi-x-lg"></i>';
                delBtn.addEventListener('click', function() { deleteTask(t.id, row); });

                row.appendChild(check);
                row.appendChild(viewEl);
                row.appendChild(editEl);
                row.appendChild(editBtn);
                row.appendChild(delBtn);
                return row;
            }

            function renderTasksList(tasks) {
                const list  = document.getElementById('calTasksList');
                const empty = document.getElementById('calTasksEmpty');
                list.querySelectorAll('.cal-task-row').forEach(el => el.remove());
                if (tasks.length === 0) {
                    empty.style.display = '';
                    return;
                }
                empty.style.display = 'none';
                tasks.forEach(function(t) {
                    list.appendChild(buildTaskRow(t));
                });
            }

            function loadTasksForDate(iso) {
                _tasksDate = iso;
                fetch('/clientcare/calendar-tasks/api?date=' + iso)
                    .then(r => r.ok ? r.json() : [])
                    .then(function(tasks) {
                        renderTasksList(tasks);
                        const pending = tasks.filter(t => !t.done).length;
                        updateTasksBadge(pending);
                        updateTodayAlert(iso, pending);
                    })
                    .catch(() => {});
            }

            function toggleTaskDone(id, row, check) {
                var params = new URLSearchParams();
                params.append(CSRF_PARAM, CSRF_TOKEN);
                fetch('/clientcare/calendar-tasks/api/' + id + '/done', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
                    body: params.toString()
                }).then(function(r) {
                    if (r.ok) {
                        var textEl = row.querySelector('span.small');
                        if (textEl) textEl.style.cssText = check.checked ? 'text-decoration:line-through;color:#6c757d;' : '';
                        if (_tasksDate) {
                            var rows = document.querySelectorAll('.cal-task-row');
                            var pending = 0;
                            rows.forEach(function(r2) {
                                var cb = r2.querySelector('input[type=checkbox]');
                                if (cb && !cb.checked) pending++;
                            });
                            updateTasksBadge(pending);
                            updateTodayAlert(_tasksDate, pending);
                        }
                    } else {
                        check.checked = !check.checked;
                    }
                }).catch(function() { check.checked = !check.checked; });
            }

            function deleteTask(id, row) {
                if (!confirm(CAL_TASKS_DELETE_CONFIRM)) return;
                var params = new URLSearchParams();
                params.append(CSRF_PARAM, CSRF_TOKEN);
                fetch('/clientcare/calendar-tasks/api/' + id + '/delete', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
                    body: params.toString()
                }).then(function(r) {
                    if (r.ok) {
                        row.remove();
                        var remaining = document.querySelectorAll('.cal-task-row').length;
                        if (remaining === 0) document.getElementById('calTasksEmpty').style.display = '';
                        if (_tasksDate) {
                            var rows = document.querySelectorAll('.cal-task-row');
                            var pending = 0;
                            rows.forEach(function(r2) {
                                var cb = r2.querySelector('input[type=checkbox]');
                                if (cb && !cb.checked) pending++;
                            });
                            updateTasksBadge(pending);
                            updateTodayAlert(_tasksDate, pending);
                        }
                    }
                }).catch(() => {});
            }

            const calTasksModalEl = document.getElementById('calTasksModal');
            if (calTasksModalEl) {
                calTasksModalEl.addEventListener('show.bs.modal', function() {
                    // Determine current day view date from FullCalendar
                    if (typeof cal !== 'undefined' && cal.view.type === 'timeGridDay') {
                        const d = cal.view.currentStart;
                        const iso = dateToLocalIsoDate(d);
                        const formatted = d.toLocaleDateString(
                            FC_LOCALE === 'uk' ? 'uk-UA' : FC_LOCALE === 'pl' ? 'pl-PL' : 'en-US',
                            { day: 'numeric', month: 'long', year: 'numeric' }
                        );
                        document.getElementById('calTasksModalTitle').textContent =
                            CAL_TASKS_TITLE_TPL.replace('{0}', formatted);
                        loadTasksForDate(iso);
                    }
                    // Reset add form
                    document.getElementById('calTaskNoteRow').style.display = 'none';
                    document.getElementById('calTaskAddBtn').style.display = '';
                    document.getElementById('calTaskText').value = '';
                });

                document.getElementById('calTaskAddBtn').addEventListener('click', function() {
                    this.style.display = 'none';
                    document.getElementById('calTaskNoteRow').style.display = '';
                    document.getElementById('calTaskText').focus();
                });

                document.getElementById('calTaskCancelAdd').addEventListener('click', function() {
                    document.getElementById('calTaskNoteRow').style.display = 'none';
                    document.getElementById('calTaskAddBtn').style.display = '';
                    document.getElementById('calTaskText').value = '';
                });

                document.getElementById('calTaskSaveBtn').addEventListener('click', function() {
                    var btn = this;
                    var text = document.getElementById('calTaskText').value.trim();
                    if (!text || !_tasksDate) return;
                    btn.disabled = true;

                    var params = new URLSearchParams();
                    params.append('taskDate', _tasksDate);
                    params.append('text', text);
                    params.append(CSRF_PARAM, CSRF_TOKEN);

                    fetch('/clientcare/calendar-tasks/api', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
                        body: params.toString()
                    }).then(function(r) {
                        if (r.ok || r.status === 201) {
                            return r.json().then(function(task) {
                                document.getElementById('calTaskText').value = '';
                                document.getElementById('calTaskNoteRow').style.display = 'none';
                                document.getElementById('calTaskAddBtn').style.display = '';
                                loadTasksForDate(_tasksDate);
                            });
                        }
                        btn.disabled = false;
                    }).catch(function() { btn.disabled = false; });
                });
            }
        });
        /*]]>*/
    </script>
</div>
</body>
</html>
