<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout/clientcare :: layout(#{drive.folder.form.title}, ~{::content})}">
<body>
<div th:fragment="content">

    <div class="page-header">
        <div>
            <h1 class="page-title" th:text="#{drive.folder.form.title}">Папка Google Drive</h1>
            <div class="text-muted" style="font-size:0.85rem;" th:text="${client.name}"></div>
        </div>
        <a th:href="@{/clientcare/clients/{id}(id=${client.id})}"
           class="btn btn-outline-secondary btn-sm">
            <i class="bi bi-arrow-left me-1"></i>
            <span class="d-none d-sm-inline" th:text="#{btn.back}">Назад</span>
        </a>
    </div>

    <div class="card" style="max-width: 600px;">
        <div class="card-body">
            <form id="driveFolderForm"
                  th:action="@{/clientcare/clients/{id}/drive-folder(id=${client.id})}"
                  th:object="${driveFolder}" method="post">
                <input type="hidden" th:field="*{clientId}"/>

                <div class="mb-3">
                    <label class="form-label fw-semibold" th:text="#{drive.folder.form.url}">Посилання на папку</label>
                    <input id="driveFolderUrl" type="url" class="form-control"
                           th:field="*{driveFolderUrl}"
                           th:classappend="${#fields.hasErrors('driveFolderUrl')} ? 'is-invalid'"
                           th:placeholder="#{drive.folder.form.url.hint}"
                           oninput="syncSaveBtn()"/>
                    <div class="invalid-feedback" th:if="${#fields.hasErrors('driveFolderUrl')}"
                         th:errors="*{driveFolderUrl}"></div>
                    <div class="form-text text-muted small" th:text="#{drive.folder.form.url.help}"></div>
                </div>

                <div class="d-flex gap-2 justify-content-end">
                    <a th:href="@{/clientcare/clients/{id}(id=${client.id})}"
                       class="btn btn-outline-secondary btn-sm" th:text="#{btn.cancel}">Скасувати</a>
                    <button id="saveBtn" type="submit" class="btn btn-primary btn-sm" disabled
                            th:text="#{btn.save}">Зберегти</button>
                </div>
            </form>
        </div>
    </div>

    <style>
        #saveBtn:disabled { background-color: transparent; border-color: #6c757d; color: #6c757d; opacity: 0.65; }
    </style>
    <script th:inline="javascript">
        const INITIAL_URL = /*[[${driveFolder.driveFolderUrl}]]*/ '';

        function syncSaveBtn() {
            const current = document.getElementById('driveFolderUrl').value.trim();
            const initial = (INITIAL_URL || '').trim();
            document.getElementById('saveBtn').disabled = (current === initial || current === '');
        }

        document.addEventListener('DOMContentLoaded', syncSaveBtn);
    </script>

</div>
</body>
</html>
