<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout/clientcare :: layout(${client.name}, ~{::content})}">
<body>
<div th:fragment="content">

    <style>
        .drive-gallery-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 1rem;
        }
        @media (max-width: 575.98px) {
            .drive-gallery-grid {
                grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
                gap: 0.625rem;
            }
        }
        .drive-tile {
            border: 1px solid var(--bs-border-color);
            border-radius: 0.5rem;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }
        .drive-tile-thumb {
            display: block;
            aspect-ratio: 1;
            overflow: hidden;
            background: #f1f3f5;
            text-decoration: none;
            cursor: pointer;
        }
        .drive-tile-thumb img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
            transition: opacity 0.15s;
        }
        .drive-tile-thumb img:hover { opacity: 0.88; }
        .drive-tile-fallback {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 100%;
            height: 100%;
            color: #adb5bd;
            font-size: 3rem;
        }
        .drive-tile-body {
            padding: 0.5rem 0.625rem;
            display: flex;
            flex-direction: column;
            gap: 0.25rem;
            flex: 1;
        }
        .drive-tile-name {
            font-size: 0.78rem;
            font-weight: 500;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .drive-tile-date {
            font-size: 0.72rem;
            color: #6c757d;
        }
        .drive-tile-actions {
            margin-top: auto;
            padding-top: 0.375rem;
        }
    </style>

    <div class="page-header">
        <div>
            <h1 class="page-title" th:text="${client.name}"></h1>
            <span class="text-muted small" th:text="#{drive.photos.title}">Фото з Google Drive</span>
        </div>
        <a th:href="${backUrl}" class="btn btn-outline-secondary btn-sm">
            <i class="bi bi-arrow-left me-1"></i>
            <span th:text="#{btn.back}">Назад</span>
        </a>
    </div>

    <!-- No folder found -->
    <div th:if="${noFolder}" class="text-center text-muted py-5">
        <i class="bi bi-folder2-open fs-1 d-block mb-2 opacity-50"></i>
        <p th:text="#{drive.photos.noFolder}">Папку з фото для цього клієнта не знайдено</p>
        <p class="small" th:text="#{drive.photos.noFolder.hint(${client.name})}">
            Створіть папку з іменем клієнта у спільній папці Drive
        </p>
    </div>

    <!-- API error -->
    <div th:if="${driveError}" class="alert alert-warning d-flex align-items-center gap-2">
        <i class="bi bi-exclamation-triangle-fill flex-shrink-0"></i>
        <span th:text="#{drive.photos.error}">Не вдалося отримати фото з Google Drive. Перевірте доступ до папки.</span>
    </div>

    <!-- Empty — folder set but no images -->
    <div th:if="${!noFolder and !driveError and drivePhotos.isEmpty()}"
         class="text-center text-muted py-5">
        <i class="bi bi-images fs-1 d-block mb-2 opacity-50"></i>
        <span th:text="#{drive.photos.empty}">Фотографій в папці не знайдено</span>
    </div>

    <!-- Gallery grid -->
    <div th:unless="${noFolder or driveError or drivePhotos.isEmpty()}" class="drive-gallery-grid">
        <div th:each="photo : ${drivePhotos}" class="drive-tile">
            <a th:href="${photo.webViewLink}" target="_blank" rel="noopener"
               class="drive-tile-thumb"
               th:title="#{drive.photos.open}">
                <img th:src="${photo.thumbnailUrl}"
                     th:alt="${photo.name}"
                     onerror="this.style.display='none';this.nextElementSibling.style.display='flex'"/>
                <span class="drive-tile-fallback" style="display:none">
                    <i class="bi bi-image"></i>
                </span>
            </a>
            <div class="drive-tile-body">
                <div class="drive-tile-name" th:text="${photo.name}"></div>
                <div th:if="${photo.createdTime != null}" class="drive-tile-date"
                     th:text="${#temporals.format(photo.createdTime, 'dd.MM.yyyy')}"></div>
                <div class="drive-tile-actions">
                    <a th:href="${photo.webViewLink}" target="_blank" rel="noopener"
                       class="btn btn-outline-secondary btn-sm w-100">
                        <i class="bi bi-box-arrow-up-right me-1"></i>
                        <span th:text="#{drive.photos.open}">Відкрити в Drive</span>
                    </a>
                </div>
            </div>
        </div>
    </div>

</div>
</body>
</html>
