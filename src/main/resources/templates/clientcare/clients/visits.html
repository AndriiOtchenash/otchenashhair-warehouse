<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout/clientcare :: layout(${client.name}, ~{::content})}">
<body>
<div th:fragment="content">

    <div class="page-header">
        <div>
            <h1 class="page-title" th:text="${client.name}"></h1>
            <span class="text-muted small" th:text="#{visit.section.title}">Візити</span>
        </div>
        <div class="d-flex gap-2">
            <a th:href="@{/clientcare/visits/new(clientId=${client.id}, returnTo='/clientcare/clients/' + ${client.id} + '/visits')}"
               class="btn btn-outline-primary btn-sm">
                <i class="bi bi-plus-lg me-1"></i>
                <span th:text="#{visit.add}">Додати візит</span>
            </a>
            <a th:href="${returnTo != null ? returnTo : '/clientcare/clients/' + client.id}"
               class="btn btn-outline-secondary btn-sm">
                <i class="bi bi-arrow-left me-1"></i>
                <span th:text="#{btn.back}">Назад</span>
            </a>
        </div>
    </div>

    <div th:if="${visits.isEmpty()}" class="text-muted py-4 text-center">
        <i class="bi bi-calendar-x fs-1 d-block mb-2 opacity-50"></i>
        <span th:text="#{visit.empty}">Візитів поки немає</span>
    </div>

    <div th:unless="${visits.isEmpty()}" class="d-flex flex-column gap-3">
        <div th:each="visit, visitStat : ${visits}" class="card">
            <div class="card-body py-2 px-3">
                <div class="d-flex justify-content-between align-items-start gap-3">
                    <div style="min-width:0; flex:1">
                        <div class="fw-semibold"
                             th:text="${#temporals.format(visit.visitDate, 'dd.MM.yyyy')}"></div>
                        <div th:if="${visit.complaint != null and !visit.complaint.isEmpty()}"
                             class="text-muted small mt-1">
                            <span class="fw-semibold" th:text="#{visit.form.complaint}">Скарга</span>:
                            <span th:text="${visit.complaint}"></span>
                        </div>
                        <div th:if="${visit.scalpCondition != null and !visit.scalpCondition.isEmpty()}"
                             class="text-muted small mt-1">
                            <span class="fw-semibold" th:text="#{visit.form.scalpCondition}">Стан</span>:
                            <span th:text="${visit.scalpCondition}"></span>
                        </div>
                        <div th:if="${visit.recommendations != null and !visit.recommendations.isEmpty()}"
                             class="small mt-1">
                            <span class="fw-semibold" th:text="#{visit.form.recommendations}">Рекомендації</span>:
                            <span th:text="${visit.recommendations}"></span>
                        </div>
                        <div th:if="${visit.notes != null and !visit.notes.isEmpty()}"
                             class="text-muted small mt-1 fst-italic">
                            <span class="fw-semibold fst-normal" th:text="#{visit.form.notes}">Нотатки</span>:
                            <span th:text="${visit.notes}"></span>
                        </div>
                        <div th:if="${visit.nextAppointmentId != null}" class="small mt-1 text-success">
                            <i class="bi bi-calendar-check-fill me-1"></i>
                            <span th:text="#{visit.nextAppointment.label}">Наступний запис:</span>
                            <strong th:text="${#temporals.format(visit.nextAppointmentStartAt, 'dd.MM.yyyy')} + ' о ' + ${#temporals.format(visit.nextAppointmentStartAt, 'HH:mm')}"></strong>
                        </div>
                        <div th:if="${visit.nextAppointmentId == null and visitStat.first and !hasUpcomingAppointment}" class="small mt-1 text-warning">
                            <i class="bi bi-calendar-x me-1"></i>
                            <span th:text="#{visit.nextAppointment.notScheduled}">Не запланований</span>
                        </div>
                    </div>
                    <div class="d-flex gap-1 flex-shrink-0">
                        <a th:href="@{/clientcare/visits/{id}/edit(id=${visit.id}, returnTo='/clientcare/clients/' + ${client.id} + '/visits')}"
                           class="btn btn-outline-primary btn-sm">
                            <i class="bi bi-pencil"></i>
                        </a>
                        <form th:action="@{/clientcare/visits/{id}/delete(id=${visit.id})}"
                              method="post" class="d-inline">
                            <input type="hidden" name="clientId" th:value="${client.id}"/>
                            <input type="hidden" name="returnTo" value="visits"/>
                            <button type="submit"
                                    class="btn btn-outline-danger btn-sm"
                                    th:onclick="'return confirm(\'' + #{visit.delete.confirm} + '\')'">
                                <i class="bi bi-trash"></i>
                            </button>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>

</div>
</body>
</html>
