<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout/clientcare :: layout(#{gift.form.title}, ~{::content})}">
<body>
<div th:fragment="content">

    <div class="page-header mb-3">
        <h1 class="page-title">
            <i class="bi bi-gift me-2" style="color:var(--accent)"></i>
            <span th:text="${cert.code}">GIFT-2026-0001</span>
        </h1>
        <a th:href="${returnTo != null ? returnTo : '/clientcare/gift-certificates'}" class="btn btn-outline-secondary btn-sm">
            <i class="bi bi-arrow-left me-1"></i>
            <span class="d-none d-md-inline" th:text="#{btn.back}">Назад</span>
        </a>
    </div>

    <!-- Flash messages -->
    <div th:if="${successMessage}" class="alert alert-success alert-dismissible fade show" role="alert">
        <span th:text="${successMessage}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
    </div>
    <div th:if="${errorMessage}" class="alert alert-danger alert-dismissible fade show" role="alert">
        <span th:text="${errorMessage}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
    </div>

    <div class="card" style="max-width: 560px;">
        <div class="card-body">

            <!-- Status badge -->
            <div class="mb-3">
                <span th:switch="${cert.status.name()}">
                    <span th:case="'ACTIVE'"    class="badge bg-success fs-6"   th:text="#{gift.status.ACTIVE}"></span>
                    <span th:case="'REDEEMED'"  class="badge bg-primary fs-6"   th:text="#{gift.status.REDEEMED}"></span>
                    <span th:case="'EXPIRED'"   class="badge bg-warning text-dark fs-6" th:text="#{gift.status.EXPIRED}"></span>
                    <span th:case="'CANCELLED'" class="badge bg-secondary fs-6" th:text="#{gift.status.CANCELLED}"></span>
                </span>
                <span th:if="${cert.active and cert.daysRemaining() <= 30}"
                      class="badge bg-warning text-dark ms-2"
                      th:text="${cert.daysRemaining() + ' д'}"></span>
            </div>

            <!-- Details table -->
            <table class="table table-auto mb-3">
                <tbody>
                <tr>
                    <th class="text-muted fw-normal small" style="width:40%" th:text="#{gift.col.purchaser}">Покупець</th>
                    <td>
                        <a th:if="${cert.purchaserClientId != null}"
                           th:href="@{/clientcare/clients/{id}(id=${cert.purchaserClientId})}"
                           th:text="${cert.purchaserName}"></a>
                        <span th:if="${cert.purchaserClientId == null and cert.purchaserName != null}"
                              th:text="${cert.purchaserName}"></span>
                        <em th:if="${cert.purchaserClientId == null and cert.purchaserName == null}"
                            class="text-muted" th:text="#{gift.from.salon}">від салону</em>
                        <span th:if="${cert.purchaserPhone != null}"
                              class="text-muted small d-block" th:text="${cert.purchaserPhone}"></span>
                    </td>
                </tr>
                <tr>
                    <th class="text-muted fw-normal small" th:text="#{gift.col.recipient}">Отримувач</th>
                    <td>
                        <span th:if="${cert.recipientClientId != null}">
                            <a th:href="@{/clientcare/clients/{id}(id=${cert.recipientClientId})}"
                               th:text="${cert.recipientName}"></a>
                            <span th:if="${cert.recipientPhone != null}"
                                  class="text-muted small d-block" th:text="${cert.recipientPhone}"></span>
                        </span>
                        <span th:unless="${cert.recipientClientId != null}">
                            <span th:text="${cert.recipientName}"></span>
                            <span th:if="${cert.recipientPhone != null}"
                                  class="text-muted small d-block" th:text="${cert.recipientPhone}"></span>
                        </span>
                    </td>
                </tr>
                <tr>
                    <th class="text-muted fw-normal small" th:text="#{gift.col.service}">Послуга</th>
                    <td th:text="${cert.serviceName}"></td>
                </tr>
                <tr>
                    <th class="text-muted fw-normal small" th:text="#{gift.form.expiresAt}">Дійсний до</th>
                    <td th:text="${#temporals.format(cert.expiresAt, 'dd.MM.yyyy')}"></td>
                </tr>
                <tr>
                    <th class="text-muted fw-normal small" th:text="#{gift.col.issued}">Видано</th>
                    <td th:text="${#temporals.format(cert.issuedAt, 'dd.MM.yyyy')}"></td>
                </tr>
                <tr th:if="${cert.redeemedAt != null}">
                    <th class="text-muted fw-normal small" th:text="#{gift.col.redeemed}">Погашено</th>
                    <td th:text="${#temporals.format(cert.redeemedAt, 'dd.MM.yyyy')}"></td>
                </tr>
                <tr th:if="${cert.cancelledAt != null}">
                    <th class="text-muted fw-normal small" th:text="#{gift.col.cancelled}">Скасовано</th>
                    <td th:text="${#temporals.format(cert.cancelledAt, 'dd.MM.yyyy')}"></td>
                </tr>
                <tr th:if="${cert.notes != null and not #strings.isEmpty(cert.notes)}">
                    <th class="text-muted fw-normal small" th:text="#{gift.form.notes}">Примітки</th>
                    <td th:text="${cert.notes}"></td>
                </tr>
                </tbody>
            </table>

            <!-- Actions -->
            <div th:if="${cert.active}" class="d-flex gap-2">
                <form th:action="@{/clientcare/gift-certificates/{id}/redeem(id=${cert.id})}"
                      method="post" class="d-inline">
                    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" th:if="${_csrf != null}"/>
                    <input type="hidden" name="returnTo" th:value="@{/clientcare/gift-certificates/{id}(id=${cert.id})}"/>
                    <button type="submit" class="btn btn-primary"
                            th:data-confirm="#{gift.redeem.confirm}"
                            onclick="return confirm(this.dataset.confirm)">
                        <i class="bi bi-check2-circle me-1"></i>
                        <span th:text="#{gift.btn.redeem}">Погасити</span>
                    </button>
                </form>
                <form th:action="@{/clientcare/gift-certificates/{id}/cancel(id=${cert.id})}"
                      method="post" class="d-inline">
                    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" th:if="${_csrf != null}"/>
                    <input type="hidden" name="returnTo" th:value="@{/clientcare/gift-certificates/{id}(id=${cert.id})}"/>
                    <button type="submit" class="btn btn-outline-danger"
                            th:data-confirm="#{gift.cancel.confirm}"
                            onclick="return confirm(this.dataset.confirm)">
                        <i class="bi bi-x-lg me-1"></i>
                        <span th:text="#{gift.btn.cancel}">Скасувати</span>
                    </button>
                </form>
            </div>
            <div th:if="${cert.redeemed}" class="d-flex gap-2">
                <form th:action="@{/clientcare/gift-certificates/{id}/restore(id=${cert.id})}"
                      method="post" class="d-inline">
                    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" th:if="${_csrf != null}"/>
                    <input type="hidden" name="returnTo" th:value="@{/clientcare/gift-certificates/{id}(id=${cert.id})}"/>
                    <button type="submit" class="btn btn-outline-success"
                            th:data-confirm="#{gift.restore.confirm}"
                            onclick="return confirm(this.dataset.confirm)">
                        <i class="bi bi-arrow-counterclockwise me-1"></i>
                        <span th:text="#{gift.btn.restore}">Відновити</span>
                    </button>
                </form>
                <form th:action="@{/clientcare/gift-certificates/{id}/cancel(id=${cert.id})}"
                      method="post" class="d-inline">
                    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" th:if="${_csrf != null}"/>
                    <input type="hidden" name="returnTo" th:value="@{/clientcare/gift-certificates/{id}(id=${cert.id})}"/>
                    <button type="submit" class="btn btn-outline-danger"
                            th:data-confirm="#{gift.cancel.confirm}"
                            onclick="return confirm(this.dataset.confirm)">
                        <i class="bi bi-x-lg me-1"></i>
                        <span th:text="#{gift.btn.cancel}">Скасувати</span>
                    </button>
                </form>
            </div>

        </div>
    </div>

    <!-- Draft notice -->
    <div class="alert alert-info mt-3 py-2 small" style="max-width: 560px;">
        <i class="bi bi-info-circle me-1"></i>
        <span th:text="#{gift.draft.notice}"></span>
    </div>

</div>
</body>
</html>
