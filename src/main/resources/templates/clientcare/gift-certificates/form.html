<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout/clientcare :: layout(#{gift.form.title}, ~{::content})}">
<body>
<div th:fragment="content">

    <div class="page-header mb-3">
        <h1 class="page-title">
            <i class="bi bi-gift me-2" style="color:var(--accent)"></i>
            <span th:text="#{gift.form.title}">Видати сертифікат</span>
        </h1>
    </div>

    <style>
        .mode-toggle .btn-check:checked + .btn { background: var(--accent); color: #fff; border-color: var(--accent); }
        .purchaser-section { display: none; }
        .purchaser-section.active { display: block; }
    </style>

    <div class="card" style="max-width: 640px;">
        <div class="card-body">

            <form th:action="@{/clientcare/gift-certificates/new}" method="post"
                  th:object="${form}">
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" th:if="${_csrf != null}"/>
                <input type="hidden" th:if="${returnTo != null}" name="returnTo" th:value="${returnTo}"/>

                <!-- Purchaser -->
                <div class="mb-3">
                    <label class="form-label fw-semibold" th:text="#{gift.form.purchaser}">Покупець (хто оплачує)</label>
                    <input type="hidden" th:field="*{fromSalon}"/>
                    <div class="btn-group w-100 mode-toggle mb-2" role="group">
                        <input type="radio" class="btn-check" name="purchaserMode" id="modePurchaserExisting"
                               value="existing" autocomplete="off"
                               th:checked="${!form.fromSalon and (form.purchaserClientId != null or form.purchaserName == null)}"/>
                        <label class="btn btn-outline-secondary" for="modePurchaserExisting"
                               th:text="#{gift.form.purchaser.mode.existing}">Існуючий клієнт</label>

                        <input type="radio" class="btn-check" name="purchaserMode" id="modePurchaserNew"
                               value="new" autocomplete="off"
                               th:checked="${!form.fromSalon and form.purchaserClientId == null and form.purchaserName != null}"/>
                        <label class="btn btn-outline-secondary" for="modePurchaserNew"
                               th:text="#{gift.form.purchaser.mode.new}">Новий</label>

                        <input type="radio" class="btn-check" name="purchaserMode" id="modePurchaserSalon"
                               value="salon" autocomplete="off"
                               th:checked="${form.fromSalon}"/>
                        <label class="btn btn-outline-secondary" for="modePurchaserSalon"
                               th:text="#{gift.form.purchaser.mode.salon}">Від салону</label>
                    </div>

                    <!-- Existing client dropdown -->
                    <div id="sectionPurchaserExisting" class="purchaser-section">
                        <select class="form-select ts-client" th:field="*{purchaserClientId}">
                            <option value="" th:text="#{gift.form.select.client}">— оберіть клієнта —</option>
                            <option th:each="c : ${clients}"
                                    th:value="${c.id}"
                                    th:text="${c.name}"></option>
                        </select>
                    </div>

                    <!-- New purchaser free-text -->
                    <div id="sectionPurchaserNew" class="purchaser-section">
                        <div class="row g-2">
                            <div class="col-md-7">
                                <input type="text" class="form-control" th:field="*{purchaserName}"
                                       th:classappend="${#fields.hasErrors('purchaserName')} ? 'is-invalid'"
                                       th:placeholder="#{gift.form.purchaser.name}"/>
                                <div class="invalid-feedback" th:errors="*{purchaserName}"></div>
                            </div>
                            <div class="col-md-5">
                                <input type="tel" class="form-control" th:field="*{purchaserPhone}"
                                       th:classappend="${#fields.hasErrors('purchaserPhone')} ? 'is-invalid'"
                                       th:placeholder="#{gift.form.purchaser.phone}"
                                       maxlength="20"
                                       oninput="this.value=this.value.replace(/[^+0-9 ()\-]/g,'')"/>
                                <div class="invalid-feedback" th:errors="*{purchaserPhone}"></div>
                            </div>
                        </div>
                    </div>

                    <div th:if="${#fields.hasErrors('purchaserPresent')}"
                         class="text-danger small mt-1" th:errors="*{purchaserPresent}"></div>
                </div>

                <!-- Recipient toggle -->
                <div class="mb-3">
                    <label class="form-label fw-semibold" th:text="#{gift.form.recipient}">Отримувач</label>
                    <div class="d-flex gap-2 mb-2">
                        <button type="button" class="btn btn-sm btn-outline-secondary active" id="btnRecipientClient"
                                onclick="showRecipientMode('client')" th:text="#{gift.form.recipient.existing}">Клієнт із бази</button>
                        <button type="button" class="btn btn-sm btn-outline-secondary" id="btnRecipientFree"
                                onclick="showRecipientMode('free')" th:text="#{gift.form.recipient.new}">Інша людина</button>
                    </div>

                    <!-- Existing client dropdown -->
                    <div id="recipientClientBlock">
                        <select class="form-select ts-client" th:field="*{recipientClientId}"
                                th:classappend="${#fields.hasErrors('recipientClientId')} ? 'is-invalid'">
                            <option value="" th:text="#{gift.form.select.client}">— оберіть клієнта —</option>
                            <option th:each="c : ${clients}"
                                    th:value="${c.id}"
                                    th:text="${c.name}"></option>
                        </select>
                    </div>

                    <!-- Free-text recipient -->
                    <div id="recipientFreeBlock" style="display:none;">
                        <div class="row g-2">
                            <div class="col-md-7">
                                <input type="text" class="form-control" th:field="*{recipientName}"
                                       th:classappend="${#fields.hasErrors('recipientName')} ? 'is-invalid'"
                                       th:placeholder="#{gift.form.recipient.name}"/>
                                <div class="invalid-feedback" th:errors="*{recipientName}"></div>
                            </div>
                            <div class="col-md-5">
                                <input type="tel" class="form-control" th:field="*{recipientPhone}"
                                       th:classappend="${#fields.hasErrors('recipientPhone')} ? 'is-invalid'"
                                       th:placeholder="#{gift.form.recipient.phone}"
                                       maxlength="20"
                                       oninput="this.value=this.value.replace(/[^+0-9 ()\-]/g,'')"/>
                                <div class="invalid-feedback" th:errors="*{recipientPhone}"></div>
                            </div>
                        </div>
                    </div>

                    <div th:if="${#fields.hasErrors('recipientPresent')}"
                         class="text-danger small mt-1" th:errors="*{recipientPresent}"></div>
                </div>

                <!-- Service -->
                <div class="mb-3">
                    <label class="form-label fw-semibold" th:text="#{gift.form.service}">Послуга</label>
                    <select class="form-select" th:field="*{serviceId}"
                            th:classappend="${#fields.hasErrors('serviceId')} ? 'is-invalid'">
                        <option value="" th:text="#{gift.form.select.service}">— оберіть послугу —</option>
                        <option th:each="s : ${services}" th:value="${s.id}" th:text="${s.name}"></option>
                    </select>
                    <div class="invalid-feedback" th:errors="*{serviceId}"></div>
                    <div th:if="${services.empty}" class="form-text text-warning">
                        <i class="bi bi-exclamation-triangle me-1"></i>
                        <a th:href="@{/clientcare/services}" th:text="#{gift.form.service.empty}">Додайте послуги спочатку →</a>
                    </div>
                </div>

                <!-- Expiry date -->
                <div class="mb-3">
                    <label class="form-label fw-semibold" th:text="#{gift.form.expiresAt}">Дійсний до</label>
                    <input type="date" class="form-control" th:field="*{expiresAt}"
                           th:classappend="${#fields.hasErrors('expiresAt')} ? 'is-invalid'"
                           onclick="this.showPicker && this.showPicker()"/>
                    <div class="form-text" th:text="#{gift.form.expiresAt.hint}">За замовчуванням — 6 місяців від сьогодні</div>
                    <div class="invalid-feedback" th:errors="*{expiresAt}"></div>
                </div>

                <!-- Notes -->
                <div class="mb-4">
                    <label class="form-label" th:text="#{gift.form.notes}">Примітки</label>
                    <textarea class="form-control" th:field="*{notes}" rows="2"
                              th:classappend="${#fields.hasErrors('notes')} ? 'is-invalid'"
                              th:placeholder="#{gift.form.notes.hint}"></textarea>
                    <div class="invalid-feedback" th:errors="*{notes}"></div>
                </div>

                <div class="d-flex gap-2">
                    <button type="submit" class="btn btn-success">
                        <i class="bi bi-gift me-1"></i>
                        <span th:text="#{gift.btn.issue}">Видати сертифікат</span>
                    </button>
                    <a th:href="${returnTo != null ? returnTo : '/clientcare/gift-certificates'}"
                       class="btn btn-outline-secondary" th:text="#{btn.cancel}">Скасувати</a>
                </div>
            </form>
        </div>
    </div>

    <script th:inline="javascript">
        const HAS_PURCHASER_CLIENT = /*[[${form.purchaserClientId != null}]]*/ true;
        const HAS_PURCHASER_FREE   = /*[[${not #strings.isEmpty(form.purchaserName)}]]*/ false;
        const HAS_FROM_SALON       = /*[[${form.fromSalon}]]*/ false;
        const HAS_RECIPIENT_CLIENT = /*[[${form.recipientClientId != null}]]*/ false;
        const HAS_RECIPIENT_FREE   = /*[[${not #strings.isEmpty(form.recipientName)}]]*/ false;

        function tsClear(id) {
            const el = document.getElementById(id);
            if (el && el.tomselect) el.tomselect.clear();
            else if (el) el.value = '';
        }

        function syncPurchaserMode(mode) {
            const isExisting = mode === 'existing';
            const isNew      = mode === 'new';
            const isSalon    = mode === 'salon';
            document.getElementById('sectionPurchaserExisting').classList.toggle('active', isExisting);
            document.getElementById('sectionPurchaserNew').classList.toggle('active', isNew);
            document.getElementById('fromSalon').value = isSalon ? 'true' : 'false';
            if (isExisting) {
                document.getElementById('purchaserName').value  = '';
                document.getElementById('purchaserPhone').value = '';
            } else if (isNew) {
                tsClear('purchaserClientId');
            } else {
                tsClear('purchaserClientId');
                document.getElementById('purchaserName').value  = '';
                document.getElementById('purchaserPhone').value = '';
            }
        }

        function showRecipientMode(mode) {
            const isClient = mode === 'client';
            document.getElementById('recipientClientBlock').style.display = isClient ? '' : 'none';
            document.getElementById('recipientFreeBlock').style.display   = isClient ? 'none' : '';
            document.getElementById('btnRecipientClient').classList.toggle('active', isClient);
            document.getElementById('btnRecipientFree').classList.toggle('active', !isClient);
            if (isClient) {
                document.getElementById('recipientName').value  = '';
                document.getElementById('recipientPhone').value = '';
            } else {
                tsClear('recipientClientId');
            }
        }

        document.addEventListener('DOMContentLoaded', function () {
            // Wire purchaser radio buttons
            document.getElementById('modePurchaserExisting').addEventListener('change', function () {
                if (this.checked) syncPurchaserMode('existing');
            });
            document.getElementById('modePurchaserNew').addEventListener('change', function () {
                if (this.checked) syncPurchaserMode('new');
            });
            document.getElementById('modePurchaserSalon').addEventListener('change', function () {
                if (this.checked) syncPurchaserMode('salon');
            });

            // Restore purchaser mode on validation error re-render
            if (HAS_FROM_SALON) {
                syncPurchaserMode('salon');
            } else if (HAS_PURCHASER_FREE && !HAS_PURCHASER_CLIENT) {
                document.getElementById('modePurchaserNew').checked = true;
                syncPurchaserMode('new');
            } else {
                syncPurchaserMode('existing');
            }

            // Restore recipient mode on validation error re-render
            if (HAS_RECIPIENT_FREE) showRecipientMode('free');
        });
    </script>
</div>
</body>
</html>
