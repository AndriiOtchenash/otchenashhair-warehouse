<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout/clientcare :: layout(#{gift.form.title}, ~{::content})}">
<body>
<div th:fragment="content">

    <div class="page-header mb-3">
        <h1 class="page-title">
            <i class="bi bi-gift me-2" style="color:var(--accent)"></i>
            <span th:text="#{gift.form.title}">Видати сертифікат</span>
        </h1>
        <a th:href="${returnTo != null ? returnTo : '/clientcare/gift-certificates'}"
           class="btn btn-outline-secondary btn-sm">
            <i class="bi bi-arrow-left me-1"></i>
            <span class="d-none d-sm-inline" th:text="#{btn.back}">Назад</span>
        </a>
    </div>

    <style>
        .mode-toggle .btn-check:checked + .btn { background: var(--accent); color: #fff; border-color: var(--accent); }
        .purchaser-section { display: none; }
        .purchaser-section.active { display: block; }
        #saveBtn:disabled { background-color: transparent; border-color: #6c757d; color: #6c757d; opacity: 0.65; }
        .ts-wrapper .ts-control .item[data-value=""] { font-size: 0.875rem; color: #9ba5ae; }
    </style>

    <div class="card" style="max-width: 640px;">
        <div class="card-body">

            <form th:action="@{/clientcare/gift-certificates/new}" method="post"
                  th:object="${form}">
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" th:if="${_csrf != null}"/>
                <input type="hidden" th:if="${returnTo != null}" name="returnTo" th:value="${returnTo}"/>

                <!-- Purchaser -->
                <div class="mb-3">
                    <label class="form-label fw-semibold" th:text="#{gift.form.purchaser}">Покупець (хто оплачує)</label>
                    <input type="hidden" th:field="*{fromSalon}"/>
                    <div class="btn-group w-100 mode-toggle mb-2" role="group">
                        <input type="radio" class="btn-check" name="purchaserMode" id="modePurchaserExisting"
                               value="existing" autocomplete="off"
                               th:checked="${!form.fromSalon and (form.purchaserClientId != null or form.purchaserName == null)}"/>
                        <label class="btn btn-outline-secondary" for="modePurchaserExisting"
                               th:text="#{gift.form.purchaser.mode.existing}">Існуючий клієнт</label>

                        <input type="radio" class="btn-check" name="purchaserMode" id="modePurchaserNew"
                               value="new" autocomplete="off"
                               th:checked="${!form.fromSalon and form.purchaserClientId == null and form.purchaserName != null}"/>
                        <label class="btn btn-outline-secondary" for="modePurchaserNew"
                               th:text="#{gift.form.purchaser.mode.new}">Новий</label>

                        <input type="radio" class="btn-check" name="purchaserMode" id="modePurchaserSalon"
                               value="salon" autocomplete="off"
                               th:checked="${form.fromSalon}"/>
                        <label class="btn btn-outline-secondary" for="modePurchaserSalon"
                               th:text="#{gift.form.purchaser.mode.salon}">Від салону</label>
                    </div>

                    <!-- Existing client dropdown -->
                    <div id="sectionPurchaserExisting" class="purchaser-section">
                        <select class="form-select ts-client" th:field="*{purchaserClientId}">
                            <option value="" th:text="#{gift.form.select.purchaser}">— Оберіть покупця із переліку клієнтів —</option>
                            <option th:each="c : ${clients}"
                                    th:value="${c.id}"
                                    th:text="${c.name}"></option>
                        </select>
                    </div>

                    <!-- New purchaser free-text -->
                    <div id="sectionPurchaserNew" class="purchaser-section">
                        <div class="row g-2">
                            <div class="col-md-7">
                                <input type="text" class="form-control" th:field="*{purchaserName}"
                                       th:classappend="${#fields.hasErrors('purchaserName')} ? 'is-invalid'"
                                       th:placeholder="#{gift.form.purchaser.name}"/>
                                <div class="invalid-feedback" th:errors="*{purchaserName}"></div>
                            </div>
                            <div class="col-md-5">
                                <input type="tel" class="form-control" th:field="*{purchaserPhone}"
                                       th:classappend="${#fields.hasErrors('purchaserPhone')} ? 'is-invalid'"
                                       th:placeholder="#{gift.form.purchaser.phone}"
                                       maxlength="20"
                                       oninput="this.value=this.value.replace(/[^+0-9 ()\-]/g,'')"/>
                                <div class="invalid-feedback" th:errors="*{purchaserPhone}"></div>
                            </div>
                        </div>
                    </div>

                    <div th:if="${#fields.hasErrors('purchaserPresent')}"
                         class="text-danger small mt-1" th:errors="*{purchaserPresent}"></div>
                </div>

                <!-- Recipient toggle -->
                <div class="mb-3">
                    <label class="form-label fw-semibold d-block" th:text="#{gift.form.recipient}">Отримувач</label>
                    <div class="btn-group mode-toggle mb-2" style="width:66.67%" role="group">
                        <input type="radio" class="btn-check" name="recipientMode" id="modeRecipientClient"
                               value="client" autocomplete="off"
                               th:checked="${form.recipientName == null or form.recipientName.isEmpty()}"/>
                        <label class="btn btn-outline-secondary" for="modeRecipientClient"
                               th:text="#{gift.form.purchaser.mode.existing}">Існуючий клієнт</label>

                        <input type="radio" class="btn-check" name="recipientMode" id="modeRecipientFree"
                               value="free" autocomplete="off"
                               th:checked="${form.recipientName != null and !form.recipientName.isEmpty()}"/>
                        <label class="btn btn-outline-secondary" for="modeRecipientFree"
                               th:text="#{gift.form.purchaser.mode.new}">Новий</label>
                    </div>

                    <!-- Existing client dropdown -->
                    <div id="recipientClientBlock">
                        <select class="form-select ts-client" th:field="*{recipientClientId}"
                                th:classappend="${#fields.hasErrors('recipientClientId')} ? 'is-invalid'">
                            <option value="" th:text="#{gift.form.select.recipient}">— Оберіть отримувача із переліку клієнтів —</option>
                            <option th:each="c : ${clients}"
                                    th:value="${c.id}"
                                    th:text="${c.name}"></option>
                        </select>
                        <div class="invalid-feedback" th:errors="*{recipientClientId}"></div>
                    </div>

                    <!-- Free-text recipient -->
                    <div id="recipientFreeBlock" style="display:none;">
                        <div class="row g-2">
                            <div class="col-md-7">
                                <input type="text" class="form-control" th:field="*{recipientName}"
                                       th:classappend="${#fields.hasErrors('recipientName')} ? 'is-invalid'"
                                       th:placeholder="#{gift.form.recipient.name}"/>
                                <div class="invalid-feedback" th:errors="*{recipientName}"></div>
                            </div>
                            <div class="col-md-5">
                                <input type="tel" class="form-control" th:field="*{recipientPhone}"
                                       th:classappend="${#fields.hasErrors('recipientPhone')} ? 'is-invalid'"
                                       th:placeholder="#{gift.form.recipient.phone}"
                                       maxlength="20"
                                       oninput="this.value=this.value.replace(/[^+0-9 ()\-]/g,'')"/>
                                <div class="invalid-feedback" th:errors="*{recipientPhone}"></div>
                            </div>
                        </div>
                    </div>

                    <div th:if="${#fields.hasErrors('recipientPresent')}"
                         class="text-danger small mt-1" th:errors="*{recipientPresent}"></div>
                </div>

                <!-- Service / Price / Expiry — compact row layout -->
                <div class="row gy-2 gx-0 align-items-center mb-3">

                    <!-- Service -->
                    <label class="col-4 col-form-label fw-semibold" th:text="#{gift.form.service}">Послуга</label>
                    <div class="col-8">
                        <select class="form-select form-select-sm" id="serviceId" th:field="*{serviceId}"
                                th:classappend="${#fields.hasErrors('serviceId')} ? 'is-invalid'">
                            <option value="" th:text="#{gift.form.select.service}">— оберіть послугу —</option>
                            <option th:each="s : ${services}" th:value="${s.id}" th:text="${s.name}"></option>
                        </select>
                        <div class="invalid-feedback" th:errors="*{serviceId}"></div>
                        <div th:if="${services.empty}" class="form-text text-warning">
                            <i class="bi bi-exclamation-triangle me-1"></i>
                            <a th:href="@{/clientcare/services}" th:text="#{gift.form.service.empty}">Додайте послуги спочатку →</a>
                        </div>
                    </div>

                    <!-- Price — hidden for salon gifts -->
                    <div id="priceSection" class="col-12">
                        <div class="row gx-0 align-items-center">
                            <label class="col-4 col-form-label fw-semibold" th:text="#{gift.form.price}">Вартість сертифіката, zł</label>
                            <div class="col-8">
                                <input type="number" id="price" class="form-control form-control-sm text-end"
                                       th:field="*{price}"
                                       th:classappend="${#fields.hasErrors('price')} ? 'is-invalid'"
                                       step="0.01" min="0"
                                       th:placeholder="#{gift.form.price.hint}"/>
                                <div class="invalid-feedback" th:errors="*{price}"></div>
                            </div>
                        </div>
                    </div>

                    <!-- Expiry date -->
                    <label class="col-4 col-form-label fw-semibold" th:text="#{gift.form.expiresAt}">Дійсний до</label>
                    <div class="col-8">
                        <input type="date" class="form-control form-control-sm text-end" th:field="*{expiresAt}"
                               th:classappend="${#fields.hasErrors('expiresAt')} ? 'is-invalid'"
                               onclick="this.showPicker && this.showPicker()"/>
                        <div class="invalid-feedback" th:errors="*{expiresAt}"></div>
                    </div>

                </div>

                <!-- Notes -->
                <div class="mb-4">
                    <label class="form-label" th:text="#{gift.form.notes}">Примітки</label>
                    <textarea class="form-control" th:field="*{notes}" rows="2"
                              th:classappend="${#fields.hasErrors('notes')} ? 'is-invalid'"
                              th:placeholder="#{gift.form.notes.hint}"></textarea>
                    <div class="invalid-feedback" th:errors="*{notes}"></div>
                </div>

                <div class="d-flex gap-2 justify-content-end">
                    <a th:href="${returnTo != null ? returnTo : '/clientcare/gift-certificates'}"
                       class="btn btn-outline-secondary" th:text="#{btn.cancel}">Скасувати</a>
                    <button type="submit" id="saveBtn" class="btn btn-success" disabled>
                        <i class="bi bi-gift me-1"></i>
                        <span th:text="#{gift.btn.issue}">Видати сертифікат</span>
                    </button>
                </div>
            </form>
        </div>
    </div>

    <script th:inline="javascript">
        const HAS_PURCHASER_CLIENT = /*[[${form.purchaserClientId != null}]]*/ true;
        const HAS_PURCHASER_FREE   = /*[[${not #strings.isEmpty(form.purchaserName)}]]*/ false;
        const HAS_FROM_SALON       = /*[[${form.fromSalon}]]*/ false;
        const HAS_RECIPIENT_CLIENT = /*[[${form.recipientClientId != null}]]*/ false;
        const HAS_RECIPIENT_FREE   = /*[[${not #strings.isEmpty(form.recipientName)}]]*/ false;
        const HAS_SERVICE          = /*[[${form.serviceId != null}]]*/ false;

        function tsClear(id) {
            const el = document.getElementById(id);
            if (el && el.tomselect) el.tomselect.clear();
            else if (el) el.value = '';
        }

        function setDisabled(id, disabled) {
            var el = document.getElementById(id);
            if (!el) return;
            if (el.tomselect) {
                if (disabled) el.tomselect.disable(); else el.tomselect.enable();
            } else {
                el.disabled = disabled;
            }
        }

        function isPurchaserFilled() {
            var mode = document.querySelector('input[name="purchaserMode"]:checked');
            if (!mode) return false;
            if (mode.value === 'salon') return true;
            if (mode.value === 'existing') {
                var sel = document.getElementById('purchaserClientId');
                return sel && sel.value !== '';
            }
            if (mode.value === 'new') {
                var name = document.getElementById('purchaserName');
                return name && name.value.trim() !== '';
            }
            return false;
        }

        function isRecipientFilled() {
            var clientVisible = document.getElementById('recipientClientBlock').style.display !== 'none';
            if (clientVisible) {
                var sel = document.getElementById('recipientClientId');
                return sel && sel.value !== '';
            } else {
                var name = document.getElementById('recipientName');
                return name && name.value.trim() !== '';
            }
        }

        function isServiceFilled() {
            var sel = document.getElementById('serviceId');
            return sel && sel.value !== '';
        }

        function syncFormLock() {
            var purchaserOk = isPurchaserFilled();
            var recipientOk = purchaserOk && isRecipientFilled();
            var serviceOk   = recipientOk && isServiceFilled();

            // Recipient section — lock/unlock all interactive elements
            setDisabled('recipientClientId', !purchaserOk);
            ['recipientName', 'recipientPhone', 'modeRecipientClient', 'modeRecipientFree'].forEach(function(id) {
                setDisabled(id, !purchaserOk);
            });

            // Service
            setDisabled('serviceId', !recipientOk);

            // Price, expiry, notes, submit
            ['price', 'expiresAt', 'notes', 'saveBtn'].forEach(function(id) {
                setDisabled(id, !serviceOk);
            });
        }

        function syncPurchaserMode(mode) {
            const isExisting = mode === 'existing';
            const isNew      = mode === 'new';
            const isSalon    = mode === 'salon';
            document.getElementById('sectionPurchaserExisting').classList.toggle('active', isExisting);
            document.getElementById('sectionPurchaserNew').classList.toggle('active', isNew);
            document.getElementById('fromSalon').value = isSalon ? 'true' : 'false';
            document.getElementById('priceSection').style.display = isSalon ? 'none' : '';
            if (isSalon) {
                document.getElementById('price').value = '0';
                tsClear('purchaserClientId');
                document.getElementById('purchaserName').value  = '';
                document.getElementById('purchaserPhone').value = '';
            } else if (isExisting) {
                document.getElementById('purchaserName').value  = '';
                document.getElementById('purchaserPhone').value = '';
            } else {
                tsClear('purchaserClientId');
            }
            syncFormLock();
        }

        function showRecipientMode(mode) {
            const isClient = mode === 'client';
            document.getElementById('recipientClientBlock').style.display = isClient ? '' : 'none';
            document.getElementById('recipientFreeBlock').style.display   = isClient ? 'none' : '';
            document.getElementById('modeRecipientClient').checked = isClient;
            document.getElementById('modeRecipientFree').checked   = !isClient;
            if (isClient) {
                document.getElementById('recipientName').value  = '';
                document.getElementById('recipientPhone').value = '';
            } else {
                tsClear('recipientClientId');
            }
            syncFormLock();
        }

        document.addEventListener('DOMContentLoaded', function () {
            // Wire purchaser radio buttons
            document.getElementById('modePurchaserExisting').addEventListener('change', function () {
                if (this.checked) syncPurchaserMode('existing');
            });
            document.getElementById('modePurchaserNew').addEventListener('change', function () {
                if (this.checked) syncPurchaserMode('new');
            });
            document.getElementById('modePurchaserSalon').addEventListener('change', function () {
                if (this.checked) syncPurchaserMode('salon');
            });

            // Purchaser free-text input
            document.getElementById('purchaserName').addEventListener('input', syncFormLock);

            // Wire recipient radio buttons
            document.getElementById('modeRecipientClient').addEventListener('change', function () {
                if (this.checked) showRecipientMode('client');
            });
            document.getElementById('modeRecipientFree').addEventListener('change', function () {
                if (this.checked) showRecipientMode('free');
            });

            // Native change events on selects — TomSelect fires these on the underlying <select>;
            // cannot use tomselect.on() here because TomSelect initializes in the layout's
            // DOMContentLoaded which runs AFTER this handler.
            document.getElementById('purchaserClientId').addEventListener('change', syncFormLock);
            document.getElementById('recipientClientId').addEventListener('change', syncFormLock);

            // Recipient free-text input
            document.getElementById('recipientName').addEventListener('input', syncFormLock);

            // Service select
            document.getElementById('serviceId').addEventListener('change', syncFormLock);

            // Restore purchaser / recipient mode (UI only, no syncFormLock yet)
            if (HAS_FROM_SALON) {
                syncPurchaserMode('salon');
            } else if (HAS_PURCHASER_FREE && !HAS_PURCHASER_CLIENT) {
                document.getElementById('modePurchaserNew').checked = true;
                syncPurchaserMode('new');
            } else {
                syncPurchaserMode('existing');
            }
            // Restore recipient block visibility on validation error re-render
            // (th:checked already sets the correct radio; just sync the visible blocks)
            if (HAS_RECIPIENT_FREE) {
                document.getElementById('recipientClientBlock').style.display = 'none';
                document.getElementById('recipientFreeBlock').style.display   = '';
            }

            // Defer lock apply so it runs after the layout's DOMContentLoaded
            // finishes initializing TomSelect — only then can tomselect.disable() be called.
            setTimeout(syncFormLock, 0);
        });
    </script>
</div>
</body>
</html>
