<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout/clientcare :: layout(#{service.form.title.edit}, ~{::content})}">
<body>
<div th:fragment="content">

    <div class="page-header mb-3">
        <h1 class="page-title">
            <i class="bi bi-stars me-2" style="color:var(--accent)"></i>
            <span th:text="#{service.form.title.edit}">Редагувати послугу</span>
        </h1>
    </div>

    <div class="card" style="max-width: 540px;">
        <div class="card-body">
            <style>
                #saveBtn:disabled { background-color: transparent; border-color: #6c757d; color: #6c757d; opacity: 0.65; }
            </style>
            <form id="serviceForm" th:action="@{/clientcare/services/{id}/edit(id=${service.id})}"
                  th:object="${service}" method="post">
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" th:if="${_csrf != null}"/>

                <div class="mb-3">
                    <label class="form-label fw-semibold" th:text="#{service.form.name}">Назва</label>
                    <input type="text" class="form-control"
                           th:field="*{name}"
                           th:classappend="${#fields.hasErrors('name')} ? 'is-invalid'"/>
                    <div class="invalid-feedback" th:errors="*{name}"></div>
                </div>

                <div class="mb-4">
                    <label class="form-label" th:text="#{service.form.description}">Опис</label>
                    <textarea class="form-control" th:field="*{description}" rows="3"
                              th:placeholder="#{service.form.description.hint}"></textarea>
                </div>

                <div class="d-flex gap-2 justify-content-end">
                    <a href="/clientcare/services" class="btn btn-outline-secondary btn-sm"
                       th:text="#{btn.cancel}">Скасувати</a>
                    <button type="submit" id="saveBtn" class="btn btn-primary btn-sm" disabled>
                        <i class="bi bi-check-lg me-1"></i>
                        <span th:text="#{btn.save}">Зберегти</span>
                    </button>
                </div>
            </form>
        </div>
    </div>

    <script>
        var initialSnapshot = null;

        function getFormSnapshot() {
            var data = {};
            document.querySelectorAll('#serviceForm input:not([type=hidden]), #serviceForm select, #serviceForm textarea')
                .forEach(function(el) { data[el.name || el.id] = el.type === 'checkbox' ? el.checked : el.value; });
            return JSON.stringify(data);
        }

        function syncSaveBtn() {
            var btn = document.getElementById('saveBtn');
            if (!btn || initialSnapshot === null) return;
            btn.disabled = (getFormSnapshot() === initialSnapshot);
        }

        document.addEventListener('DOMContentLoaded', function() {
            initialSnapshot = getFormSnapshot();
            document.getElementById('serviceForm').addEventListener('input',  syncSaveBtn);
            document.getElementById('serviceForm').addEventListener('change', syncSaveBtn);
        });
    </script>
</div>
</body>
</html>
