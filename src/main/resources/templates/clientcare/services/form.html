<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout/clientcare :: layout(#{service.form.title.edit}, ~{::content})}">
<body>
<div th:fragment="content">

    <div class="page-header mb-3">
        <h1 class="page-title">
            <i class="bi bi-stars me-2" style="color:var(--accent)"></i>
            <span th:text="#{service.form.title.edit}">Редагувати послугу</span>
        </h1>
    </div>

    <div class="card" style="max-width: 540px;">
        <div class="card-body">
            <form th:action="@{/clientcare/services/{id}/edit(id=${service.id})}"
                  th:object="${service}" method="post">
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" th:if="${_csrf != null}"/>

                <div class="mb-3">
                    <label class="form-label fw-semibold" th:text="#{service.form.name}">Назва</label>
                    <input type="text" class="form-control"
                           th:field="*{name}"
                           th:classappend="${#fields.hasErrors('name')} ? 'is-invalid'"/>
                    <div class="invalid-feedback" th:errors="*{name}"></div>
                </div>

                <div class="mb-4">
                    <label class="form-label" th:text="#{service.form.description}">Опис</label>
                    <textarea class="form-control" th:field="*{description}" rows="3"></textarea>
                </div>

                <div class="d-flex gap-2">
                    <button type="submit" class="btn btn-primary">
                        <i class="bi bi-check-lg me-1"></i>
                        <span th:text="#{btn.save}">Зберегти</span>
                    </button>
                    <a href="/clientcare/services" class="btn btn-outline-secondary"
                       th:text="#{btn.cancel}">Скасувати</a>
                </div>
            </form>
        </div>
    </div>
</div>
</body>
</html>
