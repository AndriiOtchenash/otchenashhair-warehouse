<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout/clientcare :: layout(#{service.list.title}, ~{::content})}">
<body>
<div th:fragment="content">
    <style>
        .table { min-width: 0 !important; }
        #saveNewServiceBtn:disabled { background-color: transparent; border-color: #6c757d; color: #6c757d; opacity: 0.65; }
        .desc-cell { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 1px; }
        @media (max-width: 767.98px) {
            .table th { font-size: 0.75rem; padding: 0.35rem 0.4rem; }
            .table td { font-size: 0.9rem; padding: 0.35rem 0.4rem; }
        }
    </style>

    <div class="page-header">
        <h1 class="page-title" th:text="#{service.list.title}">Послуги</h1>
        <button class="btn btn-primary btn-sm" type="button"
                data-bs-toggle="collapse" data-bs-target="#newServiceForm"
                th:attr="aria-expanded=${showForm != null and showForm}">
            <i class="bi bi-plus-lg"></i>
            <span class="d-none d-md-inline ms-1" th:text="#{service.btn.new}">Нова послуга</span>
        </button>
    </div>

    <div th:if="${successMessage}" class="alert alert-success alert-dismissible fade show mb-3">
        <span th:text="${successMessage}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
    </div>
    <div th:if="${errorMessage}" class="alert alert-danger alert-dismissible fade show mb-3">
        <span th:text="${errorMessage}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
    </div>

    <!-- Collapsible create form -->
    <div class="collapse mb-3" id="newServiceForm"
         th:classappend="${showForm != null and showForm} ? 'show'">
        <div class="card">
            <div class="card-header" th:text="#{service.btn.new}">Нова послуга</div>
            <div class="card-body">
                <form th:action="@{/clientcare/services}" th:object="${newService}" method="post">
                    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" th:if="${_csrf != null}"/>
                    <div class="mb-3">
                        <label class="form-label fw-semibold" th:text="#{service.form.name}">Назва</label>
                        <input type="text" class="form-control"
                               th:field="*{name}"
                               th:classappend="${#fields.hasErrors('name')} ? 'is-invalid'"
                               th:placeholder="#{service.form.name.hint}"
                               oninput="document.getElementById('saveNewServiceBtn').disabled = !this.value.trim()"/>
                        <div class="invalid-feedback" th:errors="*{name}"></div>
                    </div>
                    <div class="mb-3">
                        <label class="form-label" th:text="#{service.form.description}">Опис</label>
                        <textarea class="form-control" th:field="*{description}" rows="2"
                                  th:placeholder="#{service.form.description.hint}"></textarea>
                    </div>
                    <div class="d-flex gap-2 justify-content-end">
                        <button type="button" class="btn btn-outline-secondary"
                                data-bs-toggle="collapse" data-bs-target="#newServiceForm"
                                th:text="#{btn.cancel}">Скасувати</button>
                        <button type="submit" id="saveNewServiceBtn" class="btn btn-primary"
                                th:disabled="${newService.name == null or newService.name.isEmpty()}">
                            <i class="bi bi-check-lg me-1"></i>
                            <span th:text="#{btn.save}">Зберегти</span>
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <!-- Services table -->
    <div class="card">
        <div class="card-body p-0">
            <div th:if="${services.empty}" class="text-muted text-center py-4">
                <i class="bi bi-stars fs-1 d-block mb-2 opacity-25"></i>
                <span th:text="#{service.list.empty}">Послуг ще немає</span>
            </div>
            <table th:unless="${services.empty}" class="table table-hover mb-0">
                <thead style="--bs-table-bg: var(--accent-light)">
                <tr>
                    <th th:text="#{service.form.name}">Назва</th>
                    <th class="d-none d-md-table-cell" style="width:35%" th:text="#{service.form.description}">Опис</th>
                    <th class="d-none d-md-table-cell" style="width:7rem" th:text="#{table.status}">Статус</th>
                    <th style="width:6.5rem" th:text="#{table.actions}">Дії</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="s : ${services}"
                    th:classappend="${!s.active} ? 'table-secondary'">
                    <td>
                        <span th:class="${!s.active} ? 'fw-semibold text-muted text-decoration-line-through' : 'fw-semibold'"
                              th:text="${s.name}"></span>
                    </td>
                    <td class="d-none d-md-table-cell text-muted small desc-cell"
                        th:text="${s.description}" th:title="${s.description}"></td>
                    <td class="d-none d-md-table-cell">
                        <span th:if="${s.active}" class="badge bg-success" th:text="#{status.active}">Активна</span>
                        <span th:unless="${s.active}" class="badge bg-secondary" th:text="#{status.inactive}">Неактивна</span>
                    </td>
                    <td>
                        <div class="d-flex gap-1">
                            <a th:href="@{/clientcare/services/{id}/edit(id=${s.id})}"
                               class="btn btn-sm btn-outline-primary">
                                <i class="bi bi-pencil"></i>
                            </a>
                            <form th:if="${s.active}"
                                  th:action="@{/clientcare/services/{id}/deactivate(id=${s.id})}"
                                  method="post" class="d-inline">
                                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" th:if="${_csrf != null}"/>
                                <button type="submit" class="btn btn-sm btn-outline-danger"
                                        th:data-confirm="#{service.deactivate.confirm}"
                                        onclick="return confirm(this.dataset.confirm)">
                                    <i class="bi bi-x-lg"></i>
                                </button>
                            </form>
                            <form th:unless="${s.active}"
                                  th:action="@{/clientcare/services/{id}/activate(id=${s.id})}"
                                  method="post" class="d-inline">
                                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" th:if="${_csrf != null}"/>
                                <button type="submit" class="btn btn-sm btn-outline-success">
                                    <i class="bi bi-arrow-counterclockwise"></i>
                                </button>
                            </form>
                        </div>
                    </td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>
</body>
</html>
