<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout/clientcare :: layout(${visit.id != null} ? #{visit.form.title.edit} : #{visit.form.title.new}, ~{::content})}">
<body>
<div th:fragment="content">

    <style>
        .auto-resize {
            resize: none;
            overflow: hidden;
            min-height: 2.6rem;
        }
        .time-block {
            background: var(--accent-light);
            border: 1px solid rgba(74,124,89,0.15);
            border-radius: 0.5rem;
        }
        .form-section-label {
            font-size: 0.68rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.09em;
            color: var(--accent);
        }
        .form-divider {
            border: none;
            border-top: 1px solid #e9ecef;
            margin: 1rem 0;
        }
        .form-actions {
            background: #f8fdf9;
            border-top: 1px solid rgba(74,124,89,0.12);
            border-radius: 0 0 0.375rem 0.375rem;
            margin: 1rem -1rem -1rem;
            padding: 0.75rem 1rem;
        }
        #paid:checked { background-color: var(--accent); border-color: var(--accent); }
        #paid:focus   { box-shadow: 0 0 0 0.2rem rgba(74,124,89,.25); }
        #saveBtn:disabled {
            background-color: transparent;
            border-color: #6c757d;
            color: #6c757d;
            opacity: 0.65;
        }
    </style>

    <div class="page-header">
        <div>
            <h1 class="page-title"
                th:text="${visit.id != null} ? #{visit.form.title.edit} : #{visit.form.title.new}">
                Новий візит
            </h1>
            <div class="text-muted" style="font-size:0.85rem;" th:text="${client.name}"></div>
        </div>
        <a th:href="${returnTo != null ? returnTo : '/clientcare/clients/' + visit.clientId}"
           class="btn btn-outline-secondary btn-sm">
            <i class="bi bi-arrow-left me-1"></i>
            <span class="d-none d-sm-inline" th:text="#{btn.back}">Назад</span>
        </a>
    </div>

    <!-- Unresolved appointment warning (shown only on new visit form when completeAppointmentId not set) -->
    <div th:if="${overdueAppointment != null}" id="overdueWarningServer"
         class="alert mb-3" style="max-width:640px;background:#f8d7da;border-color:#f1aeb5;color:#842029">
        <div class="d-flex align-items-start gap-2 mb-2">
            <i class="bi bi-calendar-x mt-1 flex-shrink-0"></i>
            <div>
                <div class="fw-bold" th:text="#{appointment.overdue.unresolved.title}">Попередній запис не опрацьовано</div>
                <div class="small mt-1">
                    <span th:text="${#temporals.format(overdueAppointment.startAt, 'dd.MM.yyyy, HH:mm')}"></span>
                    <th:block th:if="${overdueAppointment.serviceName != null and !#strings.isEmpty(overdueAppointment.serviceName)}">
                        <span> &mdash; </span><span th:text="${overdueAppointment.serviceName}"></span>
                    </th:block>
                </div>
            </div>
        </div>
        <div class="d-flex flex-wrap gap-2">
            <button type="button" class="btn btn-sm btn-success"
                    th:data-id="${overdueAppointment.id}"
                    onclick="showVisitCompleteModal(this.dataset.id)">
                <i class="bi bi-check-circle me-1"></i>
                <span th:text="#{appointment.overdue.unresolved.came}">Прийшов</span>
            </button>
            <button type="button" class="btn btn-sm btn-warning"
                    th:data-id="${overdueAppointment.id}"
                    onclick="resolveOverdue(this.dataset.id,'NO_SHOW','overdueWarningServer')">
                <i class="bi bi-person-x me-1"></i>
                <span th:text="#{appointment.overdue.unresolved.noshow}">Не прийшов</span>
            </button>
            <button type="button" class="btn btn-sm btn-outline-danger"
                    th:data-id="${overdueAppointment.id}"
                    onclick="resolveOverdue(this.dataset.id,'CANCELLED','overdueWarningServer')">
                <i class="bi bi-x-circle me-1"></i>
                <span th:text="#{appointment.overdue.unresolved.cancel}">Скасувати</span>
            </button>
        </div>
    </div>

    <div class="card" style="max-width: 640px;">
        <div class="card-body">
            <form id="visitForm"
                  th:action="${visit.id != null}
                              ? @{/clientcare/visits/{id}/edit(id=${visit.id})}
                              : @{/clientcare/visits/new}"
                  th:object="${visit}" method="post">
                <input type="hidden" th:field="*{clientId}"/>
                <input type="hidden" th:field="*{id}"/>
                <input th:if="${returnTo != null}" type="hidden" name="returnTo" th:value="${returnTo}"/>
                <input th:if="${completeAppointmentId != null}" type="hidden"
                       name="completeAppointmentId" th:value="${completeAppointmentId}"/>

                <!-- ── Date + Protocol header ── -->
                <div class="d-flex align-items-center gap-2 mb-3">
                    <div class="form-section-label d-flex align-items-center gap-1 flex-grow-1">
                        <i class="bi bi-calendar-date"></i>
                        <span th:text="#{visit.form.visitDate}">Дата</span>
                    </div>
                    <input type="date" class="form-control form-control-sm"
                           style="width:9rem"
                           th:field="*{visitDate}"
                           th:classappend="${#fields.hasErrors('visitDate')} ? 'is-invalid'"
                           th:max="${#temporals.format(#temporals.createToday(), 'yyyy-MM-dd')}"
                           onclick="this.showPicker&&this.showPicker()"
                           oninput="syncVisitSaveBtn()"/>
                    <div class="invalid-feedback" th:if="${#fields.hasErrors('visitDate')}"
                         th:errors="*{visitDate}"></div>
                </div>

                <div class="mb-3">
                    <label class="form-label fw-semibold" th:text="#{visit.form.complaint}">Скарга</label>
                    <textarea class="form-control auto-resize" th:field="*{complaint}"
                              th:placeholder="#{visit.form.complaint.hint}"></textarea>
                </div>

                <div class="mb-3">
                    <label class="form-label fw-semibold" th:text="#{visit.form.scalpCondition}">Стан шкіри голови</label>
                    <textarea class="form-control auto-resize" th:field="*{scalpCondition}"
                              th:placeholder="#{visit.form.scalpCondition.hint}"></textarea>
                </div>

                <div class="mb-3">
                    <label class="form-label fw-semibold" th:text="#{visit.form.recommendations}">Рекомендації</label>
                    <textarea class="form-control auto-resize" th:field="*{recommendations}"
                              th:placeholder="#{visit.form.recommendations.hint}"></textarea>
                </div>

                <div class="mb-3">
                    <label class="form-label fw-semibold" th:text="#{visit.form.notes}">Нотатки</label>
                    <textarea class="form-control auto-resize" th:field="*{notes}"></textarea>
                </div>

                <hr class="form-divider"/>

                <!-- ── Billing ── -->
                <div class="time-block p-3 mb-3">
                    <div class="form-section-label d-flex align-items-center gap-1 mb-3">
                        <i class="bi bi-credit-card"></i>
                        <span th:text="#{visit.form.billing.section}">Послуга та оплата</span>
                    </div>

                    <div class="row gy-2 gx-0 align-items-center">

                        <!-- Послуга -->
                        <label for="serviceId" class="col-4 col-form-label fw-semibold"
                               th:text="#{visit.form.service}">Послуга</label>
                        <div class="col-8">
                            <select id="serviceId" class="form-select" th:field="*{serviceId}">
                                <option value="" th:text="#{visit.form.service.placeholder}">— без послуги —</option>
                                <option th:each="svc : ${activeServices}"
                                        th:value="${svc.id}"
                                        th:text="${svc.name}">
                                </option>
                            </select>
                        </div>

                        <!-- Ціна (умовно прихована) -->
                        <div id="priceSection" class="col-12">
                            <div class="row gx-0 align-items-center">
                                <label for="priceAtTime" class="col-4 col-form-label fw-semibold"
                                       th:text="#{visit.form.price}">Ціна</label>
                                <div class="col-8">
                                    <div class="input-group">
                                        <input type="number" id="priceAtTime" class="form-control text-end"
                                               step="0.01" min="0"
                                               th:field="*{priceAtTime}"
                                               th:classappend="${#fields.hasErrors('priceAtTime')} ? 'is-invalid'"
                                               th:placeholder="#{visit.form.price.hint}"/>
                                        <span class="input-group-text">zł</span>
                                        <div class="invalid-feedback" th:errors="*{priceAtTime}"></div>
                                    </div>
                                </div>
                            </div>
                        </div>

                        <!-- Оплата -->
                        <label for="paymentMethod" class="col-4 col-form-label fw-semibold"
                               th:text="#{visit.form.paymentMethod}">Оплата</label>
                        <div class="col-8">
                            <select id="paymentMethod" class="form-select" th:field="*{paymentMethod}"
                                    th:classappend="${#fields.hasErrors('paymentMethodRequiredWhenPaid')} ? 'is-invalid'"
                                    onchange="onPaymentMethodChange()">
                                <option value="" th:text="#{visit.form.paymentMethod.placeholder}">— не вказано —</option>
                                <option th:each="pm : ${paymentMethods}"
                                        th:value="${pm.name()}"
                                        th:text="#{payment.method.__${pm}__}">
                                </option>
                            </select>
                            <div class="invalid-feedback" th:errors="*{paymentMethodRequiredWhenPaid}"></div>
                        </div>

                        <!-- Код сертифіката (умовно прихована) -->
                        <div id="certificateSection" class="col-12" style="display:none">
                            <div class="row gx-0 align-items-start">
                                <label for="certificateCode" class="col-4 col-form-label fw-semibold"
                                       th:text="#{visit.form.certificateCode}">Код сертифіката</label>
                                <div class="col-8">
                                    <input type="text" id="certificateCode" class="form-control text-uppercase"
                                           th:field="*{certificateCode}"
                                           th:classappend="${#fields.hasErrors('certificateCode')} ? 'is-invalid'"
                                           th:placeholder="#{visit.form.certificateCode.hint}"
                                           maxlength="20"
                                           oninput="this.value=this.value.toUpperCase(); clearCertStatus()"
                                           onblur="checkCertificate(this.value)"/>
                                    <div class="invalid-feedback" th:errors="*{certificateCode}"></div>
                                    <div id="certStatus" class="mt-2" style="display:none"></div>
                                </div>
                            </div>
                        </div>

                    </div>

                    <!-- Оплачено (умовно прихована) -->
                    <div id="paidSection" class="form-check mt-2 mb-1">
                        <input class="form-check-input" type="checkbox" id="paid" th:field="*{paid}"/>
                        <label class="form-check-label" for="paid"
                               th:text="#{visit.form.paid}">Оплачено</label>
                    </div>
                </div>

                <!-- ── Next appointment ── -->
                <div class="mb-3">
                    <!-- Not scheduled, no decision yet -->
                    <div th:if="${visit.nextAppointmentId == null and isLatestVisit and !hasUpcomingAppointment and !visit.nextVisitSkipped}"
                         class="alert alert-warning d-flex flex-column align-items-center gap-2 mb-0 py-2">
                        <span class="small text-center">
                            <i class="bi bi-calendar-x me-1"></i>
                            <span th:text="#{visit.nextAppointment.notScheduled}">Наступний візит не запланований</span>
                        </span>
                        <div class="d-flex gap-2 flex-wrap justify-content-center">
                            <button type="submit" name="action" value="schedule"
                                    class="btn btn-warning btn-sm py-0 px-2"
                                    style="white-space:nowrap">
                                <i class="bi bi-calendar-plus me-1"></i>
                                <span th:text="#{visit.nextAppointment.schedule}">Запланувати →</span>
                            </button>
                            <button th:if="${visit.id != null}"
                                    type="submit" form="skipNextForm"
                                    class="btn btn-outline-secondary btn-sm py-0 px-2"
                                    style="white-space:nowrap">
                                <span th:text="#{visit.nextAppointment.notRequired}">Не потрібно</span>
                            </button>
                        </div>
                    </div>
                    <!-- Explicitly marked as not required -->
                    <div th:if="${visit.nextAppointmentId == null and isLatestVisit and visit.nextVisitSkipped}"
                         class="alert alert-secondary d-flex align-items-center justify-content-between gap-2 mb-0 py-2">
                        <span class="small text-muted">
                            <i class="bi bi-slash-circle me-1"></i>
                            <span th:text="#{visit.nextAppointment.skipped}">Наступний прийом позначено як непотрібний</span>
                        </span>
                        <button type="submit" form="unskipNextForm"
                                class="btn btn-outline-secondary btn-sm flex-shrink-0"
                                th:title="#{visit.nextAppointment.unskip}"
                                data-bs-toggle="tooltip">
                            <i class="bi bi-arrow-counterclockwise"></i>
                        </button>
                    </div>
                    <!-- Scheduled -->
                    <div th:if="${visit.nextAppointmentId != null}"
                         class="alert alert-success d-flex align-items-center justify-content-between gap-2 flex-wrap mb-0 py-2">
                        <span class="small">
                            <i class="bi bi-calendar-check-fill me-1"></i>
                            <span th:text="#{visit.nextAppointment.label}">Наступний запис:</span>
                            <strong th:text="${#temporals.format(visit.nextAppointmentStartAt, 'dd.MM.yyyy')} + ' о ' + ${#temporals.format(visit.nextAppointmentStartAt, 'HH:mm')}"></strong>
                        </span>
                        <a th:href="@{/clientcare/appointments(date=${#temporals.format(visit.nextAppointmentStartAt, 'yyyy-MM-dd')})}"
                           class="btn btn-outline-success btn-sm py-0 px-2"
                           style="white-space:nowrap">
                            <i class="bi bi-calendar3 me-1"></i>
                            <span th:text="#{visit.nextAppointment.open}">Відкрити →</span>
                        </a>
                    </div>
                </div>

                <!-- ── Actions ── -->
                <div class="form-actions d-flex gap-2 justify-content-end">
                    <a th:href="${returnTo != null ? returnTo : '/clientcare/clients/' + visit.clientId}"
                       class="btn btn-outline-secondary btn-sm" th:text="#{btn.cancel}">Скасувати</a>
                    <button type="submit" name="action" value="save"
                            id="saveBtn"
                            class="btn btn-primary btn-sm"
                            th:disabled="${visit.id != null or visit.visitDate == null}">
                        <i class="bi bi-check2 me-1"></i>
                        <span th:text="#{btn.save}">Зберегти</span>
                    </button>
                </div>
            </form>

            <!-- Skip/unskip forms placed outside main form to avoid nesting (buttons reference via form= attribute) -->
            <th:block th:if="${visit.id != null}">
                <form id="skipNextForm"
                      th:action="@{/clientcare/visits/{id}/skip-next(id=${visit.id})}"
                      method="post">
                    <input type="hidden" name="_csrf" th:value="${_csrf.token}" th:if="${_csrf != null}"/>
                    <input th:if="${returnTo != null}" type="hidden" name="returnTo" th:value="${returnTo}"/>
                </form>
                <form id="unskipNextForm"
                      th:action="@{/clientcare/visits/{id}/unskip-next(id=${visit.id})}"
                      method="post">
                    <input type="hidden" name="_csrf" th:value="${_csrf.token}" th:if="${_csrf != null}"/>
                    <input th:if="${returnTo != null}" type="hidden" name="returnTo" th:value="${returnTo}"/>
                </form>
            </th:block>
        </div>
    </div>

    <!-- "Прийшов" → what to do with the previous appointment modal -->
    <div th:if="${overdueAppointment != null}" class="modal fade" id="visitCompleteModal" tabindex="-1">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content">
                <div class="modal-header border-0 pb-1">
                    <h6 class="modal-title fw-semibold" th:text="#{appointment.overdue.modal.title}">Що зробити з попереднім візитом?</h6>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body pt-1">
                    <p class="text-muted small mb-3" th:text="#{appointment.overdue.modal.hint}">Клієнт прийшов. Оберіть дію:</p>
                    <div class="d-grid gap-2">
                        <button type="button" class="btn btn-primary btn-sm" id="visitModalLinkBtn">
                            <i class="bi bi-link-45deg me-1"></i>
                            <span th:text="#{appointment.overdue.visit.modal.link}">Прив'язати цей протокол до пропущеного запису</span>
                        </button>
                        <button type="button" class="btn btn-outline-secondary btn-sm"
                                onclick="dismissVisitModal()">
                            <span th:text="#{appointment.overdue.visit.modal.later}">Обробити пропущений запис пізніше</span>
                        </button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script th:inline="javascript">
        // ── i18n messages ─────────────────────────────────────────────────────
        const MSG_CERT_VALID     = /*[[#{visit.cert.valid}]]*/ 'Сертифікат дійсний';
        const MSG_CERT_INVALID   = /*[[#{visit.cert.invalid}]]*/ 'Сертифікат недійсний або вже використано';
        const MSG_CERT_CHECK     = /*[[#{visit.cert.checking}]]*/ 'Перевіряємо...';
        const MSG_CERT_REQUIRED  = /*[[#{visit.cert.required}]]*/ 'Введіть код сертифіката';
        const MSG_CERT_RECIPIENT = /*[[#{visit.cert.recipient}]]*/ 'Отримувач:';

        // ── Auto-resize textareas ─────────────────────────────────────────────
        function autoResize(el) {
            el.style.height = 'auto';
            el.style.height = el.scrollHeight + 'px';
        }
        document.querySelectorAll('textarea.auto-resize').forEach(ta => {
            ta.addEventListener('input', () => autoResize(ta));
            autoResize(ta);
        });

        // ── Certificate AJAX validation ───────────────────────────────────────
        function checkCertificate(code) {
            code = (code || '').trim();
            if (!code) { clearCertStatus(); return; }
            showCertStatus('checking');
            fetch('/clientcare/visits/check-certificate?code=' + encodeURIComponent(code))
                .then(r => r.json())
                .then(data => showCertStatus(data.valid ? 'valid' : 'invalid', data.recipientName, data.serviceName))
                .catch(() => clearCertStatus());
        }

        function showCertStatus(state, recipientName, serviceName) {
            const el = document.getElementById('certStatus');
            el.style.display = '';
            if (state === 'checking') {
                el.innerHTML = '<span class="text-muted small">'
                    + '<span class="spinner-border spinner-border-sm me-1" role="status"></span>'
                    + MSG_CERT_CHECK + '</span>';
            } else if (state === 'valid') {
                let html = '<span class="badge px-2 py-1" '
                    + 'style="background:#d1e7dd;color:#0a3622;font-size:0.8rem">'
                    + '<i class="bi bi-check-circle-fill me-1"></i>'
                    + '<span class="d-none d-sm-inline">' + MSG_CERT_VALID + '</span>';
                if (recipientName) {
                    html += '<span class="d-none d-sm-inline"> &nbsp;·&nbsp; ' + MSG_CERT_RECIPIENT + ' </span>'
                        + '<strong>' + recipientName + '</strong>';
                }
                if (serviceName) {
                    html += '<span> &nbsp;·&nbsp; ' + serviceName + '</span>';
                }
                html += '</span>';
                el.innerHTML = html;
            } else {
                el.innerHTML = '<span class="badge px-2 py-1" '
                    + 'style="background:#f8d7da;color:#842029;font-size:0.8rem">'
                    + '<i class="bi bi-x-circle-fill me-1"></i>' + MSG_CERT_INVALID + '</span>';
            }
        }

        function clearCertStatus() {
            const el = document.getElementById('certStatus');
            if (el) { el.style.display = 'none'; el.innerHTML = ''; }
        }

        // ── Payment method toggle ─────────────────────────────────────────────
        // CASH/CARD  — show price + isPaid checkbox
        // CERTIFICATE — hide price + isPaid, show cert code field
        // BARTER      — show price (barter value), hide isPaid (auto true)
        // COMPLIMENTARY/PROMO — hide price + isPaid (auto true, price = null)
        function onPaymentMethodChange() {
            document.getElementById('paymentMethod').classList.remove('is-invalid');
            const method = document.getElementById('paymentMethod').value;
            const isCert  = method === 'CERTIFICATE';
            const isFree  = method === 'COMPLIMENTARY' || method === 'PROMO';
            const isBarter = method === 'BARTER';
            const hidePaid  = isCert || isFree || isBarter;
            const hidePrice = isCert || isFree;

            document.getElementById('certificateSection').style.display = isCert  ? '' : 'none';
            document.getElementById('paidSection').style.display        = hidePaid ? 'none' : '';
            document.getElementById('priceSection').style.display       = hidePrice ? 'none' : '';

            if (isCert || isFree) {
                document.getElementById('priceAtTime').value = '';
            }
            if (!isCert) {
                document.getElementById('certificateCode').value = '';
                clearCertStatus();
            }
        }
        onPaymentMethodChange();

        // ── Dirty-form detection (disable Save when no changes) ──────────────
        var initialSnapshot = null;

        function getFormSnapshot() {
            var data = {};
            document.querySelectorAll('#visitForm input:not([type=hidden]), #visitForm select, #visitForm textarea')
                .forEach(function(el) {
                    var key = el.name || el.id;
                    data[key] = el.type === 'checkbox' ? el.checked : el.value;
                });
            return JSON.stringify(data);
        }

        const IS_EDIT_VISIT = /*[[${visit.id != null}]]*/ false;

        function syncSaveBtn() {
            var saveBtn = document.getElementById('saveBtn');
            if (!saveBtn || initialSnapshot === null) return;
            saveBtn.disabled = (getFormSnapshot() === initialSnapshot);
        }

        function syncVisitSaveBtn() {
            if (IS_EDIT_VISIT) return;
            var saveBtn = document.getElementById('saveBtn');
            if (!saveBtn) return;
            var dateVal = document.getElementById('visitDate').value;
            saveBtn.disabled = !dateVal;
        }

        document.addEventListener('DOMContentLoaded', function() {
            var form = document.getElementById('visitForm');
            if (!form) return;
            if (IS_EDIT_VISIT) {
                initialSnapshot = getFormSnapshot();
                form.addEventListener('input',  syncSaveBtn);
                form.addEventListener('change', syncSaveBtn);
            }
        });

        // ── Submit validation ─────────────────────────────────────────────────
        document.getElementById('visitForm').addEventListener('submit', function(e) {
            const method  = document.getElementById('paymentMethod').value;
            const isCert  = method === 'CERTIFICATE';
            const isFree  = method === 'COMPLIMENTARY' || method === 'PROMO';
            const isBarter = method === 'BARTER';

            if (isCert) {
                const codeEl = document.getElementById('certificateCode');
                if (!codeEl.value.trim()) {
                    codeEl.classList.add('is-invalid');
                    document.getElementById('certStatus').style.display = 'none';
                    e.preventDefault();
                }
                return;
            }

            // Free/barter visits — no price or paid warnings needed
            if (isFree || isBarter) return;

            // Payment method required when paid checkbox is checked
            if (!method && document.getElementById('paid').checked) {
                document.getElementById('paymentMethod').classList.add('is-invalid');
                e.preventDefault();
                return;
            }

            const price = parseFloat(document.getElementById('priceAtTime').value) || 0;
            if (price <= 0) {
                if (!confirm(/*[[#{visit.noprice.confirm}]]*/ 'Ціну не вказано. Зберегти?')) {
                    e.preventDefault();
                    return;
                }
            }

            if (price > 0 && !document.getElementById('paid').checked) {
                if (!confirm(/*[[#{visit.unpaid.confirm}]]*/ 'Оплату не підтверджено. Зберегти?')) {
                    e.preventDefault();
                }
            }
        });

        // ── Overdue appointment banner ────────────────────────────────────────
        function resolveOverdue(id, status, bannerId) {
            var csrfInput = document.querySelector('input[name="_csrf"]');
            var params = new URLSearchParams({ status: status });
            if (csrfInput) params.append(csrfInput.name, csrfInput.value);
            fetch('/clientcare/appointments/' + id + '/resolve', {
                method:  'POST',
                headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
                body:    params.toString()
            }).then(function(r) {
                if (r.ok) {
                    var el = document.getElementById(bannerId);
                    if (el) el.style.display = 'none';
                }
            });
        }

        var _visitModalApptId = null;

        function showVisitCompleteModal(id) {
            _visitModalApptId = id;
            new bootstrap.Modal(document.getElementById('visitCompleteModal')).show();
        }

        function dismissVisitModal() {
            var modal = bootstrap.Modal.getInstance(document.getElementById('visitCompleteModal'));
            if (modal) modal.hide();
            var banner = document.getElementById('overdueWarningServer');
            if (banner) banner.style.display = 'none';
        }

        document.addEventListener('DOMContentLoaded', function() {
            var linkBtn = document.getElementById('visitModalLinkBtn');
            if (linkBtn) {
                linkBtn.addEventListener('click', function() {
                    var url = new URL(window.location.href);
                    url.searchParams.set('completeAppointmentId', _visitModalApptId);
                    window.location.href = url.toString();
                });
            }
        });
    </script>

</div>
</body>
</html>
