<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout/main :: layout(${client.name}, ~{::content})}">
<body>
<div th:fragment="content">
    <div class="page-header">
        <div>
            <h1 class="page-title" th:text="${client.name}"></h1>
            <span class="text-muted small" th:if="${client.phone != null and !client.phone.isEmpty()}">
                <span th:text="#{client.form.phone.short}">тел.</span>&nbsp;<span th:text="${client.phone}"></span>
            </span>
        </div>
        <div class="d-flex gap-2">
            <a th:href="@{/clients/{id}/edit(id=${client.id},returnTo='detail')}"
               class="btn btn-outline-secondary btn-sm">
                <i class="bi bi-pencil me-1"></i>
                <span th:text="#{btn.edit}">Редагувати</span>
            </a>
            <a th:href="@{/clients}" class="btn btn-outline-secondary btn-sm">
                <i class="bi bi-arrow-left me-1"></i>
                <span th:text="#{btn.back}">Назад</span>
            </a>
        </div>
    </div>

    <!-- Client info — compact full-width strip -->
    <div th:if="${(client.notes != null and !client.notes.isEmpty()) or true}" class="card mb-3">
        <div class="card-header" th:text="#{client.detail.info}">Інформація</div>
        <div class="card-body py-2">
            <div class="d-flex flex-wrap gap-4">
                <div>
                    <span class="text-muted small" th:text="#{client.detail.totalOps}">Операцій</span>:
                    <strong th:text="${movements.size()}"></strong>
                </div>
                <div th:if="${client.notes != null and !client.notes.isEmpty()}">
                    <span class="text-muted small" th:text="#{client.form.notes}">Примітки</span>:
                    <span th:text="${client.notes}"></span>
                </div>
            </div>
        </div>
    </div>

    <!-- Movement history -->
    <div class="card">
        <div class="card-header" th:text="#{client.detail.history}">Історія операцій</div>
        <div th:unless="${movements.empty}" class="d-flex gap-2 align-items-center p-2 border-bottom flex-wrap">
            <div class="input-group input-group-sm w-auto">
                <span class="input-group-text"><i class="bi bi-search"></i></span>
                <input type="text" class="form-control" style="width: 180px;"
                       th:placeholder="#{product.form.name}"
                       oninput="applyHistoryFilters()"/>
            </div>
            <select class="form-select form-select-sm w-auto" onchange="applyHistoryFilters()">
                <option value="" th:text="#{movements.filter.allTypes}">— Всі типи —</option>
                <option value="SALE" th:text="#{movementType.SALE}">Sale</option>
                <option value="WRITE_OFF" th:text="#{movementType.WRITE_OFF}">Write Off</option>
                <option value="ADJUSTMENT" th:text="#{movementType.ADJUSTMENT}">Adjustment</option>
            </select>
        </div>
        <div class="card-body p-0">
            <div th:if="${movements.empty}" class="text-center text-muted py-4">
                <i class="bi bi-clock-history fs-1 d-block mb-2"></i>
                <span th:text="#{client.detail.noHistory}">Операцій немає</span>
            </div>
            <table th:unless="${movements.empty}" class="table table-hover mb-0">
                <thead class="table-light">
                <tr>
                    <th th:text="#{product.detail.date}">Дата</th>
                    <th th:text="#{product.form.name}">Товар</th>
                    <th th:text="#{stock.form.movementType}">Тип</th>
                    <th th:text="#{stock.form.quantity}">Кількість</th>
                    <th th:text="#{stock.form.salePrice}">Ціна</th>
                    <th th:text="#{stock.form.notes}">Примітки</th>
                    <th></th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="m : ${movements}"
                    th:classappend="${cancelledMovementIds.contains(m.id)} ? 'text-muted'"
                    th:attr="data-type=${m.movementType.name()},data-name=${m.product.name}">
                    <td th:text="${#temporals.format(m.createdAt, 'dd.MM.yyyy HH:mm')}"></td>
                    <td>
                        <a th:href="@{/products/{id}(id=${m.product.id})}"
                           th:text="${m.product.name}"
                           class="text-decoration-none fw-semibold text-dark"></a>
                    </td>
                    <td>
                        <span class="badge rounded-pill"
                              th:classappend="${m.movementType.name() == 'SALE'} ? 'bg-primary' :
                                             (${m.movementType.name() == 'WRITE_OFF'} ? 'bg-danger' : 'bg-secondary')"
                              th:text="#{movementType.__${m.movementType}__}">
                        </span>
                    </td>
                    <td>
                        <span th:text="${@qf.format(m.quantity, m.product.unit.name())}"></span>
                        <span class="text-muted small" th:text="#{unit.__${m.product.unit}__}"></span>
                    </td>
                    <td th:text="${m.unitPrice != null ? m.unitPrice + ' zł' : '—'}"></td>
                    <td th:text="${m.notes ?: '—'}"></td>
                    <td>
                        <button th:if="${m.originalMovementId == null and !cancelledMovementIds.contains(m.id)}"
                                type="button"
                                class="btn btn-sm btn-outline-secondary"
                                th:title="#{movement.edit.button}"
                                data-bs-toggle="modal"
                                data-bs-target="#editMovementModal"
                                th:attr="data-movement-id=${m.id},
                                         data-movement-type=${m.movementType.name()},
                                         data-client-id=${m.client != null ? m.client.id : ''},
                                         data-notes=${m.notes ?: ''}">
                            <i class="bi bi-pencil"></i>
                        </button>
                        <span th:if="${cancelledMovementIds.contains(m.id)}"
                              class="text-muted small" style="font-size:0.7rem"
                              th:text="#{movement.cancel.badge}"></span>
                    </td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>

    <!-- Edit movement modal -->
    <div class="modal fade" id="editMovementModal" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" th:text="#{movement.edit.title}">Редагувати операцію</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <form id="editMovementForm" method="post">
                    <input type="hidden" name="_csrf" th:value="${_csrf.token}" th:if="${_csrf != null}"/>
                    <input type="hidden" name="returnTo" th:value="@{/clients/{id}(id=${client.id})}"/>
                    <div class="modal-body">
                        <div id="editMovClientField" class="mb-3">
                            <label class="form-label fw-semibold" th:text="#{stock.form.client}">Клієнт</label>
                            <select class="form-select" name="clientId" id="editMovClientSelect">
                                <option value="" th:text="#{stock.form.selectClient}">-- Оберіть клієнта --</option>
                                <option th:each="c : ${clients}"
                                        th:value="${c.id}"
                                        th:text="${c.name}">
                                </option>
                            </select>
                        </div>
                        <div class="mb-3">
                            <label class="form-label fw-semibold" th:text="#{stock.form.notes}">Примітки</label>
                            <textarea class="form-control" name="notes" id="editMovNotes" rows="3"></textarea>
                        </div>
                    </div>
                    <div class="modal-footer">
                        <button type="button" class="btn btn-outline-secondary btn-sm"
                                data-bs-dismiss="modal" th:text="#{btn.cancel}">Скасувати</button>
                        <button type="submit" class="btn btn-primary btn-sm"
                                th:text="#{btn.save}">Зберегти</button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <script>
        function applyHistoryFilters() {
            const controls = document.querySelectorAll('.border-bottom input[type="text"], .border-bottom select');
            const q    = (controls[0]?.value || '').toLowerCase();
            const type = controls[1]?.value || '';
            document.querySelectorAll('tbody tr').forEach(row => {
                const rowName = (row.dataset.name || '').toLowerCase();
                const rowType = row.dataset.type || '';
                const nameMatch = !q    || rowName.includes(q);
                const typeMatch = !type || rowType === type;
                row.style.display = (nameMatch && typeMatch) ? '' : 'none';
            });
        }

        document.addEventListener('DOMContentLoaded', function() {
            const editMovModal = document.getElementById('editMovementModal');
            if (editMovModal) {
                editMovModal.addEventListener('show.bs.modal', function(event) {
                    const btn = event.relatedTarget;
                    const movementType = btn.getAttribute('data-movement-type');
                    document.getElementById('editMovementForm').action =
                        '/movements/' + btn.getAttribute('data-movement-id') + '/edit';
                    document.getElementById('editMovNotes').value = btn.getAttribute('data-notes') || '';
                    const clientField = document.getElementById('editMovClientField');
                    const clientSelect = document.getElementById('editMovClientSelect');
                    if (movementType === 'SALE') {
                        clientField.style.display = '';
                        clientSelect.value = btn.getAttribute('data-client-id') || '';
                    } else {
                        clientField.style.display = 'none';
                        clientSelect.value = '';
                    }
                });
            }
        });
    </script>
</div>
</body>
</html>
