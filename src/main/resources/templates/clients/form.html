<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout/main :: layout(${client.id == null} ? #{client.form.title.new} : #{client.form.title.edit}, ~{::content})}">
<body>
<div th:fragment="content">
    <style>
        #saveBtn:disabled {
            background-color: transparent;
            border-color: #6c757d;
            color: #6c757d;
            opacity: 0.65;
        }
    </style>
    <div class="page-header">
        <h1 class="page-title"
            th:text="${client.id == null} ? #{client.form.title.new} : #{client.form.title.edit}">Клієнт</h1>
        <a th:href="${returnTo == 'expense'} ? @{/movements/expense} :
                   (${returnTo == 'history'} ? @{/movements/history} :
                   (${returnTo == 'detail' and client.id != null} ? (${clientCareContext} ? '/clientcare/clients/' + ${client.id} : '/clients/' + ${client.id}) :
                   (${returnTo == 'product' and productId != null} ? @{/products/{id}(id=${productId})} :
                   (${clientCareContext} ? @{/clientcare/clients} : @{/clients}))))"
           class="btn btn-outline-secondary">
            <i class="bi bi-arrow-left me-1"></i>
            <span class="d-none d-sm-inline" th:text="#{btn.back}">Назад</span>
        </a>
    </div>
    <div class="card">
        <div class="card-body">
            <form id="clientForm" th:action="${client.id == null}
                              ? (${clientCareContext} ? @{/clientcare/clients/new} : @{/clients/new})
                              : (${clientCareContext} ? '/clientcare/clients/' + ${client.id} + '/edit' : '/clients/' + ${client.id} + '/edit')"
                  th:object="${client}" method="post">
                <input th:if="${returnTo != null}" type="hidden" name="returnTo" th:value="${returnTo}"/>
                <input th:if="${productId != null}" type="hidden" name="productId" th:value="${productId}"/>
                <input th:if="${movementId != null}" type="hidden" name="movementId" th:value="${movementId}"/>
                <input th:if="${movementType != null}" type="hidden" name="movementType" th:value="${movementType}"/>
                <input th:if="${quantity != null}" type="hidden" name="quantity" th:value="${quantity}"/>
                <div class="row g-3">
                    <div class="col-md-6">
                        <label class="form-label fw-semibold" th:text="#{client.form.name}">Ім'я</label>
                        <input type="text" class="form-control" th:field="*{name}"
                               th:classappend="${#fields.hasErrors('name')} ? 'is-invalid'"/>
                        <div class="invalid-feedback" th:errors="*{name}"></div>
                    </div>
                    <div class="col-md-6">
                        <label class="form-label fw-semibold" th:text="#{client.form.phone}">Телефон</label>
                        <input type="text" class="form-control" th:field="*{phone}"
                               oninput="this.value=this.value.replace(/[^+0-9 ()\-]/g,'')"/>
                    </div>
                    <div class="col-12">
                        <label class="form-label fw-semibold" th:text="#{client.form.notes}">Примітки</label>
                        <textarea class="form-control" rows="3" th:field="*{notes}"></textarea>
                    </div>
                    <div class="col-12 d-flex gap-2 justify-content-end">
                        <a th:href="${returnTo == 'expense'} ? @{/movements/expense} :
                                   (${returnTo == 'history'} ? @{/movements/history} :
                                   (${returnTo == 'detail' and client.id != null} ? (${clientCareContext} ? '/clientcare/clients/' + ${client.id} : '/clients/' + ${client.id}) :
                                   (${returnTo == 'product' and productId != null} ? @{/products/{id}(id=${productId})} :
                                   (${clientCareContext} ? @{/clientcare/clients} : @{/clients}))))"
                           class="btn btn-outline-secondary btn-sm"
                           th:text="#{btn.cancel}">Скасувати</a>
                        <button type="submit" id="saveBtn" class="btn btn-primary btn-sm"
                                th:disabled="${client.id != null}">
                            <i class="bi bi-check-lg me-1"></i>
                            <span th:text="#{btn.save}">Зберегти</span>
                        </button>
                    </div>
                </div>
            </form>
        </div>
    </div>

    <script>
        var initialSnapshot = null;

        function getFormSnapshot() {
            var data = {};
            document.querySelectorAll('#clientForm input:not([type=hidden]), #clientForm select, #clientForm textarea')
                .forEach(function(el) {
                    data[el.name || el.id] = el.type === 'checkbox' ? el.checked : el.value;
                });
            return JSON.stringify(data);
        }

        function syncSaveBtn() {
            var btn = document.getElementById('saveBtn');
            if (!btn || initialSnapshot === null) return;
            btn.disabled = (getFormSnapshot() === initialSnapshot);
        }

        document.addEventListener('DOMContentLoaded', function () {
            var btn = document.getElementById('saveBtn');
            if (btn && btn.disabled) {
                initialSnapshot = getFormSnapshot();
                document.getElementById('clientForm').addEventListener('input',  syncSaveBtn);
                document.getElementById('clientForm').addEventListener('change', syncSaveBtn);
            }
        });
    </script>
</div>
</body>
</html>
