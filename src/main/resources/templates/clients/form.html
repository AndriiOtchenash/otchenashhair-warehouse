<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout/main :: layout(${client.id == null} ? #{client.form.title.new} : #{client.form.title.edit}, ~{::content})}">
<body>
<div th:fragment="content">
    <div class="page-header">
        <h1 class="page-title"
            th:text="${client.id == null} ? #{client.form.title.new} : #{client.form.title.edit}">Клієнт</h1>
        <a th:href="${returnTo == 'expense'} ? @{/movements/expense} :
                   (${returnTo == 'history'} ? @{/movements/history} :
                   (${returnTo == 'detail' and client.id != null} ? @{/clients/{id}(id=${client.id})} :
                   (${returnTo == 'product' and productId != null} ? @{/products/{id}(id=${productId})} : @{/clients})))"
           class="btn btn-outline-secondary">
            <i class="bi bi-arrow-left me-1"></i>
            <span th:text="#{btn.back}">Назад</span>
        </a>
    </div>
    <div class="card">
        <div class="card-body">
            <form th:action="${client.id == null} ? @{/clients/new} : @{/clients/{id}/edit(id=${client.id})}"
                  th:object="${client}" method="post">
                <input th:if="${returnTo != null}" type="hidden" name="returnTo" th:value="${returnTo}"/>
                <input th:if="${productId != null}" type="hidden" name="productId" th:value="${productId}"/>
                <input th:if="${movementId != null}" type="hidden" name="movementId" th:value="${movementId}"/>
                <div class="row g-3">
                    <div class="col-md-6">
                        <label class="form-label fw-semibold" th:text="#{client.form.name}">Ім'я</label>
                        <input type="text" class="form-control" th:field="*{name}"
                               th:classappend="${#fields.hasErrors('name')} ? 'is-invalid'"/>
                        <div class="invalid-feedback" th:errors="*{name}"></div>
                    </div>
                    <div class="col-md-6">
                        <label class="form-label fw-semibold" th:text="#{client.form.phone}">Телефон</label>
                        <input type="text" class="form-control" th:field="*{phone}"/>
                    </div>
                    <div class="col-12">
                        <label class="form-label fw-semibold" th:text="#{client.form.notes}">Примітки</label>
                        <textarea class="form-control" rows="3" th:field="*{notes}"></textarea>
                    </div>
                    <div class="col-12 d-flex gap-2">
                        <button type="submit" class="btn btn-primary">
                            <i class="bi bi-check-lg me-1"></i>
                            <span th:text="#{btn.save}">Зберегти</span>
                        </button>
                        <a th:href="${returnTo == 'expense'} ? @{/movements/expense} :
                                   (${returnTo == 'history'} ? @{/movements/history} :
                                   (${returnTo == 'detail' and client.id != null} ? @{/clients/{id}(id=${client.id})} :
                                   (${returnTo == 'product' and productId != null} ? @{/products/{id}(id=${productId})} : @{/clients})))"
                           class="btn btn-outline-secondary"
                           th:text="#{btn.cancel}">Скасувати</a>
                    </div>
                </div>
            </form>
        </div>
    </div>
</div>
</body>
</html>
