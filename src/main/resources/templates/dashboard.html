<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout/main :: layout(#{dashboard.title}, ~{::content})}">
<body>
<div th:fragment="content">
    <style>
        .filter-active {
            border: 2px solid var(--accent) !important;
        }
        .kpi-active {
            border: 2px solid var(--accent) !important;
            box-shadow: 0 0 0 3px rgba(74, 124, 89, 0.15);
        }
        .kpi-card .small {
            line-height: 1.2;
        }
        .kpi-card {
            padding-left: 0.4rem !important;
            padding-right: 0.4rem !important;
        }
        .table td.fw-semibold {
            font-size: 0.90rem;
        }
        @media (max-width: 767.98px) {
            .stock-table { table-layout: fixed; width: 100%; min-width: 0 !important; }
            .stock-table .col-stock { width: 5rem; }
            .stock-table .col-actions { width: 6.5rem; }
            .stock-table th { text-align: center; font-size: 0.75rem; }
            .stock-table .col-actions { text-align: center; }
            .stock-table .col-actions .d-flex { justify-content: center; }
            .btn-square { width: 2rem; height: 2rem; padding: 0; display: inline-flex; align-items: center; justify-content: center; }
            .page-header { flex-direction: column; align-items: flex-start; gap: 0.75rem; }
            .page-header .d-flex.d-md-none { width: 100%; }
            .page-header .d-flex.d-md-none .btn { flex: 1; text-align: center; }
        }
    </style>
    <div class="page-header">
        <h1 class="page-title" th:text="#{dashboard.title}">Склад</h1>
        <div class="d-flex d-md-none gap-2">
            <a th:href="@{/scan(mode=income)}" class="btn btn-outline-secondary">
                <i class="bi bi-arrow-down-circle me-1 text-success"></i>
                <span th:text="#{stock.income.title}">Прихід</span>
            </a>
            <a th:href="@{/scan(mode=expense)}" class="btn btn-outline-secondary">
                <i class="bi bi-arrow-up-circle me-1 text-danger"></i>
                <span th:text="#{stock.expense.title}">Витрата</span>
            </a>
        </div>
    </div>

    <!-- KPI cards — click to filter by status -->
    <div class="col-12 col-md-5 px-0 mb-3">
        <div class="row g-2 align-items-stretch">
            <div class="col-3">
                <div class="card px-2 py-2 text-center kpi-card h-100 w-100"
                     data-kpi-status="all"
                     th:classappend="${activeStatus == 'all'} ? 'kpi-active'"
                     style="cursor:pointer"
                     onclick="filterStatus('all')">
                    <span class="fs-5 fw-bold text-secondary" th:text="${totalProducts}">0</span>
                    <span class="text-muted small d-block" th:text="#{dashboard.filter.all}">Всі</span>
                </div>
            </div>
            <div class="col-3">
                <div class="card px-2 py-2 text-center kpi-card h-100 w-100"
                     data-kpi-status="OK"
                     th:classappend="${activeStatus == 'OK'} ? 'kpi-active'"
                     style="cursor:pointer"
                     onclick="filterStatus('OK')">
                    <span class="fs-5 fw-bold text-success" th:text="${countOk}">0</span>
                    <span class="text-muted small d-block" th:text="#{dashboard.filter.ok}">В наявності</span>
                </div>
            </div>
            <div class="col-3">
                <div class="card px-2 py-2 text-center kpi-card h-100 w-100"
                     data-kpi-status="attention"
                     th:classappend="${activeStatus == 'attention'} ? 'kpi-active'"
                     data-bs-toggle="tooltip"
                     data-bs-placement="right"
                     th:title="#{dashboard.lowStock.hint}"
                     style="cursor:pointer"
                     onclick="filterStatus('attention')">
                    <span class="fs-5 fw-bold"
                          th:classappend="${lowStock > 0} ? 'text-warning' : 'text-success'"
                          th:text="${lowStock}">0</span>
                    <span class="text-muted small d-block" th:text="#{dashboard.lowStock}">Потребує уваги</span>
                </div>
            </div>
            <div class="col-3">
                <div class="card px-2 py-2 text-center kpi-card h-100 w-100"
                     data-kpi-status="out"
                     th:classappend="${activeStatus == 'out'} ? 'kpi-active'"
                     style="cursor:pointer"
                     onclick="filterStatus('out')">
                    <span class="fs-5 fw-bold"
                          th:classappend="${countOut > 0} ? 'text-danger' : 'text-success'"
                          th:text="${countOut}">0</span>
                    <span class="text-muted small d-block" th:text="#{dashboard.filter.out}">Відсутні</span>
                </div>
            </div>
        </div>
    </div>

    <!--
        form onsubmit="return false" — обёртка нужна только браузеру:
        на iOS/Android кнопки Prev/Next в нативном пикере корректно
        перемещаются между полями одной формы.
        Фильтрация остаётся мгновенной, на стороне клиента.
    -->
    <form onsubmit="return false" class="mb-3">

        <!-- Row 1: Category + Brand -->
        <div class="d-flex flex-row gap-2 mb-2">

            <!-- Brand -->
            <div class="filter-select-wrap" style="flex:1;min-width:0">
                <select name="brand" id="brandSelect" class="form-select form-select-sm">
                    <option value="" th:text="#{dashboard.filter.allBrands}">Всі бренди</option>
                    <option th:each="br : ${brands}"
                            th:value="${br}"
                            th:text="${br}">
                    </option>
                </select>
                <button type="button" id="clearBrandBtn"
                        class="btn btn-outline-secondary btn-sm d-md-none px-1"
                        onclick="clearBrand()" tabindex="-1" style="display:none">
                    <i class="bi bi-x-lg" style="font-size:0.89rem"></i>
                </button>
            </div>

            <!-- Category -->
            <div class="filter-select-wrap" style="flex:1;min-width:0">
                <select name="category" id="categorySelect" class="form-select form-select-sm">
                    <option value="" th:text="#{dashboard.filter.allCategories}">Всі категорії</option>
                    <option th:each="cat : ${categories}"
                            th:value="${cat}"
                            th:text="${cat}">
                    </option>
                </select>
                <button type="button" id="clearCategoryBtn"
                        class="btn btn-outline-secondary btn-sm d-md-none px-1"
                        onclick="clearCategory()" tabindex="-1" style="display:none">
                    <i class="bi bi-x-lg" style="font-size:0.89rem"></i>
                </button>
            </div>

        </div>

        <!-- Row 2: Search -->
        <div class="input-group input-group-sm" id="searchGroup">
            <span class="input-group-text"><i class="bi bi-search"></i></span>
            <input type="text" name="search" id="searchInput" class="form-control"
                   th:placeholder="#{dashboard.filter.search}"
                   oninput="filterSearch(this.value); toggleClearBtn(this)"/>
            <button type="button" class="btn btn-outline-secondary d-md-none"
                    onclick="clearSearch()" tabindex="-1" style="display:none">
                <i class="bi bi-x-lg"></i>
            </button>
        </div>

        <!-- Reset all filters — visible only when ≥1 filter is active -->
        <div class="mt-2">
            <button type="button" id="resetFiltersBtn"
                    class="btn btn-outline-secondary btn-sm" style="display:none"
                    onclick="resetAllFilters()">
                <i class="bi bi-funnel"></i>
                <span th:text="#{btn.reset}">Скинути</span><span id="resetFilterCount"></span>
            </button>
        </div>

    </form>

    <!-- Stock table -->
    <div class="card">
        <div class="card-body p-0">
            <div th:if="${rows.empty}" class="text-center text-muted py-5">
                <i class="bi bi-box-seam fs-1 d-block mb-2"></i>
                <span th:text="#{dashboard.empty}">Товари не знайдено</span>
            </div>
            <div class="table-responsive-wrapper">
            <table th:unless="${rows.empty}" class="table table-hover mb-0 stock-table">
                <thead style="--bs-table-bg: var(--accent-light)">
                <tr>
                    <th th:text="#{product.form.name}">Назва</th>
                    <th class="col-stock" th:text="#{dashboard.currentStock}">Залишок</th>
                    <th class="d-none d-md-table-cell" th:text="#{dashboard.status}">Статус</th>
                    <th class="col-actions" th:text="#{table.actions}">Дії</th>
                    <th class="d-none d-md-table-cell" th:text="#{product.form.brand}">Бренд</th>
                    <th class="d-none d-md-table-cell" th:text="#{product.form.category}">Категорія</th>
                    <th class="d-none d-md-table-cell" th:text="#{dashboard.expiryDate}">Термін придатності</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="row : ${rows}"
                    th:attr="data-status=${row.status.name()},data-category=${row.categoryName},data-name=${row.productName},data-brand=${row.brand}"
                    th:classappend="${row.status.name() == 'OUT'} ? 'table-danger' : (${row.status.name() == 'LOW'} ? 'table-warning' : '')"
                    th:onclick="|window.location='@{/products/{id}(id=${row.productId},from=dashboard)}'|"
                    style="cursor:pointer">
                    <td class="fw-semibold">
                        <span th:text="${row.productName}"></span>
                        <small th:if="${!#strings.isEmpty(row.description)}"
                               class="d-block d-md-none text-muted fw-normal"
                               th:text="${row.description}"></small>
                    </td>
                    <td class="col-stock">
                        <span th:text="${@qf.format(row.currentQuantity, row.unit)}"></span>
                        <span class="text-muted small" th:text="#{unit.__${row.unit}__}"></span>
                    </td>
                    <td class="d-none d-md-table-cell">
                        <span th:if="${row.status.name() == 'OK'}"
                              class="badge badge-active px-2 py-1 rounded-pill"
                              th:text="#{dashboard.status.ok}">Норма</span>
                        <span th:if="${row.status.name() == 'LOW'}"
                              class="badge bg-warning text-dark px-2 py-1 rounded-pill"
                              th:text="#{dashboard.status.low}">Мало</span>
                        <span th:if="${row.status.name() == 'OUT'}"
                              class="badge bg-danger px-2 py-1 rounded-pill"
                              th:text="#{dashboard.status.out}">Немає</span>
                    </td>
                    <td class="col-actions" onclick="event.stopPropagation()">
                        <div class="d-flex gap-1">
                            <a th:href="@{/movements/income(productId=${row.productId},returnTo='/')}"
                               class="btn btn-sm btn-outline-success btn-square px-md-2"
                               th:title="#{stock.income.title}"
                               data-bs-toggle="tooltip">
                                <i class="bi bi-arrow-down-circle"></i>
                            </a>
                            <a th:href="@{/movements/expense(productId=${row.productId},returnTo='/')}"
                               class="btn btn-sm btn-outline-danger btn-square px-md-2"
                               th:classappend="${row.status.name() == 'OUT'} ? ' disabled'"
                               th:attr="tabindex=${row.status.name() == 'OUT'} ? '-1' : null, aria-disabled=${row.status.name() == 'OUT'} ? 'true' : null"
                               th:title="#{stock.expense.title}"
                               data-bs-toggle="tooltip">
                                <i class="bi bi-arrow-up-circle"></i>
                            </a>
                        </div>
                    </td>
                    <td class="d-none d-md-table-cell" th:text="${row.brand}"></td>
                    <td class="d-none d-md-table-cell" th:text="${row.categoryName}"></td>
                    <td class="d-none d-md-table-cell">
                        <span th:if="${row.nearestExpiryDate == null}" class="text-muted">—</span>
                        <span th:unless="${row.nearestExpiryDate == null}"
                              th:text="${#temporals.format(row.nearestExpiryDate, 'dd.MM.yyyy')}"
                              th:classappend="${row.nearestExpiryDate.isBefore(#temporals.createToday().plusDays(30))} ? 'text-danger fw-semibold'">
                        </span>
                    </td>
                </tr>
                </tbody>
            </table>
            </div>
        </div>
    </div>

    <script>
        const urlParams = new URLSearchParams(window.location.search);
        let activeStatus   = urlParams.get('status')   || 'OK';
        let activeCategory = urlParams.get('category') || '';
        let activeBrand    = urlParams.get('brand')    || '';
        let activeSearch   = '';

        function applyFilters() {
            document.querySelectorAll('tbody tr').forEach(function (row) {
                const status   = row.dataset.status;
                const category = row.dataset.category || '';
                const brand    = row.dataset.brand    || '';
                const name     = row.dataset.name     || '';

                const statusMatch =
                    activeStatus === 'all'
                    || (activeStatus === 'attention' && (status === 'LOW' || status === 'OUT'))
                    || (activeStatus === 'OK'        && (status === 'OK'  || status === 'LOW'))
                    || (activeStatus === 'out'       && status === 'OUT');

                const categoryMatch = activeCategory === '' || category === activeCategory;
                const brandMatch    = activeBrand    === '' || brand    === activeBrand;
                const searchMatch   = activeSearch   === '' || name.toLowerCase().includes(activeSearch.toLowerCase());

                row.style.display = (statusMatch && categoryMatch && brandMatch && searchMatch) ? '' : 'none';
            });
        }

        function updateUrl() {
            const params = new URLSearchParams(window.location.search);
            params.set('status', activeStatus);
            if (activeCategory) params.set('category', activeCategory); else params.delete('category');
            if (activeBrand)    params.set('brand',    activeBrand);    else params.delete('brand');
            window.history.replaceState({}, '', window.location.pathname + '?' + params.toString());
        }

        function updateKpiCards() {
            document.querySelectorAll('.kpi-card').forEach(function (card) {
                card.classList.toggle('kpi-active', card.dataset.kpiStatus === activeStatus);
            });
        }

        function updateResetBtn() {
            var count = (activeCategory !== '' ? 1 : 0)
                      + (activeBrand    !== '' ? 1 : 0)
                      + (activeSearch   !== '' ? 1 : 0);
            var btn   = document.getElementById('resetFiltersBtn');
            var label = document.getElementById('resetFilterCount');
            if (btn)   btn.style.display  = count > 0 ? '' : 'none';
            if (label) label.textContent  = count > 0 ? ' (' + count + ')' : '';
        }

        function updateFilterActive() {
            var catSelect   = document.getElementById('categorySelect');
            var brandSelect = document.getElementById('brandSelect');
            if (catSelect)   catSelect.classList.toggle('filter-active',   catSelect.value   !== '');
            if (brandSelect) brandSelect.classList.toggle('filter-active', brandSelect.value !== '');
        }

        // ── filter actions ────────────────────────────────────────────

        function filterStatus(status) {
            activeStatus = status;
            updateUrl();
            updateKpiCards();
            applyFilters();
        }

        function filterCategory(value) {
            activeCategory = value;
            updateUrl();
            applyFilters();
            updateFilterActive();
            updateResetBtn();
            var btn = document.getElementById('clearCategoryBtn');
            if (btn) btn.style.display = value ? '' : 'none';
        }

        function filterBrand(value) {
            activeBrand = value;
            updateUrl();
            applyFilters();
            updateFilterActive();
            updateResetBtn();
            var btn = document.getElementById('clearBrandBtn');
            if (btn) btn.style.display = value ? '' : 'none';
        }

        function filterSearch(value) {
            activeSearch = value;
            applyFilters();
            updateResetBtn();
            var group = document.getElementById('searchGroup');
            if (group) group.classList.toggle('filter-active', value !== '');
        }

        // ── clear buttons ─────────────────────────────────────────────

        function clearCategory() {
            var sel = document.getElementById('categorySelect');
            if (sel) { sel.value = ''; filterCategory(''); }
        }

        function clearBrand() {
            var sel = document.getElementById('brandSelect');
            if (sel) { sel.value = ''; filterBrand(''); }
        }

        function clearSearch() {
            var input = document.getElementById('searchInput');
            if (input) { input.value = ''; filterSearch(''); toggleClearBtn(input); }
        }

        function resetAllFilters() {
            var catSel   = document.getElementById('categorySelect');
            var brandSel = document.getElementById('brandSelect');
            var search   = document.getElementById('searchInput');
            if (catSel)   { catSel.value   = ''; }
            if (brandSel) { brandSel.value = ''; }
            if (search)   { search.value   = ''; toggleClearBtn(search); }
            activeCategory = ''; activeBrand = ''; activeSearch = '';
            updateUrl();
            applyFilters();
            updateFilterActive();
            updateResetBtn();
            var g = document.getElementById('searchGroup');
            if (g) g.classList.remove('filter-active');
            var cc = document.getElementById('clearCategoryBtn');
            var cb = document.getElementById('clearBrandBtn');
            if (cc) cc.style.display = 'none';
            if (cb) cb.style.display = 'none';
        }

        function toggleClearBtn(input) {
            var btn = input.nextElementSibling;
            if (btn) btn.style.display = input.value ? '' : 'none';
        }

        // ── init ──────────────────────────────────────────────────────

        document.addEventListener('DOMContentLoaded', function () {
            var catSelect   = document.getElementById('categorySelect');
            var brandSelect = document.getElementById('brandSelect');

            if (catSelect   && activeCategory) catSelect.value   = activeCategory;
            if (brandSelect && activeBrand)    brandSelect.value = activeBrand;

            // Restore × button visibility from URL params
            var clearCatBtn   = document.getElementById('clearCategoryBtn');
            var clearBrandBtn = document.getElementById('clearBrandBtn');
            if (clearCatBtn)   clearCatBtn.style.display   = activeCategory ? '' : 'none';
            if (clearBrandBtn) clearBrandBtn.style.display = activeBrand    ? '' : 'none';

            // Wire up select onchange after DOM is ready (keeps HTML clean)
            if (catSelect)   catSelect.addEventListener('change',   function () { filterCategory(this.value); });
            if (brandSelect) brandSelect.addEventListener('change', function () { filterBrand(this.value); });

            updateFilterActive();
            updateKpiCards();
            applyFilters();
            updateResetBtn();
            var searchGroup = document.getElementById('searchGroup');
            if (searchGroup) searchGroup.classList.toggle('filter-active', activeSearch !== '');

            if (!('ontouchstart' in window)) {
                document.querySelectorAll('[data-bs-toggle="tooltip"]').forEach(function (el) {
                    new bootstrap.Tooltip(el);
                });
            }
        });
    </script>
</div>
</body>
</html>
