<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Помилка | OtchenashHair</title>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg"/>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"/>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"/>
    <style>
        :root { --accent: #4a7c59; }
        body { background: #f4f6f4; display: flex; align-items: center; justify-content: center; min-height: 100vh; }
    </style>
</head>
<body>
<div class="text-center px-3">
    <i class="bi bi-exclamation-circle" style="font-size:3rem; color:var(--accent);"></i>
    <h1 class="mt-3 mb-1" style="font-size:1.4rem; font-weight:600; color:#1e2d24;">
        <span th:text="${status}">500</span> —
        <span th:text="${error}">Помилка</span>
    </h1>
    <p class="text-muted mb-4" th:text="${message ?: 'Щось пішло не так. Спробуйте ще раз.'}">
        Щось пішло не так. Спробуйте ще раз.
    </p>
    <a href="/" class="btn btn-sm" style="background:#4a7c59; color:#fff; border-color:#4a7c59;">
        <i class="bi bi-house me-1"></i>На головну
    </a>
</div>
</body>
</html>
