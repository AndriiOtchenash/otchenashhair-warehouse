<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:fragment="layout(title, content)" lang="uk">
<head>
    <title th:text="${title} + ' | OtchenashHair'">OtchenashHair</title>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg"/>
    <link rel="manifest" th:href="@{/manifest.webmanifest}"/>
    <link rel="apple-touch-icon" th:href="@{/icons/icon-192.png}"/>
    <meta name="theme-color" content="#4a7c59"/>
    <meta name="apple-mobile-web-app-capable" content="yes"/>
    <meta name="apple-mobile-web-app-title" content="OtchenashHair"/>
    <meta name="apple-mobile-web-app-status-bar-style" content="default"/>
    <meta name="_csrf" th:content="${_csrf.token}"/>
    <meta name="_csrf_header" th:content="${_csrf.headerName}"/>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"/>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"/>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/tom-select@2.3.1/dist/css/tom-select.bootstrap5.min.css"/>
    <style>
        :root {
            --sidebar-width: 240px;
            --accent: #4a7c59;
            --accent-light: #e8f5e9;
            --sidebar-bg: #1e2d24;
            --sidebar-text: #c8d8cb;
            --sidebar-hover: #2e4a35;
            --sidebar-active: #4a7c59;
            --topbar-height: 52px;
        }
        body { background: #f4f6f4; font-family: var(--bs-body-font-family); }

        /* ── Sidebar ── */
        .sidebar {
            width: var(--sidebar-width);
            min-height: 100vh;
            background: var(--sidebar-bg);
            position: fixed;
            top: 0; left: 0;
            display: flex;
            flex-direction: column;
            z-index: 150;
            transition: transform 0.25s ease;
        }
        .sidebar-brand {
            padding: 1.5rem 1.25rem 1rem;
            color: #fff;
            font-size: 1.1rem;
            font-weight: 700;
            letter-spacing: 0.03em;
            border-bottom: 1px solid #2e4a35;
            text-decoration: none;
            display: block;
        }
        .sidebar-brand span { color: #8fb59a; }
        .sidebar-nav { padding: 1rem 0; flex: 1; min-height: 0; overflow-y: auto; }
        .nav-label {
            font-size: 0.65rem;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            color: #6b8c74;
            padding: 0.75rem 1.25rem 0.25rem;
        }
        .sidebar-nav .nav-link {
            color: var(--sidebar-text);
            padding: 0.55rem 1.25rem;
            display: flex;
            align-items: center;
            gap: 0.65rem;
            font-size: 0.9rem;
            transition: background 0.15s;
        }
        .sidebar-nav .nav-link:hover { background: var(--sidebar-hover); color: #fff; }
        .sidebar-nav .nav-link.active { background: var(--sidebar-active); color: #fff; }
        .sidebar-nav .nav-link i { font-size: 1rem; width: 1.1rem; }
        .lang-switcher {
            padding: 0.75rem 1.25rem;
            border-top: 1px solid #2e4a35;
            display: flex;
            gap: 0.4rem;
        }
        .lang-btn {
            font-size: 0.75rem;
            padding: 0.2rem 0.5rem;
            border-radius: 4px;
            color: var(--sidebar-text);
            text-decoration: none;
            border: 1px solid #3a5a42;
            transition: all 0.15s;
        }
        .lang-btn:hover, .lang-btn.active { background: var(--accent); color: #fff; border-color: var(--accent); }

        /* ── Module switcher ── */
        .module-switcher { display: flex; gap: 0.35rem; padding: 0.6rem 1.25rem; border-bottom: 1px solid #2e4a35; }
        .module-pill {
            font-size: 0.75rem;
            font-weight: 600;
            padding: 0.15rem 0.6rem;
            border-radius: 20px;
            color: var(--sidebar-text);
            text-decoration: none;
            border: 1px solid #3a5a42;
            white-space: nowrap;
            transition: all 0.15s;
        }
        .module-pill:hover { background: var(--sidebar-hover); color: #fff; }
        .module-pill.active { background: var(--accent); color: #fff; border-color: var(--accent); }

        /* ── Main content ── */
        .main-content {
            margin-left: var(--sidebar-width);
            min-height: 100vh;
            padding: 2rem;
        }

        /* ── Page header ── */
        .page-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 1.5rem;
            padding-bottom: 1rem;
            border-bottom: 1px solid #dee2e6;
        }
        .page-title { font-size: 1.4rem; font-weight: 600; color: #1e2d24; margin: 0; }

        /* ── Cards & tables ── */
        .card { border: none; box-shadow: 0 1px 4px rgba(0,0,0,0.07); border-radius: 10px; }
        .card-header { background: #fff; border-bottom: 1px solid #f0f0f0; font-weight: 600; }
        .card-body { overflow-x: auto; -webkit-overflow-scrolling: touch; }
        .table { min-width: 500px; }
        .table-auto { min-width: 0 !important; }
        .table th { font-size: 0.8rem; text-transform: uppercase; letter-spacing: 0.05em; color: #6c757d; font-weight: 600; vertical-align: middle; }
        .table td { vertical-align: middle; }
        .table tbody tr:hover { background: var(--accent-light); }

        /* ── Buttons ── */
        .btn-primary { background: var(--accent); border-color: var(--accent); }
        .btn-primary:hover { background: #3d6b4a; border-color: #3d6b4a; }
        .btn-primary:active, .btn-primary:focus, .btn-primary:active:focus { background: #3d6b4a; border-color: #3d6b4a; box-shadow: 0 0 0 0.25rem rgba(74,124,89,0.4); }
        .btn-outline-primary { color: var(--accent); border-color: var(--accent); }
        .btn-outline-primary:hover { background: var(--accent); border-color: var(--accent); color: #fff; }
        .badge-active { background: #d4edda; color: #155724; font-weight: 500; }
        .badge-inactive { background: #f8d7da; color: #721c24; font-weight: 500; }

        /* ── Mobile topbar ── */
        .mobile-topbar { display: none; }

        /* ── Mobile overrides ── */
        @media (max-width: 768px) {
            .table-responsive-wrapper { overflow-x: auto; -webkit-overflow-scrolling: touch; }
            .page-header .d-flex { flex-wrap: wrap; }
        }
        @media (max-width: 767px) {
            .sidebar {
                transform: translateX(-100%);
                top: var(--topbar-height);
                overflow-y: auto;
                height: calc(100vh - var(--topbar-height));
            }
            .sidebar.open { transform: translateX(0); }

            .mobile-topbar {
                display: flex;
                align-items: center;
                position: fixed;
                top: 0; left: 0; right: 0;
                height: var(--topbar-height);
                background: var(--sidebar-bg);
                z-index: 160;
                padding: 0 1rem;
                gap: 0.75rem;
            }
            .mobile-topbar-brand {
                color: #fff;
                font-weight: 700;
                font-size: 1rem;
                text-decoration: none;
                flex: 1;
            }
            .mobile-topbar-brand span { color: #8fb59a; }
            .mobile-burger {
                background: none;
                border: none;
                color: #fff;
                font-size: 1.4rem;
                cursor: pointer;
                padding: 0;
                line-height: 1;
            }

            .main-content {
                margin-left: 0 !important;
                padding: 1rem;
                padding-top: calc(var(--topbar-height) + 1rem);
            }

            .page-header .btn { white-space: nowrap; }

            /* table readability on mobile */
            .table th { font-size: 0.76rem; letter-spacing: 0.03em; }
            .table td { font-size: 0.9rem; }

            /* compact action buttons in table cells */
            .table td .btn { padding-top: 0; padding-bottom: 0; padding-left: 0.25rem; padding-right: 0.25rem; }

            /* actions column — minimum width, buttons right, header centered */
            .table td:last-child, .table th:last-child { width: 1%; white-space: nowrap; padding-left: 0; }
            .table td:last-child { text-align: right; }
            .table th:last-child { text-align: center; }
            .table td:last-child > .d-flex { justify-content: flex-end; }

            /* filters wrap on mobile */
            .d-flex.gap-2.mb-3.align-items-center {
                flex-wrap: wrap;
            }
            .d-flex.gap-2.mb-3.align-items-center .ms-auto {
                margin-left: 0 !important;
                width: 100%;
            }
            .d-flex.gap-2.mb-3.align-items-center .ms-auto .input-group {
                width: 100% !important;
            }
            .d-flex.gap-2.mb-3.align-items-center .ms-auto .form-control {
                width: 100% !important;
            }
        }
        .card-header { background-color: var(--accent-light) !important; }
        .filter-active { border: 2px solid var(--accent) !important; }
        button.filter-active { background-color: transparent !important; color: inherit !important; box-shadow: none !important; }
        .badge-writeoff { background-color: #f5a3b0 !important; color: #7d2535 !important; }
        @media (max-width: 767.98px) {
            .filter-select-wrap { display: flex; align-items: center; gap: 0.4rem; }
            .filter-select-wrap > select { flex: 1; min-width: 0; }
            .filter-select-wrap > button { flex-shrink: 0; }
        }
    </style>
</head>
<body>

<!-- Mobile topbar -->
<div class="mobile-topbar">
    <button class="mobile-burger" id="sidebarToggle" aria-label="Menu">
        <i class="bi bi-list"></i>
    </button>
    <a th:href="@{/}" class="mobile-topbar-brand">🌿 Otchenash<span>Hair</span></a>
    <div class="d-flex gap-1">
        <a th:href="@{/}" class="module-pill" th:classappend="${activeModule == 'warehouse'} ? ' active'">
            <span th:text="#{nav.module.warehouse}">Склад</span>
        </a>
        <a th:href="@{/clientcare}" class="module-pill" th:classappend="${activeModule == 'clientcare'} ? ' active'">
            ClientCare
        </a>
    </div>
</div>

<!-- Overlay -->
<div id="sidebarOverlay"
     style="display:none;position:fixed;inset:0;background:rgba(0,0,0,0.4);z-index:140;"></div>

<div class="d-flex">
    <nav class="sidebar">
        <a class="sidebar-brand d-none d-md-block" th:href="@{/}">🌿 Otchenash<span>Hair</span></a>

        <!-- Module switcher (desktop) -->
        <div class="module-switcher d-none d-md-flex">
            <a th:href="@{/}" class="module-pill" th:classappend="${activeModule == 'warehouse'} ? ' active'">
                <span th:text="#{nav.module.warehouse}">Склад</span>
            </a>
            <a th:href="@{/clientcare}" class="module-pill" th:classappend="${activeModule == 'clientcare'} ? ' active'">
                ClientCare
            </a>
        </div>

        <div class="sidebar-nav">
            <div class="nav-label" th:text="#{nav.section.stock}">Склад</div>
            <a th:href="@{/}"
               th:classappend="${currentUri != null and currentUri == '/'} ? 'active'"
               class="nav-link">
                <i class="bi bi-grid"></i>
                <span th:text="#{nav.dashboard}">Поточні залишки</span>
            </a>
            <a th:href="@{/movements/income}"
               th:classappend="${currentUri != null and currentUri.startsWith('/movements/income')} ? 'active'"
               class="nav-link d-none d-md-flex">
                <i class="bi bi-arrow-down-circle"></i>
                <span th:text="#{nav.stock.income}">Прихід</span>
            </a>
            <a th:href="@{/scan(mode=income)}"
               th:classappend="${currentUri != null and currentUri.startsWith('/movements/income')} ? 'active'"
               class="nav-link d-flex d-md-none">
                <i class="bi bi-arrow-down-circle"></i>
                <span th:text="#{nav.stock.income}">Прихід</span>
            </a>
            <a th:href="@{/movements/expense}"
               th:classappend="${currentUri != null and currentUri.startsWith('/movements/expense')} ? 'active'"
               class="nav-link d-none d-md-flex">
                <i class="bi bi-arrow-up-circle"></i>
                <span th:text="#{nav.stock.expense}">Витрата</span>
            </a>
            <a th:href="@{/scan(mode=expense)}"
               th:classappend="${currentUri != null and currentUri.startsWith('/movements/expense')} ? 'active'"
               class="nav-link d-flex d-md-none">
                <i class="bi bi-arrow-up-circle"></i>
                <span th:text="#{nav.stock.expense}">Витрата</span>
            </a>
            <div class="nav-label" th:text="#{nav.section.directory}">Довідники</div>
            <a th:href="@{/products}"
               th:classappend="${currentUri != null and currentUri.startsWith('/products')} ? 'active'"
               class="nav-link">
                <i class="bi bi-box-seam"></i>
                <span th:text="#{nav.products}">Товари</span>
            </a>
            <a th:href="@{/clients}"
               th:classappend="${currentUri != null and currentUri.startsWith('/clients')} ? 'active'"
               class="nav-link">
                <i class="bi bi-people"></i>
                <span th:text="#{nav.clients}">Клієнти</span>
            </a>
            <a th:href="@{/suppliers}"
               th:classappend="${currentUri != null and currentUri.startsWith('/suppliers')} ? 'active'"
               class="nav-link">
                <i class="bi bi-truck"></i>
                <span th:text="#{nav.suppliers}">Постачальники</span>
            </a>
            <a th:href="@{/categories}"
               th:classappend="${currentUri != null and currentUri.startsWith('/categories')} ? 'active'"
               class="nav-link">
                <i class="bi bi-tags"></i>
                <span th:text="#{nav.categories}">Категорії</span>
            </a>

            <div class="nav-label" th:text="#{nav.section.analytics}">Аналітика</div>
            <a th:href="@{/movements/history}"
               th:classappend="${currentUri != null and currentUri.startsWith('/movements/history')} ? 'active'"
               class="nav-link">
                <i class="bi bi-clock-history"></i>
                <span th:text="#{movements.history.title}">Журнал операцій</span>
            </a>
            <a th:href="@{/reports}"
               th:classappend="${currentUri != null and currentUri.startsWith('/reports')} ? 'active'"
               class="nav-link">
                <i class="bi bi-bar-chart-line"></i>
                <span th:text="#{nav.reports}">Звіти</span>
            </a>
            <a th:href="@{/ai}"
               th:classappend="${currentUri != null and currentUri.startsWith('/ai')} ? 'active'"
               class="nav-link">
                <i class="bi bi-robot"></i>
                <span th:text="#{nav.ai}">AI Асистент</span>
            </a>
            <div style="border-top: 1px solid #2e4a35; margin: 0.5rem 0;"></div>
            <div class="px-3 pb-2">
                <form th:action="@{/logout}" method="post" class="d-inline">
                    <button type="submit"
                            style="background:none;border:none;font-size:0.8rem;
                                   color:var(--sidebar-text);cursor:pointer;padding:0;">
                        <i class="bi bi-box-arrow-right me-1"></i>
                        <span th:text="#{nav.logout}">Вийти</span>
                    </button>
                </form>
            </div>
            <div class="px-3 pb-2">
                <a th:href="@{/profile/change-password}"
                   class="text-decoration-none"
                   style="font-size:0.8rem; color: var(--sidebar-text);">
                    <i class="bi bi-key me-1"></i>
                    <span th:text="#{nav.changePassword}">Змінити пароль</span>
                </a>
            </div>
            <div class="lang-switcher mt-2">
                <a href="#" onclick="switchLang('uk'); return false;"
                   th:classappend="${#locale.language == 'uk'} ? 'active'"
                   class="lang-btn">UA</a>
                <a href="#" onclick="switchLang('pl'); return false;"
                   th:classappend="${#locale.language == 'pl'} ? 'active'"
                   class="lang-btn">PL</a>
                <a href="#" onclick="switchLang('en'); return false;"
                   th:classappend="${#locale.language == 'en'} ? 'active'"
                   class="lang-btn">EN</a>
            </div>
        </div>
    </nav>
    <main class="main-content w-100">
        <div th:replace="${content}">Content here</div>
    </main>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/tom-select@2.3.1/dist/js/tom-select.complete.min.js"></script>
<script>
    document.addEventListener('DOMContentLoaded', function () {
        document.querySelectorAll('select.ts-client').forEach(function (el) {
            new TomSelect(el, { allowEmptyOption: true, maxOptions: null, plugins: [], render: { option_create: null } });
        });
    });
</script>
<script>
    function switchLang(lang) {
        const params = new URLSearchParams(window.location.search);
        params.set('lang', lang);
        // Preserve values currently in any GET filter form even if not yet submitted
        document.querySelectorAll('form').forEach(function (form) {
            if (form.method === 'get') {
                new FormData(form).forEach(function (value, key) {
                    if (value !== '') params.set(key, value);
                });
            }
        });
        window.location.href = window.location.pathname + '?' + params.toString();
    }

    document.addEventListener('DOMContentLoaded', function() {
        const toggle = document.getElementById('sidebarToggle');
        const sidebar = document.querySelector('.sidebar');
        const overlay = document.getElementById('sidebarOverlay');

        if (!toggle || !sidebar || !overlay) return;

        // Restore sidebar state (stays open when switching modules)
        if (sessionStorage.getItem('sidebarOpen') === 'true') {
            sidebar.classList.add('open');
            overlay.style.display = 'block';
        }

        toggle.addEventListener('click', function() {
            sidebar.classList.toggle('open');
            const isOpen = sidebar.classList.contains('open');
            overlay.style.display = isOpen ? 'block' : 'none';
            sessionStorage.setItem('sidebarOpen', isOpen);
        });

        overlay.addEventListener('click', function() {
            sidebar.classList.remove('open');
            overlay.style.display = 'none';
            sessionStorage.setItem('sidebarOpen', 'false');
        });

        // Nav links close the sidebar; module pills preserve state
        sidebar.querySelectorAll('.nav-link').forEach(function(link) {
            link.addEventListener('click', function() {
                sessionStorage.setItem('sidebarOpen', 'false');
            });
        });
    });
</script>
<script>
    setInterval(() => fetch('/keepalive', {method: 'GET'}), 180000);
</script>
</body>
</html>
