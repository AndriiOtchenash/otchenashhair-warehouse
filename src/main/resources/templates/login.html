<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>OtchenashHair — Вхід</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg"/>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"/>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"/>
    <style>
        body { background: #f4f6f4; display: flex; align-items: center; justify-content: center; min-height: 100vh; }
        .login-card { width: 100%; max-width: 380px; }
        .brand { color: #1e2d24; font-weight: 700; font-size: 1.4rem; text-align: center; margin-bottom: 1.5rem; }
        .brand span { color: #4a7c59; }
        .btn-primary { background: #4a7c59; border-color: #4a7c59; }
        .btn-primary:hover { background: #3d6b4a; border-color: #3d6b4a; }
        .btn-primary:active, .btn-primary:focus, .btn-primary:active:focus { background: #3d6b4a; border-color: #3d6b4a; box-shadow: 0 0 0 0.25rem rgba(74,124,89,0.4); }
    </style>
</head>
<body>
    <div class="login-card">
        <div class="brand">🌿 Otchenash<span>Hair</span></div>
        <div class="card shadow-sm border-0 rounded-3">
            <div class="card-body p-4">
                <div th:if="${param.error}" class="alert alert-danger py-2 small">
                    Невірний логін або пароль
                </div>
                <div th:if="${param.logout}" class="alert alert-success py-2 small">
                    Ви вийшли з системи
                </div>
                <form th:action="@{/login}" method="post">
                    <div class="mb-3">
                        <label class="form-label fw-semibold">Логін</label>
                        <input type="text" class="form-control" name="username" autofocus/>
                    </div>
                    <div class="mb-4">
                        <label class="form-label fw-semibold">Пароль</label>
                        <div class="input-group">
                            <input type="password" class="form-control" name="password" id="loginPassword"/>
                            <button class="btn btn-outline-secondary" type="button"
                                    onclick="togglePassword('loginPassword', this)">
                                <i class="bi bi-eye"></i>
                            </button>
                        </div>
                    </div>
                    <button type="submit" class="btn btn-primary w-100">
                        Увійти
                    </button>
                </form>
            </div>
        </div>
    </div>
    <script>
    function togglePassword(fieldId, btn) {
        const input = document.getElementById(fieldId);
        const icon = btn.querySelector('i');
        if (input.type === 'password') {
            input.type = 'text';
            icon.className = 'bi bi-eye-slash';
        } else {
            input.type = 'password';
            icon.className = 'bi bi-eye';
        }
    }
    </script>
</body>
</html>
