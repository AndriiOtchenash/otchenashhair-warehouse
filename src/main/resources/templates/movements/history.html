<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout/main :: layout(#{movements.history.title}, ~{::content})}">
<body>
<div th:fragment="content">
    <div class="page-header">
        <h1 class="page-title" th:text="#{movements.history.title}">Журнал операцій</h1>
    </div>

    <!-- Filters -->
    <form method="get" action="/movements/history" class="card mb-3">
        <div class="card-body">
            <div class="row g-2 align-items-end">
                <div class="col-6 col-md-auto">
                    <label class="form-label form-label-sm fw-semibold" th:text="#{movements.filter.dateFrom}">Від</label>
                    <input type="date" class="form-control form-control-sm"
                           name="dateFrom"
                           th:value="${filter.dateFrom}"/>
                </div>
                <div class="col-6 col-md-auto">
                    <label class="form-label form-label-sm fw-semibold" th:text="#{movements.filter.dateTo}">До</label>
                    <input type="date" class="form-control form-control-sm"
                           name="dateTo"
                           th:value="${filter.dateTo}"/>
                </div>
                <div class="col-6 col-md-auto">
                    <label class="form-label form-label-sm fw-semibold" th:text="#{stock.form.movementType}">Тип</label>
                    <select class="form-select form-select-sm" name="movementType">
                        <option value="" th:text="#{movements.filter.allTypes}">Всі типи</option>
                        <option th:each="t : ${movementTypes}"
                                th:value="${t}"
                                th:text="#{movementType.__${t}__}"
                                th:selected="${filter.movementType == t}">
                        </option>
                    </select>
                </div>
                <div class="col-6 col-md-auto">
                    <label class="form-label form-label-sm fw-semibold" th:text="#{stock.form.product}">Товар</label>
                    <select class="form-select form-select-sm" name="productId">
                        <option value="" th:text="#{movements.filter.allProducts}">Всі товари</option>
                        <option th:each="p : ${products}"
                                th:value="${p.id}"
                                th:text="${p.name}"
                                th:selected="${filter.productId == p.id}">
                        </option>
                    </select>
                </div>
                <div class="col-12 col-md-auto">
                    <label class="form-label form-label-sm fw-semibold" th:text="#{movements.filter.counterparty}">Контрагент</label>
                    <input type="text" class="form-control form-control-sm"
                           name="counterparty"
                           th:value="${filter.counterparty}"
                           th:placeholder="#{movements.filter.counterparty.hint}"/>
                </div>
                <div class="col-12 col-md-auto d-flex gap-2 align-items-end">
                    <button type="submit" class="btn btn-primary btn-sm">
                        <i class="bi bi-funnel me-1"></i>
                        <span th:text="#{btn.filter}">Фільтрувати</span>
                    </button>
                    <a href="/movements/history" class="btn btn-outline-secondary btn-sm"
                       th:text="#{btn.reset}">Скинути</a>
                </div>
            </div>
        </div>
    </form>

    <!-- Results summary -->
    <div class="text-muted small mb-2">
        <span th:text="#{movements.found}">Знайдено:</span>
        <strong th:text="${totalElements}">0</strong>
        <span th:text="#{movements.records}">записів</span>
    </div>

    <!-- Table -->
    <div class="card">
        <div class="card-body p-0">
            <div th:if="${movements.empty}" class="text-center text-muted py-5">
                <i class="bi bi-clock-history fs-1 d-block mb-2"></i>
                <span th:text="#{movements.empty}">Операцій не знайдено</span>
            </div>
            <table th:unless="${movements.empty}" class="table table-hover mb-0">
                <thead class="table-light">
                <tr>
                    <th th:text="#{product.detail.date}">Дата</th>
                    <th th:text="#{stock.form.product}">Товар</th>
                    <th style="min-width:55px" th:text="#{stock.form.movementType}">Тип</th>
                    <th style="min-width:65px" th:text="#{stock.form.quantity}">Кількість</th>
                    <th th:text="#{movement.price}">Ціна</th>
                    <th style="min-width:85px" th:text="#{movements.counterparty}">Контрагент</th>
                    <th class="d-none d-md-table-cell" th:text="#{stock.form.notes}">Примітки</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="m : ${movements}">
                    <td style="white-space:nowrap">
                        <div class="small fw-semibold"
                             th:text="${#temporals.format(m.createdAt, 'dd.MM.yyyy')}"></div>
                        <div class="text-muted" style="font-size:0.75rem"
                             th:text="${#temporals.format(m.createdAt, 'HH:mm')}"></div>
                    </td>
                    <td>
                        <a th:href="@{/products/{id}(id=${m.product.id})}"
                           th:text="${m.product.name}"
                           class="text-decoration-none fw-semibold text-dark"></a>
                    </td>
                    <td>
                        <span class="badge rounded-pill"
                              th:classappend="${m.movementType.name() == 'PURCHASE'} ? 'bg-success' :
                                             (${m.movementType.name() == 'SALE'} ? 'bg-primary' :
                                             (${m.movementType.name() == 'WRITE_OFF'} ? 'bg-danger' : 'bg-secondary'))"
                              th:text="#{movementType.__${m.movementType}__}">
                        </span>
                    </td>
                    <td>
                        <span th:text="${@qf.format(m.quantity, m.product.unit.name())}"></span>
                        <span class="text-muted small" th:text="#{unit.__${m.product.unit}__}"></span>
                    </td>
                    <td th:text="${m.unitPrice != null ? m.unitPrice + ' zł' : '—'}"></td>
                    <td>
                        <span th:if="${m.supplier != null}" th:text="${m.supplier.name}"></span>
                        <span th:if="${m.client != null}" th:text="${m.client.name}"></span>
                        <span th:if="${m.supplier == null and m.client == null}">—</span>
                    </td>
                    <td class="d-none d-md-table-cell"
                        th:text="${m.notes ?: '—'}"></td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>

    <!-- Pagination -->
    <nav th:if="${page.totalPages > 1}" class="mt-3">
        <ul class="pagination pagination-sm">
            <li class="page-item" th:classappend="${page.first} ? 'disabled'">
                <a class="page-link"
                   th:href="@{/movements/history(page=${page.number - 1},dateFrom=${filter.dateFrom},dateTo=${filter.dateTo},movementType=${filter.movementType},productId=${filter.productId},counterparty=${filter.counterparty})}">‹</a>
            </li>
            <li class="page-item"
                th:each="i : ${#numbers.sequence(0, page.totalPages - 1)}"
                th:classappend="${i == page.number} ? 'active'">
                <a class="page-link"
                   th:href="@{/movements/history(page=${i},dateFrom=${filter.dateFrom},dateTo=${filter.dateTo},movementType=${filter.movementType},productId=${filter.productId},counterparty=${filter.counterparty})}"
                   th:text="${i + 1}">1</a>
            </li>
            <li class="page-item" th:classappend="${page.last} ? 'disabled'">
                <a class="page-link"
                   th:href="@{/movements/history(page=${page.number + 1},dateFrom=${filter.dateFrom},dateTo=${filter.dateTo},movementType=${filter.movementType},productId=${filter.productId},counterparty=${filter.counterparty})}">›</a>
            </li>
        </ul>
    </nav>

    <style>
        .table th {
            font-size: 0.65rem !important;
            white-space: normal;
            word-break: keep-all;
            hyphens: none;
            text-align: center;
            vertical-align: bottom;
            padding: 0.4rem 0.25rem;
        }
        .table td {
            text-align: center;
            vertical-align: middle;
        }
        .table td:nth-child(2) { text-align: left; }
        .table td:last-child { text-align: left; }
        @media (max-width: 767px) {
            .table th, .table td { font-size: 0.8rem; padding: 0.35rem 0.25rem; }
        }
    </style>
</div>
</body>
</html>
