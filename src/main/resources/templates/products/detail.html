<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout/main :: layout(${product.name}, ~{::content})}">
<body>
<div th:fragment="content">
    <div class="page-header">
        <div>
            <h1 class="page-title" th:text="${product.name}"></h1>
            <span class="text-muted small" th:text="${product.brand}"></span>
        </div>
        <div class="d-flex gap-2">
            <a th:href="@{/movements/income(productId=${product.id})}"
               class="btn btn-primary btn-sm">
                <i class="bi bi-arrow-down-circle me-1"></i>
                <span th:text="#{stock.income.title}">Прихід</span>
            </a>
            <a th:href="@{/movements/expense(productId=${product.id})}"
               class="btn btn-outline-primary btn-sm">
                <i class="bi bi-arrow-up-circle me-1"></i>
                <span th:text="#{stock.expense.title}">Витрата</span>
            </a>
            <a th:href="@{/products/{id}/edit(id=${product.id})}"
               class="btn btn-outline-secondary btn-sm">
                <i class="bi bi-pencil me-1"></i>
                <span th:text="#{btn.edit}">Редагувати</span>
            </a>
            <a th:href="@{/products}" class="btn btn-outline-secondary btn-sm">
                <i class="bi bi-arrow-left me-1"></i>
                <span th:text="#{btn.back}">Назад</span>
            </a>
        </div>
    </div>

    <div class="row g-3">
        <!-- Product info -->
        <div class="col-md-4">
            <div class="card h-100">
                <div class="card-header" th:text="#{product.detail.info}">Інформація</div>
                <div class="card-body">
                    <table class="table table-sm mb-0">
                        <tr>
                            <td class="text-muted" th:text="#{product.form.category}">Категорія</td>
                            <td th:text="${product.category?.name}"></td>
                        </tr>
                        <tr>
                            <td class="text-muted" th:text="#{product.form.unit}">Од. виміру</td>
                            <td th:text="#{unit.__${product.unit}__}"></td>
                        </tr>
                        <tr>
                            <td class="text-muted" th:text="#{product.form.unitSize}">Обсяг</td>
                            <td th:text="${product.unitSize}"></td>
                        </tr>
                        <tr>
                            <td class="text-muted" th:text="#{product.form.barcode}">Штрихкод</td>
                            <td th:text="${product.barcode}"></td>
                        </tr>
                        <tr>
                            <td class="text-muted" th:text="#{product.form.minStockLevel}">Мін. залишок</td>
                            <td th:text="${product.minStockLevel}"></td>
                        </tr>
                        <tr>
                            <td class="text-muted" th:text="#{dashboard.currentStock}">Залишок</td>
                            <td>
                                <strong th:text="${@qf.format(totalQuantity, product.unit != null ? product.unit.name() : 'PCS')}"></strong>
                                <span class="text-muted small" th:text="#{unit.__${product.unit}__}"></span>
                            </td>
                        </tr>
                    </table>
                    <div th:if="${product.description}" class="mt-3 text-muted small"
                         th:text="${product.description}"></div>
                </div>
            </div>
        </div>

        <!-- Stock batches -->
        <div class="col-md-8">
            <div class="card mb-3">
                <div class="card-header" th:text="#{product.detail.batches}">Партії на складі</div>
                <div class="card-body p-0">
                    <div th:if="${stockItems.empty}" class="text-center text-muted py-3">
                        <span th:text="#{product.detail.noBatches}">Партій немає</span>
                    </div>
                    <table th:unless="${stockItems.empty}" class="table table-sm mb-0">
                        <thead class="table-light">
                        <tr>
                            <th th:text="#{stock.form.quantity}">Кількість</th>
                            <th th:text="#{stock.form.purchasePrice}">Ціна закупки</th>
                            <th th:text="#{stock.form.expiryDate}">Термін придатності</th>
                            <th th:text="#{stock.form.batchNumber}">Партія</th>
                            <th th:text="#{product.detail.received}">Отримано</th>
                        </tr>
                        </thead>
                        <tbody>
                        <tr th:each="item : ${stockItems}"
                            th:classappend="${item.quantity.compareTo(T(java.math.BigDecimal).ZERO) == 0} ? 'text-muted'">
                            <td>
                                <span th:text="${@qf.format(item.quantity, product.unit != null ? product.unit.name() : 'PCS')}"></span>
                                <span class="small" th:text="#{unit.__${product.unit}__}"></span>
                            </td>
                            <td th:text="${item.purchasePrice}"></td>
                            <td>
                                <span th:if="${item.expiryDate == null}">—</span>
                                <span th:unless="${item.expiryDate == null}"
                                      th:text="${#temporals.format(item.expiryDate, 'dd.MM.yyyy')}"
                                      th:classappend="${item.expiryDate.isBefore(#temporals.createToday().plusDays(30))} ? 'text-danger fw-semibold'">
                                </span>
                            </td>
                            <td th:text="${item.batchNumber ?: '—'}"></td>
                            <td th:text="${#temporals.format(item.createdAt, 'dd.MM.yyyy')}"></td>
                        </tr>
                        </tbody>
                    </table>
                </div>
            </div>

            <!-- Movement history -->
            <div class="card">
                <div class="card-header" th:text="#{product.detail.history}">Історія операцій</div>
                <div th:unless="${movements.empty}" class="d-flex gap-2 align-items-center p-2 border-bottom flex-wrap">
                    <select class="form-select form-select-sm w-auto" onchange="applyHistoryFilters()">
                        <option value="">— Всі типи —</option>
                        <option value="PURCHASE" th:text="#{movementType.PURCHASE}">Purchase</option>
                        <option value="SALE" th:text="#{movementType.SALE}">Sale</option>
                        <option value="WRITE_OFF" th:text="#{movementType.WRITE_OFF}">Write Off</option>
                        <option value="ADJUSTMENT" th:text="#{movementType.ADJUSTMENT}">Adjustment</option>
                    </select>
                    <div class="input-group input-group-sm w-auto">
                        <span class="input-group-text">від</span>
                        <input type="date" class="form-control" id="histDateFrom" onchange="applyHistoryFilters()"/>
                    </div>
                    <div class="input-group input-group-sm w-auto">
                        <span class="input-group-text">до</span>
                        <input type="date" class="form-control" id="histDateTo" onchange="applyHistoryFilters()"/>
                    </div>
                </div>
                <div class="card-body p-0">
                    <div th:if="${movements.empty}" class="text-center text-muted py-3">
                        <span th:text="#{product.detail.noHistory}">Операцій немає</span>
                    </div>
                    <table th:unless="${movements.empty}" class="table table-sm mb-0">
                        <thead class="table-light">
                        <tr>
                            <th th:text="#{product.detail.date}">Дата</th>
                            <th th:text="#{stock.form.movementType}">Тип</th>
                            <th th:text="#{stock.form.quantity}">Кількість</th>
                            <th th:text="#{stock.form.purchasePrice}">Ціна</th>
                            <th>Контрагент</th>
                            <th th:text="#{stock.form.notes}">Примітки</th>
                        </tr>
                        </thead>
                        <tbody>
                        <tr th:each="m : ${movements}"
                            th:attr="data-type=${m.movementType.name()},data-date=${#temporals.format(m.createdAt, 'yyyy-MM-dd')}">
                            <td th:text="${#temporals.format(m.createdAt, 'dd.MM.yyyy HH:mm')}"></td>
                            <td>
                                <span class="badge rounded-pill"
                                      th:classappend="${m.movementType.name() == 'PURCHASE'} ? 'bg-success' :
                                                     (${m.movementType.name() == 'SALE'} ? 'bg-primary' :
                                                     (${m.movementType.name() == 'WRITE_OFF'} ? 'bg-danger' : 'bg-secondary'))"
                                      th:text="#{movementType.__${m.movementType}__}">
                                </span>
                            </td>
                            <td th:text="${m.quantity}"></td>
                            <td th:text="${m.unitPrice ?: '—'}"></td>
                            <td>
                                <span th:if="${m.supplier != null}" th:text="${m.supplier.name}"></span>
                                <span th:if="${m.client != null}" th:text="${m.client.name}"></span>
                                <span th:if="${m.supplier == null and m.client == null}">—</span>
                            </td>
                            <td th:text="${m.notes ?: '—'}"></td>
                        </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <script>
        function applyHistoryFilters() {
            const type = document.querySelector('.card:last-of-type select').value;
            const from = document.getElementById('histDateFrom').value;
            const to   = document.getElementById('histDateTo').value;
            document.querySelectorAll('.card:last-of-type tbody tr').forEach(row => {
                const rowType = row.dataset.type || '';
                const rowDate = row.dataset.date || '';
                const typeMatch = !type || rowType === type;
                const fromMatch = !from || rowDate >= from;
                const toMatch   = !to   || rowDate <= to;
                row.style.display = (typeMatch && fromMatch && toMatch) ? '' : 'none';
            });
        }

        document.addEventListener('DOMContentLoaded', function() {
            document.querySelectorAll('[data-bs-toggle="tooltip"]').forEach(el => {
                new bootstrap.Tooltip(el);
            });
        });
    </script>
</div>
</body>
</html>
