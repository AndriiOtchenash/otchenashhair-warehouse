<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout/main :: layout(#{product.form.title.new}, ~{::content})}">
<body>
<div th:fragment="content">
    <style>
        .compact-fields .form-control,
        .compact-fields .form-select { text-align: right; }
        .compact-fields textarea.form-control { text-align: left; }
        #saveProductBtn:disabled { background-color: transparent; border-color: #6c757d; color: #6c757d; opacity: 0.65; }
        /* Dim labels and inputs of locked fields */
        .compact-fields > label.col-form-label:has(+ div input:disabled),
        .compact-fields > label.col-form-label:has(+ div select:disabled) {
            opacity: 0.4;
            font-weight: 400 !important;
        }
        .compact-fields select:disabled,
        .compact-fields input:disabled {
            color: #adb5bd !important;
        }
    </style>

    <div class="page-header">
        <h1 class="page-title"
            th:text="${product.id != null} ? #{product.form.title.edit} : #{product.form.title.new}">
            Товар
        </h1>
        <a th:href="${returnTo == 'detail'} ? '/products/' + ${product.id} :
                   (${returnTo == 'income'} ? '/movements/income' :
                   (${returnTo == 'expense'} ? '/movements/expense' :
                   (${returnTo == 'scan'} ? '/scan' : '/products')))"
           class="btn btn-outline-secondary">
            <i class="bi bi-arrow-left me-1"></i>
            <span class="d-none d-sm-inline" th:text="#{btn.back}">Назад</span>
        </a>
    </div>

    <div class="card">
        <div class="card-body">
            <form id="productForm" th:action="${product.id != null} ? @{/products/{id}/edit(id=${product.id})} : @{/products/new}"
                  th:object="${product}"
                  method="post">
                <input th:if="${returnTo != null}" type="hidden" name="returnTo" th:value="${returnTo}"/>
                <input th:if="${mode != null}" type="hidden" name="mode" th:value="${mode}"/>

                <div class="row gy-2 gx-0 align-items-center compact-fields">

                    <!-- Name -->
                    <div class="col-12">
                        <label class="form-label fw-semibold" th:text="#{product.form.name}">Назва</label>
                        <input type="text" class="form-control" id="productName"
                               th:field="*{name}" maxlength="150"
                               th:classappend="${#fields.hasErrors('name')} ? 'is-invalid'"
                               oninput="syncProductFormLock()" autocomplete="off"/>
                        <div class="invalid-feedback" th:errors="*{name}"></div>
                    </div>
                    <div class="col-12 product-form-hint" id="hint-name" style="display:none">
                        <div class="alert alert-warning py-2 small mb-0" th:text="#{product.form.enterNameFirst}"></div>
                    </div>

                    <!-- Brand -->
                    <label class="col-4 col-form-label fw-semibold" th:text="#{product.form.brand}">Бренд</label>
                    <div class="col-6 offset-2">
                        <input type="text" class="form-control form-control-sm" id="brandInput"
                               th:field="*{brand}" maxlength="100"
                               list="brandList" autocomplete="off"/>
                        <datalist id="brandList">
                            <option th:each="b : ${existingBrands}" th:value="${b}"/>
                        </datalist>
                    </div>

                    <!-- Category -->
                    <label class="col-4 col-form-label fw-semibold" th:text="#{product.form.category}">Категорія</label>
                    <div class="col-6 offset-2">
                        <select class="form-select form-select-sm" id="categorySelect"
                                th:field="*{category.id}"
                                th:classappend="${#fields.hasErrors('category')} ? 'is-invalid'"
                                onchange="syncProductFormLock()">
                            <option value="" th:text="#{stock.form.selectCategory}">-- Категорія --</option>
                            <option th:each="cat : ${categories}"
                                    th:value="${cat.id}"
                                    th:text="${cat.name}">
                            </option>
                        </select>
                        <div class="invalid-feedback" th:errors="*{category}"></div>
                    </div>
                    <div th:if="${product.id == null}" class="col-12 text-end pe-1" id="createCategoryRow">
                        <span class="text-muted small" th:text="#{common.or}">або</span>
                        <a th:href="@{/categories/new(returnTo='product')}"
                           class="small fw-semibold text-decoration-none ms-1"
                           style="color:var(--accent)"
                           th:text="#{category.createNew}">Створити нову категорію →</a>
                    </div>
                    <div class="col-12 product-form-hint" id="hint-category" style="display:none">
                        <div class="alert alert-warning py-2 small mb-0" th:text="#{product.form.selectCategoryNext}"></div>
                    </div>

                    <!-- Unit -->
                    <label class="col-4 col-form-label fw-semibold" th:text="#{product.form.unit}">Одиниця</label>
                    <div class="col-6 offset-2">
                        <select class="form-select form-select-sm" id="unitSelect"
                                th:field="*{unit}"
                                th:classappend="${#fields.hasErrors('unit')} ? 'is-invalid'"
                                onchange="syncProductFormLock()">
                            <option value="" th:text="#{stock.form.selectUnit}">-- Одиниця виміру --</option>
                            <option th:each="u : ${units}"
                                    th:value="${u}"
                                    th:text="#{unit.__${u}__}">
                            </option>
                        </select>
                        <div class="invalid-feedback" th:errors="*{unit}"></div>
                    </div>
                    <div class="col-12 product-form-hint" id="hint-unit" style="display:none">
                        <div class="alert alert-warning py-2 small mb-0" th:text="#{product.form.selectUnitNext}"></div>
                    </div>

                    <!-- Barcode -->
                    <label class="col-4 col-form-label fw-semibold" th:text="#{product.form.barcode}">Штрихкод</label>
                    <div class="col-6 offset-2">
                        <input type="text" class="form-control form-control-sm" id="barcodeInput"
                               th:field="*{barcode}" maxlength="50"
                               th:classappend="${#fields.hasErrors('barcode')} ? 'is-invalid'"
                               oninput="this.value=this.value.replace(/[^0-9]/g,'')"/>
                        <div class="invalid-feedback" th:errors="*{barcode}"></div>
                    </div>

                    <!-- Unit Size -->
                    <label class="col-4 col-form-label fw-semibold" th:text="#{product.form.unitSize}">Обсяг</label>
                    <div class="col-6 offset-2">
                        <input type="number" step="0.001" min="0.001" max="99999.999" class="form-control form-control-sm" id="unitSizeInput"
                               th:field="*{unitSize}"
                               th:classappend="${#fields.hasErrors('unitSize')} ? 'is-invalid'"
                               oninput="syncProductFormLock()"/>
                        <div class="invalid-feedback" th:errors="*{unitSize}"></div>
                    </div>
                    <div class="col-12 text-center">
                        <span class="form-text text-muted" th:text="#{product.unitSize.hint}"></span>
                    </div>
                    <div class="col-12 product-form-hint" id="hint-unitSize" style="display:none">
                        <div class="alert alert-warning py-2 small mb-0" th:text="#{product.form.enterUnitSizeNext}"></div>
                    </div>

                    <!-- Recommended Price -->
                    <label class="col-5 col-form-label fw-semibold" th:text="#{product.form.recommendedPrice}">Рекомендована ціна</label>
                    <div class="col-6 offset-1">
                        <input type="number" step="0.01" min="0.01" max="99999.99" class="form-control form-control-sm" id="recommendedPriceInput"
                               th:field="*{recommendedPrice}"
                               th:classappend="${#fields.hasErrors('recommendedPrice')} ? 'is-invalid'"/>
                        <div class="invalid-feedback" th:errors="*{recommendedPrice}"></div>
                    </div>

                    <!-- Min Stock Level -->
                    <label class="col-4 col-form-label fw-semibold" th:text="#{product.form.minStockLevel}">Мін. залишок</label>
                    <div class="col-6 offset-2">
                        <input type="number" step="0.001" min="0" max="99999.999" class="form-control form-control-sm" id="minStockInput"
                               th:field="*{minStockLevel}"
                               th:classappend="${#fields.hasErrors('minStockLevel')} ? 'is-invalid'"
                               oninput="syncProductFormLock()"/>
                        <div class="invalid-feedback" th:errors="*{minStockLevel}"></div>
                    </div>
                    <div class="col-12 product-form-hint" id="hint-minStock" style="display:none">
                        <div class="alert alert-warning py-2 small mb-0" th:text="#{product.form.enterMinStockNext}"></div>
                    </div>

                    <!-- Description -->
                    <label class="col-2 col-form-label fw-semibold" th:text="#{product.form.description}">Опис</label>
                    <div class="col-10">
                        <textarea class="form-control form-control-sm" rows="3" id="descriptionInput"
                                  th:field="*{description}"></textarea>
                    </div>

                    <!-- Buttons -->
                    <div class="col-12 d-flex gap-2 pt-2 justify-content-end">
                        <a th:href="${returnTo == 'detail'} ? '/products/' + ${product.id} :
                                   (${returnTo == 'income'} ? '/movements/income' :
                                   (${returnTo == 'expense'} ? '/movements/expense' :
                                   (${returnTo == 'scan'} ? '/scan' : '/products')))"
                           class="btn btn-outline-secondary btn-sm"
                           th:text="#{btn.cancel}">Скасувати</a>
                        <button type="submit" id="saveProductBtn" class="btn btn-primary btn-sm" disabled>
                            <i class="bi bi-check-lg me-1"></i>
                            <span th:text="#{btn.save}">Зберегти</span>
                        </button>
                    </div>

                </div>
            </form>
        </div>
    </div>
    <script th:inline="javascript">
    function syncProductFormLock() {
        var hasName     = (document.getElementById('productName')?.value     || '').trim().length > 0;
        var hasCat      = (document.getElementById('categorySelect')?.value  || '') !== '';
        var hasUnit     = (document.getElementById('unitSelect')?.value      || '') !== '';
        var hasUnitSize = (document.getElementById('unitSizeInput')?.value   || '') !== '';
        var hasMinStock = (document.getElementById('minStockInput')?.value   || '') !== '';

        // Sequential unlock: each stage requires the previous required field filled
        setDisabled('brandInput',            !hasName);
        setDisabled('categorySelect',        !hasName);
        setDisabled('unitSelect',            !hasName || !hasCat);
        setDisabled('barcodeInput',          !hasName || !hasCat || !hasUnit);
        setDisabled('unitSizeInput',         !hasName || !hasCat || !hasUnit);
        setDisabled('recommendedPriceInput', !hasName || !hasCat || !hasUnit || !hasUnitSize);
        setDisabled('minStockInput',         !hasName || !hasCat || !hasUnit || !hasUnitSize);
        setDisabled('descriptionInput',      !hasName || !hasCat || !hasUnit || !hasUnitSize || !hasMinStock);
        if (!IS_EDIT) setDisabled('saveProductBtn', !hasName || !hasCat || !hasUnit || !hasUnitSize || !hasMinStock);

        // "Create category" link: hide while name not filled
        var createRow = document.getElementById('createCategoryRow');
        if (createRow) createRow.style.display = (hasName && !hasCat) ? '' : 'none';

        // Walking hint: show only the hint for the current blocking field
        var activeHint = !hasName     ? 'hint-name'     :
                         !hasCat      ? 'hint-category'  :
                         !hasUnit     ? 'hint-unit'       :
                         !hasUnitSize ? 'hint-unitSize'   :
                         !hasMinStock ? 'hint-minStock'   : null;
        document.querySelectorAll('.product-form-hint').forEach(function(el) {
            el.style.display = 'none';
        });
        if (activeHint) {
            var el = document.getElementById(activeHint);
            if (el) el.style.display = 'block';
        }
    }

    function setDisabled(id, disabled) {
        var el = document.getElementById(id);
        if (el) el.disabled = disabled;
    }

    const IS_EDIT = /*[[${product.id != null}]]*/ false;
    var initialSnapshot = null;

    function getFormSnapshot() {
        var data = {};
        document.querySelectorAll('#productForm input:not([type=hidden]), #productForm select, #productForm textarea')
            .forEach(function(el) { data[el.name || el.id] = el.type === 'checkbox' ? el.checked : el.value; });
        return JSON.stringify(data);
    }

    function syncSaveBtnEdit() {
        var btn = document.getElementById('saveProductBtn');
        if (!btn || initialSnapshot === null) return;
        btn.disabled = (getFormSnapshot() === initialSnapshot);
    }

    document.addEventListener('DOMContentLoaded', function() {
        syncProductFormLock();
        if (IS_EDIT) {
            initialSnapshot = getFormSnapshot();
            document.getElementById('productForm').addEventListener('input',  syncSaveBtnEdit);
            document.getElementById('productForm').addEventListener('change', syncSaveBtnEdit);
        }
    });
    </script>
</div>
</body>
</html>
