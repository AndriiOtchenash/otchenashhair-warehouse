<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout/main :: layout(#{product.list.title}, ~{::content})}">
<body>
<div th:fragment="content">
    <div class="page-header">
        <h1 class="page-title" th:text="#{product.list.title}">Товари</h1>
        <a th:href="@{/products/new}" class="btn btn-primary">
            <i class="bi bi-plus-lg me-1"></i>
            <span th:text="#{product.list.new}">Додати товар</span>
        </a>
    </div>

    <div class="card">
        <div class="card-body p-0">
            <div th:if="${products.empty}" class="text-center text-muted py-5">
                <i class="bi bi-box-seam fs-1 d-block mb-2"></i>
                <span th:text="#{product.list.empty}">Товари не знайдено</span>
            </div>

            <table th:unless="${products.empty}" class="table table-hover mb-0">
                <thead class="table-light">
                <tr>
                    <th th:text="#{product.form.name}">Назва</th>
                    <th th:text="#{product.form.brand}">Бренд</th>
                    <th th:text="#{product.form.category}">Категорія</th>
                    <th th:text="#{product.form.unit}">Од. виміру</th>
                    <th th:text="#{product.form.minStockLevel}">Мін. залишок</th>
                    <th th:text="#{product.active}">Статус</th>
                    <th th:text="#{table.actions}">Дії</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="product : ${products}">
                    <td>
                        <a th:href="@{/products/{id}(id=${product.id})}"
                           th:text="${product.name}"
                           class="fw-semibold text-decoration-none text-dark">
                        </a>
                    </td>
                    <td th:text="${product.brand}"></td>
                    <td th:text="${product.category != null ? product.category.name : ''}"></td>
                    <td th:text="#{unit.__${product.unit}__}"></td>
                    <td th:text="${product.minStockLevel}"></td>
                    <td>
                        <span th:if="${product.active}"
                              class="badge badge-active px-2 py-1 rounded-pill"
                              th:text="#{product.active}">Активний</span>
                        <span th:unless="${product.active}"
                              class="badge badge-inactive px-2 py-1 rounded-pill"
                              th:text="#{product.inactive}">Неактивний</span>
                    </td>
                    <td>
                        <div class="d-flex gap-1">
                            <a th:href="@{/products/{id}/edit(id=${product.id})}"
                               class="btn btn-sm btn-outline-secondary">
                                <i class="bi bi-pencil"></i>
                            </a>
                            <form th:action="@{/products/{id}/deactivate(id=${product.id})}"
                                  method="post" class="d-inline"
                                  onsubmit="return confirm('Деактивувати товар?')">
                                <button type="submit" class="btn btn-sm btn-outline-danger">
                                    <i class="bi bi-archive"></i>
                                </button>
                            </form>
                        </div>
                    </td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>
</body>
</html>
