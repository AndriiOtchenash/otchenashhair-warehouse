<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout/main :: layout(#{product.list.title}, ~{::content})}">
<body>
<div th:fragment="content">
    <style>
        .table td a.fw-semibold,
        .table td.td-category {
            font-size: 0.90rem;
        }
        .product-table {
            table-layout: fixed;
            min-width: 0 !important;
            width: 100%;
        }
        .product-table .col-name  { width: auto; }
        .product-table .col-cat   { width: 30%; }
        .product-table .col-status { width: 7rem; }
        .product-table .col-actions { width: 5.5rem; }
        @media (max-width: 767.98px) {
            .product-table th { font-size: 0.72rem; text-align: center; }
            .product-table .col-cat { width: 5.7rem; }
            .product-table .col-actions { width: 5.3rem; }
            /* Category: fixed narrow, truncate with ellipsis */
            .product-table td.td-category,
            .product-table th.th-category {
                overflow: hidden;
                text-overflow: ellipsis;
                white-space: nowrap;
            }
            /* Actions: no wrap */
            .product-table td:last-child {
                white-space: nowrap;
            }
            /* Disable scroll — fixed-layout table fits without it */
            .table-responsive-wrapper,
            .card-body { overflow-x: visible; }
        }
    </style>
    <div class="page-header">
        <h1 class="page-title" th:text="#{product.list.title}">Товари</h1>
        <div class="d-flex gap-2 flex-wrap">
            <a th:href="@{/products(showInactive=${!showInactive})}"
               class="btn btn-outline-secondary btn-sm">
                <i class="bi bi-eye me-1" th:if="${!showInactive}"></i>
                <i class="bi bi-eye-slash me-1" th:unless="${!showInactive}"></i>
                <span th:text="${showInactive} ? #{product.hideInactive} : #{product.showInactive}"></span>
            </a>
            <a th:href="@{/products/new}" class="btn btn-primary">
                <i class="bi bi-plus-lg"></i>
                <span class="d-none d-md-inline ms-1" th:text="#{product.list.new}">Додати товар</span>
            </a>
        </div>
    </div>

    <div class="mb-3">
        <div class="input-group input-group-sm" style="max-width:300px;">
            <span class="input-group-text"><i class="bi bi-search"></i></span>
            <input type="text" class="form-control"
                   th:placeholder="#{common.search}"
                   oninput="filterSearch(this.value); toggleClearBtn(this)"/>
            <button type="button" class="btn btn-outline-secondary d-md-none"
                    onclick="clearSearch()" tabindex="-1" style="display:none">
                <i class="bi bi-x-lg"></i>
            </button>
        </div>
    </div>

    <div class="card">
        <div class="card-body p-0">
            <div th:if="${products.empty}" class="text-center text-muted py-5">
                <i class="bi bi-box-seam fs-1 d-block mb-2"></i>
                <span th:text="#{product.list.empty}">Товари не знайдено</span>
            </div>

            <div class="table-responsive-wrapper">
            <table th:unless="${products.empty}" class="table table-hover mb-0 product-table">
                <colgroup>
                    <col class="col-name"/>
                    <col class="col-status d-none d-md-table-cell"/>
                    <col class="col-cat"/>
                    <col class="d-none d-md-table-cell"/>
                    <col class="d-none d-md-table-cell"/>
                    <col class="d-none d-md-table-cell"/>
                    <col class="col-actions"/>
                </colgroup>
                <thead class="table-light">
                <tr>
                    <th th:text="#{product.form.name}">Назва</th>
                    <th class="d-none d-md-table-cell" th:text="#{product.active}">Статус</th>
                    <th class="th-category" th:text="#{product.form.category}">Категорія</th>
                    <th class="d-none d-md-table-cell" th:text="#{product.form.brand}">Бренд</th>
                    <th class="d-none d-md-table-cell" th:text="#{product.form.unit}">Од. виміру</th>
                    <th class="d-none d-md-table-cell" th:text="#{product.form.minStockLevel}">Мін. залишок</th>
                    <th th:text="#{table.actions}">Дії</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="product : ${products}"
                    th:classappend="${!product.active} ? 'table-secondary' : ''"
                    th:attr="data-name=${product.name},data-brand=${product.brand ?: ''},data-category=${product.category != null ? product.category.name : ''}"
                    th:onclick="|window.location='@{/products/{id}(id=${product.id},showInactive=${showInactive})}'|"
                    style="cursor:pointer">
                    <td>
                        <a th:href="@{/products/{id}(id=${product.id},showInactive=${showInactive})}"
                           th:text="${product.name}"
                           th:class="${!product.active} ? 'fw-semibold text-decoration-none text-muted text-decoration-line-through' : 'fw-semibold text-decoration-none text-dark'">
                        </a>
                    </td>
                    <td class="d-none d-md-table-cell">
                        <span th:if="${product.active}"
                              class="badge badge-active px-2 py-1 rounded-pill"
                              th:text="#{product.active}">Активний</span>
                        <span th:unless="${product.active}"
                              class="badge badge-inactive px-2 py-1 rounded-pill"
                              th:text="#{product.inactive}">Неактивний</span>
                    </td>
                    <td class="td-category" th:text="${product.category != null ? product.category.name : ''}"></td>
                    <td class="d-none d-md-table-cell" th:text="${product.brand}"></td>
                    <td class="d-none d-md-table-cell" th:text="#{unit.__${product.unit}__}"></td>
                    <td class="d-none d-md-table-cell" th:text="${@qf.format(product.minStockLevel, product.unit != null ? product.unit.name() : 'PCS')}"></td>
                    <td onclick="event.stopPropagation()">
                        <div class="d-flex gap-1">
                            <th:block th:if="${product.active}">
                                <a th:href="@{/products/{id}/edit(id=${product.id})}"
                                   class="btn btn-sm btn-outline-secondary"
                                   th:title="#{btn.edit}"
                                   data-bs-toggle="tooltip">
                                    <i class="bi bi-pencil"></i>
                                </a>
                                <button type="button"
                                        class="btn btn-sm btn-outline-danger"
                                        th:title="#{btn.deactivate}"
                                        th:data-id="${product.id}"
                                        th:data-name="${product.name}"
                                        onclick="openDeactivateModal(this)">
                                    <i class="bi bi-archive"></i>
                                </button>
                            </th:block>
                            <th:block th:unless="${product.active}">
                                <form th:action="@{/products/{id}/restore(id=${product.id})}"
                                      method="post" class="d-inline"
                                      th:attr="data-confirm=#{confirm.restore.product}"
                                      onsubmit="return confirm(this.dataset.confirm)">
                                    <button type="submit" class="btn btn-sm btn-outline-success"
                                            th:title="#{btn.restore}"
                                            data-bs-toggle="tooltip">
                                        <i class="bi bi-arrow-counterclockwise"></i>
                                    </button>
                                </form>
                            </th:block>
                        </div>
                    </td>
                </tr>
                </tbody>
            </table>
            </div>
        </div>
    </div>
    <script>
        function filterSearch(value) {
            const q = value.toLowerCase();
            document.querySelectorAll('tbody tr').forEach(row => {
                const name = (row.dataset.name || '').toLowerCase();
                const brand = (row.dataset.brand || '').toLowerCase();
                const category = (row.dataset.category || '').toLowerCase();
                row.style.display = (!q || name.includes(q) || brand.includes(q) || category.includes(q)) ? '' : 'none';
            });
        }

        function toggleClearBtn(input) {
            var btn = input.nextElementSibling;
            if (btn) btn.style.display = input.value ? '' : 'none';
        }

        function clearSearch() {
            var input = document.querySelector('.input-group input[type="text"]');
            if (input) { input.value = ''; filterSearch(''); toggleClearBtn(input); }
        }

        function openDeactivateModal(btn) {
            document.getElementById('deactivateProductForm').action =
                '/products/' + btn.dataset.id + '/deactivate';
            document.getElementById('deactivateProductName').textContent = btn.dataset.name;
            document.getElementById('deactivateReasonInput').value = '';
            new bootstrap.Modal(document.getElementById('deactivateProductModal')).show();
        }

        document.addEventListener('DOMContentLoaded', function() {
            document.querySelectorAll('[data-bs-toggle="tooltip"]').forEach(el => {
                new bootstrap.Tooltip(el);
            });
        });
    </script>

    <!-- Deactivate product modal -->
    <div class="modal fade" id="deactivateProductModal" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" th:text="#{product.deactivate.modal.title}">Деактивація товару</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <form id="deactivateProductForm" method="post">
                    <input type="hidden" name="_csrf" th:value="${_csrf.token}" th:if="${_csrf != null}"/>
                    <div class="modal-body">
                        <p class="mb-3">
                            <span th:text="#{product.deactivate.modal.confirm}">Деактивувати</span>
                            «<span id="deactivateProductName"></span>»?
                        </p>
                        <div>
                            <label for="deactivateReasonInput" class="form-label fw-semibold small"
                                   th:text="#{product.deactivate.reason.label}">Причина</label>
                            <textarea class="form-control form-control-sm"
                                      name="deactivationReason"
                                      id="deactivateReasonInput"
                                      rows="2"
                                      th:placeholder="#{product.deactivate.reason.placeholder}"></textarea>
                        </div>
                    </div>
                    <div class="modal-footer">
                        <button type="button" class="btn btn-outline-secondary btn-sm"
                                data-bs-dismiss="modal" th:text="#{btn.no}">Ні</button>
                        <button type="submit" class="btn btn-danger btn-sm"
                                th:text="#{btn.yes}">Так</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
</body>
</html>
