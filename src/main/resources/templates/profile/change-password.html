<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout/main :: layout('Зміна пароля', ~{::content})}">
<body>
<div th:fragment="content">
    <div class="page-header">
        <h1 class="page-title" th:text="#{profile.changePassword.title}">Зміна пароля</h1>
        <a th:href="@{/}" class="btn btn-outline-secondary btn-sm">
            <i class="bi bi-arrow-left me-1"></i><span th:text="#{btn.back}">Назад</span>
        </a>
    </div>

    <div class="row">
        <div class="col-md-4">
            <div class="card">
                <div class="card-body">
                    <div th:if="${error}" class="alert alert-danger py-2 small"
                         th:text="#{profile.changePassword.error}"></div>

                    <form th:action="@{/profile/change-password}"
                          th:object="${dto}" method="post">
                        <div class="mb-3">
                            <label class="form-label fw-semibold" th:text="#{profile.changePassword.current}">Поточний пароль</label>
                            <div class="input-group">
                                <input type="password" class="form-control"
                                       th:field="*{currentPassword}" id="currentPassword"
                                       th:classappend="${#fields.hasErrors('currentPassword')} ? 'is-invalid'"/>
                                <button class="btn btn-outline-secondary" type="button"
                                        onclick="togglePassword('currentPassword', this)">
                                    <i class="bi bi-eye"></i>
                                </button>
                                <div class="invalid-feedback" th:errors="*{currentPassword}"></div>
                            </div>
                        </div>
                        <div class="mb-3">
                            <label class="form-label fw-semibold" th:text="#{profile.changePassword.new}">Новий пароль</label>
                            <div class="input-group">
                                <input type="password" class="form-control"
                                       th:field="*{newPassword}" id="newPassword"
                                       th:classappend="${#fields.hasErrors('newPassword')} ? 'is-invalid'"/>
                                <button class="btn btn-outline-secondary" type="button"
                                        onclick="togglePassword('newPassword', this)">
                                    <i class="bi bi-eye"></i>
                                </button>
                                <div class="invalid-feedback" th:errors="*{newPassword}"></div>
                            </div>
                        </div>
                        <div class="mb-4">
                            <label class="form-label fw-semibold" th:text="#{profile.changePassword.confirm}">Підтвердження пароля</label>
                            <div class="input-group">
                                <input type="password" class="form-control"
                                       th:field="*{confirmPassword}" id="confirmPassword"
                                       th:classappend="${#fields.hasErrors('confirmPassword')} ? 'is-invalid'"/>
                                <button class="btn btn-outline-secondary" type="button"
                                        onclick="togglePassword('confirmPassword', this)">
                                    <i class="bi bi-eye"></i>
                                </button>
                                <div class="invalid-feedback" th:errors="*{confirmPassword}"></div>
                            </div>
                        </div>
                        <button type="submit" class="btn btn-primary w-100">
                            <i class="bi bi-key me-1"></i><span th:text="#{profile.changePassword.submit}">Змінити пароль</span>
                        </button>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <script>
    function togglePassword(fieldId, btn) {
        const input = document.getElementById(fieldId);
        const icon = btn.querySelector('i');
        if (input.type === 'password') {
            input.type = 'text';
            icon.className = 'bi bi-eye-slash';
        } else {
            input.type = 'password';
            icon.className = 'bi bi-eye';
        }
    }
    </script>
</div>
</body>
</html>
