<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout/main :: layout(#{stock.expense.title}, ~{::content})}">
<body>
<div th:fragment="content">
    <div class="page-header">
        <h1 class="page-title" th:text="#{stock.expense.title}">Витрата товару</h1>
    </div>

    <div th:if="${successMessage}" class="alert alert-success alert-dismissible fade show mb-3">
        <span th:text="${successMessage}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
    </div>
    <div th:if="${errorMessage}" class="alert alert-danger alert-dismissible fade show mb-3">
        <span th:text="${errorMessage}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
    </div>

    <div class="card">
        <div class="card-body">
            <form th:action="@{/movements/expense}" th:object="${dto}" method="post" data-autosave-key="expense_form">
                <div class="row g-3">
                    <div class="col-md-6">
                        <label class="form-label fw-semibold" th:text="#{stock.form.product}">Товар</label>
                        <select class="form-select" th:field="*{productId}"
                                th:classappend="${#fields.hasErrors('productId')} ? 'is-invalid'"
                                th:disabled="${dto.productId != null}"
                                id="productSelect"
                                onchange="updateStockHint(this)">
                            <option value="" th:text="#{stock.form.selectProduct}">-- Оберіть товар --</option>
                            <option th:each="p : ${products}"
                                    th:value="${p.id}"
                                    th:text="${p.name}"
                                    th:attr="data-qty=${@qf.format(p.currentQuantity, p.unit.name())},data-unit=${p.unit},data-raw-qty=${p.currentQuantity}">
                            </option>
                        </select>
                        <input th:if="${dto.productId != null}" type="hidden" name="productId" th:value="${dto.productId}"/>
                        <div id="stockHint" class="form-text text-muted mt-1"></div>
                        <div class="invalid-feedback" th:errors="*{productId}"></div>
                        <div th:if="${dto.productId == null}">
                            <div class="text-center text-muted small my-2" th:text="#{common.or}">або</div>
                            <div class="input-group input-group-sm">
                                <span class="input-group-text"><i class="bi bi-upc-scan"></i></span>
                                <input type="text" id="barcodeInput" class="form-control"
                                       th:placeholder="#{scan.barcode.placeholder}"
                                       autocomplete="off"/>
                            </div>
                            <div id="barcodeError" class="form-text mt-1" style="display:none"></div>
                        </div>
                    </div>

                    <div class="col-md-3">
                        <label class="form-label fw-semibold" th:text="#{stock.form.movementType}">Тип операції</label>
                        <select class="form-select" th:field="*{movementType}"
                                th:classappend="${#fields.hasErrors('movementType')} ? 'is-invalid'">
                            <option value="" th:text="#{stock.form.selectType}">-- Тип --</option>
                            <option th:each="t : ${expenseTypes}"
                                    th:value="${t}"
                                    th:text="#{movementType.__${t}__}">
                            </option>
                        </select>
                        <div class="invalid-feedback" th:errors="*{movementType}"></div>
                    </div>

                    <div class="col-md-3">
                        <label class="form-label fw-semibold" th:text="#{stock.form.quantity}">Кількість</label>
                        <input type="number" step="1" class="form-control"
                               id="quantity"
                               th:field="*{quantity}"
                               th:classappend="${#fields.hasErrors('quantity')} ? 'is-invalid'"
                               oninput="if(this.max && parseFloat(this.value) > parseFloat(this.max)) this.value = this.max"
                               onblur="if(this.max && parseFloat(this.value) > parseFloat(this.max)) this.value = this.max"/>
                        <div class="invalid-feedback" th:errors="*{quantity}"></div>
                    </div>

                    <div class="col-md-6" id="saleFields">
                        <label class="form-label fw-semibold" th:text="#{stock.form.client}">Клієнт</label>
                        <select class="form-select" th:field="*{clientId}">
                            <option value="" th:text="#{stock.form.selectClient}">-- Оберіть клієнта --</option>
                            <option th:each="c : ${clients}"
                                    th:value="${c.id}"
                                    th:text="${c.name}">
                            </option>
                        </select>
                        <div class="mt-1">
                            <span class="text-muted small" th:text="#{common.or}">або</span>
                            <a th:href="@{/clients/new(returnTo='expense')}"
                               class="small fw-semibold text-decoration-none ms-1"
                               style="color:var(--accent)"
                               th:text="#{client.createNew}">Створити нового клієнта →</a>
                        </div>
                    </div>

                    <div class="col-md-3">
                        <label class="form-label fw-semibold" th:text="#{stock.form.salePrice}">Ціна продажу</label>
                        <input type="number" step="0.01" class="form-control" th:field="*{unitPrice}"/>
                    </div>

                    <div class="col-12">
                        <label class="form-label fw-semibold" th:text="#{stock.form.notes}">Примітки</label>
                        <textarea class="form-control" rows="2" th:field="*{notes}"></textarea>
                    </div>

                    <div class="col-12 d-flex flex-column flex-sm-row-reverse gap-2 justify-content-end">
                        <button type="submit" class="btn btn-primary">
                            <i class="bi bi-arrow-up-circle me-1"></i>
                            <span th:text="#{stock.expense.submit}">Зареєструвати витрату</span>
                        </button>
                        <a th:href="@{/}" class="btn btn-outline-secondary" th:text="#{btn.cancel}">Скасувати</a>
                    </div>
                </div>
            </form>
        </div>
    </div>
    <style>
        .card-body { overflow-x: visible !important; }
    </style>
    <script th:inline="javascript">
        const inStockLabel = /*[[#{stock.hint.available}]]*/ 'В наявності';
        const unitLabels = {
            'ML': /*[[#{unit.ML}]]*/ 'мл',
            'G': /*[[#{unit.G}]]*/ 'гр',
            'PCS': /*[[#{unit.PCS}]]*/ 'шт'
        };

        function updateStockHint(select) {
            const option = select.options[select.selectedIndex];
            const hint = document.getElementById('stockHint');
            const quantityInput = document.getElementById('quantity');
            if (option && option.dataset.qty) {
                const qty = option.dataset.qty;
                const unit = option.dataset.unit;
                hint.textContent = inStockLabel + ': ' + qty + ' ' + (unitLabels[unit] || unit);
                hint.className = 'form-text text-success mt-1';
                if (quantityInput) {
                    if (option.dataset.rawQty) quantityInput.max = option.dataset.rawQty;
                    quantityInput.step = unit === 'PCS' ? '1' : '0.001';
                    if (unit === 'PCS' && quantityInput.value) {
                        quantityInput.value = Math.floor(parseFloat(quantityInput.value));
                    }
                }
            } else {
                hint.textContent = '';
                if (quantityInput) {
                    quantityInput.removeAttribute('max');
                    quantityInput.step = '1';
                }
            }
        }

        const saleNoClientMsg = /*[[#{stock.expense.confirm.noClient}]]*/ 'Продаж без клієнта. Продовжити?';

        document.addEventListener('DOMContentLoaded', function() {
            const select = document.getElementById('productSelect');
            if (select && select.value) updateStockHint(select);

            const form = document.querySelector('form[data-autosave-key="expense_form"]');
            if (form) {
                form.addEventListener('submit', function(e) {
                    const type = document.querySelector('[name="movementType"]');
                    const client = document.querySelector('[name="clientId"]');
                    if (type && type.value === 'SALE' && client && !client.value) {
                        if (!confirm(saleNoClientMsg)) {
                            e.preventDefault();
                        }
                    }
                });
            }
        });

        (function () {
            var barcodeInput = document.getElementById('barcodeInput');
            var barcodeError = document.getElementById('barcodeError');
            var productSelect = document.getElementById('productSelect');
            var notFoundMsg = /*[[#{scan.notFound.title}]]*/ 'Штрихкод не знайдено';
            var createNewMsg = /*[[#{scan.notFound.createNew}]]*/ 'Створити новий товар';

            if (!barcodeInput || !productSelect) return;

            var barcodeTimer;
            barcodeInput.addEventListener('input', function () {
                clearTimeout(barcodeTimer);
                var code = this.value.trim();
                if (code.length < 8) {
                    barcodeError.style.display = 'none';
                    return;
                }
                barcodeTimer = setTimeout(function () { lookupBarcode(code); }, 600);
            });

            function showBarcodeNotFound(code) {
                barcodeError.innerHTML = '';
                var span = document.createElement('span');
                span.className = 'text-danger';
                span.textContent = notFoundMsg + ' ';
                var a = document.createElement('a');
                a.href = '/products/new?barcode=' + encodeURIComponent(code) + '&returnTo=expense';
                a.textContent = createNewMsg + ' \u2192';
                a.className = 'fw-semibold text-decoration-none';
                a.style.color = 'var(--accent)';
                barcodeError.appendChild(span);
                barcodeError.appendChild(a);
                barcodeError.style.display = '';
            }

            function lookupBarcode(code) {
                fetch('/products/by-barcode?code=' + encodeURIComponent(code))
                    .then(function (r) {
                        if (r.ok) {
                            return r.json().then(function (p) {
                                productSelect.value = p.id;
                                barcodeError.style.display = 'none';
                                productSelect.classList.add('is-valid');
                                setTimeout(function () { productSelect.classList.remove('is-valid'); }, 1500);
                                updateStockHint(productSelect);
                            });
                        } else {
                            showBarcodeNotFound(code);
                        }
                    })
                    .catch(function () {
                        showBarcodeNotFound(code);
                    });
            }
        })();
    </script>
</div>
</body>
</html>
