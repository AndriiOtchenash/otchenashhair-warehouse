<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout/main :: layout(#{stock.expense.title}, ~{::content})}">
<body>
<div th:fragment="content">
    <style>
        .card-body { overflow-x: visible !important; }
        .compact-fields .form-control { text-align: right; }
        .field-locked { cursor: not-allowed; }
        .filter-select-wrap > .ts-wrapper { flex: 1; min-width: 0; }
        .filter-select-wrap .ts-wrapper.has-items .ts-control > input { width: 0 !important; min-width: 0 !important; }
        a#scannerLink { color: var(--accent); background: var(--accent-light); border-color: #ced4da; transition: background 0.15s, color 0.15s; }
        a#scannerLink:hover { background: var(--accent); color: #fff; }
    </style>
    <div class="page-header">
        <h1 class="page-title" th:text="#{stock.expense.title}">Витрата товару</h1>
        <a th:if="${returnTo != null}" th:href="${returnTo}" class="btn btn-outline-secondary">
            <i class="bi bi-arrow-left me-1"></i>
            <span class="d-none d-sm-inline" th:text="#{btn.back}">Назад</span>
        </a>
    </div>

    <div th:if="${successMessage}" class="alert alert-success alert-dismissible fade show mb-3">
        <span th:text="${successMessage}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
    </div>
    <div th:if="${errorMessage}" class="alert alert-danger alert-dismissible fade show mb-3">
        <span th:text="${errorMessage}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
    </div>

    <div class="card">
        <div class="card-body">
            <form th:action="@{/movements/expense}" th:object="${dto}" method="post">
                <input th:if="${returnTo != null}" type="hidden" name="returnTo" th:value="${returnTo}"/>

                <!-- ======== COMPACT LOCKED LAYOUT (from client page) ======== -->
                <th:block th:if="${clientLocked}">
                    <input type="hidden" name="clientId" th:value="${dto.clientId}"/>
                    <input type="hidden" name="movementType" value="SALE"/>
                    <div class="row g-3">
                        <!-- Product (full width, unchanged) -->
                        <div class="col-12">
                            <label class="form-label fw-semibold" th:text="#{stock.form.product}">Товар</label>
                            <div class="filter-select-wrap">
                                <select class="form-select ts-client" th:field="*{productId}"
                                        th:classappend="${#fields.hasErrors('productId')} ? 'is-invalid'"
                                        th:disabled="${dto.productId != null}"
                                        id="productSelect"
                                        onchange="updateStockHint(this)">
                                    <option value="" th:text="#{stock.form.selectProduct}">-- Оберіть товар --</option>
                                    <option th:each="p : ${products}"
                                            th:value="${p.id}"
                                            th:text="${p.name}"
                                            th:attr="data-qty=${@qf.format(p.currentQuantity, p.unit.name())},data-unit=${p.unit},data-raw-qty=${p.currentQuantity},data-fifo-price=${fifoPrices != null and fifoPrices[p.id] != null ? fifoPrices[p.id] : ''}">
                                    </option>
                                </select>
                                <button th:if="${dto.productId == null}" type="button" id="clearProductBtn"
                                        class="btn btn-outline-secondary btn-sm d-md-none px-1"
                                        onclick="clearProduct()" tabindex="-1" style="display:none">
                                    <i class="bi bi-x-lg" style="font-size:0.89rem"></i>
                                </button>
                            </div>
                            <input th:if="${dto.productId != null}" id="productIdHidden" type="hidden" name="productId" th:value="${dto.productId}"/>
                            <div id="stockHint" class="form-text text-muted mt-1"></div>
                            <div class="invalid-feedback" th:errors="*{productId}"></div>
                            <div id="barcodeBlock" th:if="${dto.productId == null}">
                                <div class="d-flex align-items-center gap-2 mt-2">
                                    <span class="text-muted small flex-shrink-0" th:text="#{common.or}">або</span>
                                    <div class="input-group input-group-sm flex-grow-1">
                                        <a id="scannerLink" href="/scan?mode=expense"
                                           class="input-group-text" th:title="#{scan.title}">
                                            <i class="bi bi-upc-scan"></i>
                                        </a>
                                        <input type="text" id="barcodeInput" class="form-control"
                                               th:placeholder="#{scan.barcode.placeholder}"
                                               inputmode="numeric"
                                               oninput="this.value=this.value.replace(/\D/g,'')"
                                               autocomplete="off"/>
                                        <button type="button" id="clearBarcodeBtn"
                                                class="btn btn-outline-secondary d-md-none px-1"
                                                onclick="document.getElementById('barcodeInput').value=''; document.getElementById('clearBarcodeBtn').style.display='none'; document.getElementById('barcodeError').style.display='none';"
                                                tabindex="-1" style="display:none">
                                            <i class="bi bi-x-lg" style="font-size:0.89rem"></i>
                                        </button>
                                    </div>
                                </div>
                                <div id="barcodeError" class="form-text mt-1" style="display:none"></div>
                            </div>
                        </div>

                        <!-- Compact label | input pairs -->
                        <div class="col-12">
                            <div class="row gy-2 gx-0 align-items-center compact-fields">

                                <!-- Quantity -->
                                <label class="col-4 col-form-label fw-semibold" th:text="#{stock.form.quantity}">Кількість</label>
                                <div class="col-8" id="qtyWrapper">
                                    <div class="input-group">
                                        <input type="number" step="1" class="form-control"
                                               id="quantity"
                                               th:field="*{quantity}"
                                               th:classappend="${#fields.hasErrors('quantity')} ? 'is-invalid'"
                                               oninput="if(this.max && parseFloat(this.value) > parseFloat(this.max)) this.value = this.max"
                                               onblur="if(this.max && parseFloat(this.value) > parseFloat(this.max)) this.value = this.max"/>
                                        <button type="button" id="clearQtyBtn"
                                                class="btn btn-outline-secondary d-md-none px-1"
                                                onclick="document.getElementById('quantity').value=''; updateTotal(); syncClearBtns();"
                                                tabindex="-1" style="display:none">
                                            <i class="bi bi-x-lg" style="font-size:0.89rem"></i>
                                        </button>
                                    </div>
                                    <div class="invalid-feedback" th:errors="*{quantity}"></div>
                                </div>

                                <!-- Price -->
                                <label class="col-4 col-form-label fw-semibold" th:text="#{stock.form.salePrice}">Ціна продажу</label>
                                <div class="col-8" id="priceField">
                                    <div class="input-group">
                                        <input type="number" step="0.01" min="0.01" max="99999.99" id="unitPriceInput"
                                               class="form-control"
                                               th:field="*{unitPrice}"
                                               th:classappend="${#fields.hasErrors('unitPrice')} ? 'is-invalid'"/>
                                        <span class="input-group-text">zł</span>
                                        <button type="button" id="clearPriceBtn"
                                                class="btn btn-outline-secondary d-md-none px-1"
                                                onclick="document.getElementById('unitPriceInput').value=''; checkPriceWarning(); updateTotal(); syncClearBtns();"
                                                tabindex="-1" style="display:none">
                                            <i class="bi bi-x-lg" style="font-size:0.89rem"></i>
                                        </button>
                                    </div>
                                    <div class="invalid-feedback" th:errors="*{unitPrice}"></div>
                                </div>
                                <div class="col-12" id="priceWarning" style="display:none">
                                    <div class="alert alert-warning py-1 px-2 mb-0 small text-center">
                                        <i class="bi bi-exclamation-triangle-fill me-1"></i><span id="priceWarningText"></span>
                                    </div>
                                </div>

                                <!-- Client (locked) -->
                                <label class="col-4 col-form-label fw-semibold" th:text="#{stock.form.client}">Клієнт</label>
                                <div class="col-8" id="saleFields">
                                    <div class="form-control text-center" style="background:#e9ecef; color:#6c757d; cursor:default;"
                                         th:text="${lockedClientName}"></div>
                                </div>

                                <!-- Date -->
                                <label class="col-4 col-form-label fw-semibold" th:text="#{stock.form.saleDate}">Дата</label>
                                <div class="col-8">
                                    <input type="date" class="form-control text-center"
                                           th:field="*{saleDate}"
                                           th:max="${#temporals.format(#temporals.createToday(), 'yyyy-MM-dd')}"
                                           th:classappend="${#fields.hasErrors('saleDate')} ? 'is-invalid'"
                                           onclick="this.showPicker&&this.showPicker()"/>
                                    <div class="invalid-feedback" th:errors="*{saleDate}"></div>
                                </div>

                            </div>
                        </div>

                        <!-- Price below cost warning (full width, outside compact row) -->
                        <div class="col-12">
                            <div id="priceWarning" class="alert alert-warning py-1 px-2 mb-0 small" style="display:none">
                                <i class="bi bi-exclamation-triangle-fill me-1"></i><span id="priceWarningText"></span>
                            </div>
                        </div>

                        <!-- Total -->
                        <div class="col-12" id="saleTotalBox" style="display:none">
                            <div class="d-flex justify-content-between align-items-center px-3 py-2 rounded fw-semibold"
                                 style="background:var(--accent-light)">
                                <span class="text-muted small" th:text="#{stock.form.total}">До сплати</span>
                                <span class="fs-5" id="saleTotalAmount" style="color:var(--accent)"></span>
                            </div>
                        </div>

                        <!-- Notes -->
                        <div class="col-12">
                            <label class="form-label fw-semibold" th:text="#{stock.form.notes}">Примітки</label>
                            <textarea class="form-control" rows="2" th:field="*{notes}"></textarea>
                        </div>

                        <!-- Buttons -->
                        <div class="col-12 d-flex flex-column flex-sm-row-reverse gap-2 justify-content-end">
                            <button type="submit" class="btn btn-primary">
                                <i class="bi bi-arrow-up-circle me-1"></i>
                                <span th:text="#{stock.expense.submit}">Зареєструвати витрату</span>
                            </button>
                            <a th:href="${returnTo != null ? returnTo : '/'}" class="btn btn-outline-secondary" th:text="#{btn.cancel}">Скасувати</a>
                        </div>
                    </div>
                </th:block>

                <!-- ======== STANDARD UNLOCKED LAYOUT ======== -->
                <th:block th:unless="${clientLocked}">
                    <div class="row g-3">

                        <!-- Product (full width) -->
                        <div class="col-12">
                            <label class="form-label fw-semibold" th:text="#{stock.form.product}">Товар</label>
                            <div class="filter-select-wrap">
                                <select class="form-select ts-client" th:field="*{productId}"
                                        th:classappend="${#fields.hasErrors('productId')} ? 'is-invalid'"
                                        th:disabled="${dto.productId != null}"
                                        id="productSelect"
                                        onchange="updateStockHint(this)">
                                    <option value="" th:text="#{stock.form.selectProduct}">-- Оберіть товар --</option>
                                    <option th:each="p : ${products}"
                                            th:value="${p.id}"
                                            th:text="${p.name}"
                                            th:attr="data-qty=${@qf.format(p.currentQuantity, p.unit.name())},data-unit=${p.unit},data-raw-qty=${p.currentQuantity},data-fifo-price=${fifoPrices != null and fifoPrices[p.id] != null ? fifoPrices[p.id] : ''}">
                                    </option>
                                </select>
                                <button th:if="${dto.productId == null}" type="button" id="clearProductBtn"
                                        class="btn btn-outline-secondary btn-sm d-md-none px-1"
                                        onclick="clearProduct()" tabindex="-1" style="display:none">
                                    <i class="bi bi-x-lg" style="font-size:0.89rem"></i>
                                </button>
                            </div>
                            <input th:if="${dto.productId != null}" id="productIdHidden" type="hidden" name="productId" th:value="${dto.productId}"/>
                            <div id="stockHint" class="form-text text-muted mt-1"></div>
                            <div class="invalid-feedback" th:errors="*{productId}"></div>
                            <div id="barcodeBlock" th:if="${dto.productId == null}">
                                <div class="d-flex align-items-center gap-2 mt-2">
                                    <span class="text-muted small flex-shrink-0" th:text="#{common.or}">або</span>
                                    <div class="input-group input-group-sm flex-grow-1">
                                        <a id="scannerLink" href="/scan?mode=expense"
                                           class="input-group-text" th:title="#{scan.title}">
                                            <i class="bi bi-upc-scan"></i>
                                        </a>
                                        <input type="text" id="barcodeInput" class="form-control"
                                               th:placeholder="#{scan.barcode.placeholder}"
                                               inputmode="numeric"
                                               oninput="this.value=this.value.replace(/\D/g,'')"
                                               autocomplete="off"/>
                                        <button type="button" id="clearBarcodeBtn"
                                                class="btn btn-outline-secondary d-md-none px-1"
                                                onclick="document.getElementById('barcodeInput').value=''; document.getElementById('clearBarcodeBtn').style.display='none'; document.getElementById('barcodeError').style.display='none';"
                                                tabindex="-1" style="display:none">
                                            <i class="bi bi-x-lg" style="font-size:0.89rem"></i>
                                        </button>
                                    </div>
                                </div>
                                <div id="barcodeError" class="form-text mt-1" style="display:none"></div>
                            </div>
                        </div>

                        <!-- Compact label | input pairs -->
                        <div class="col-12">
                            <div class="row gy-2 gx-0 align-items-center compact-fields">

                                <!-- Movement type -->
                                <label class="col-4 col-form-label fw-semibold" th:text="#{stock.form.movementType}">Тип операції</label>
                                <div class="col-8">
                                    <select class="form-select" th:field="*{movementType}"
                                            th:classappend="${#fields.hasErrors('movementType')} ? 'is-invalid'">
                                        <option value="" th:text="#{stock.form.selectType}">-- Тип --</option>
                                        <option th:each="t : ${expenseTypes}"
                                                th:value="${t}"
                                                th:text="#{movementType.__${t}__}">
                                        </option>
                                    </select>
                                    <div class="invalid-feedback" th:errors="*{movementType}"></div>
                                </div>

                                <!-- Write-off reason (hidden until WRITE_OFF selected) -->
                                <label class="col-4 col-form-label fw-semibold" id="writeOffReasonLabel"
                                       style="display:none" th:text="#{stock.form.writeOffReason}">Причина списання</label>
                                <div class="col-8" id="writeOffReasonField" style="display:none">
                                    <select class="form-select" id="writeOffReasonSelect" th:field="*{writeOffReason}">
                                        <option value="" th:text="#{stock.form.selectReason}">-- Причина --</option>
                                        <option th:each="r : ${writeOffReasons}"
                                                th:value="${r}"
                                                th:text="#{writeOffReason.__${r}__}">
                                        </option>
                                    </select>
                                </div>

                                <!-- Quantity -->
                                <label class="col-4 col-form-label fw-semibold" th:text="#{stock.form.quantity}">Кількість</label>
                                <div class="col-8" id="qtyWrapper">
                                    <div class="input-group">
                                        <input type="number" step="1" class="form-control"
                                               id="quantity"
                                               th:field="*{quantity}"
                                               th:classappend="${#fields.hasErrors('quantity')} ? 'is-invalid'"
                                               oninput="if(this.max && parseFloat(this.value) > parseFloat(this.max)) this.value = this.max"
                                               onblur="if(this.max && parseFloat(this.value) > parseFloat(this.max)) this.value = this.max"/>
                                        <button type="button" id="clearQtyBtn"
                                                class="btn btn-outline-secondary d-md-none px-1"
                                                onclick="document.getElementById('quantity').value=''; updateTotal(); syncClearBtns();"
                                                tabindex="-1" style="display:none">
                                            <i class="bi bi-x-lg" style="font-size:0.89rem"></i>
                                        </button>
                                    </div>
                                    <div class="invalid-feedback" th:errors="*{quantity}"></div>
                                </div>

                                <!-- Price (hidden until SALE selected) -->
                                <label class="col-4 col-form-label fw-semibold" id="priceFieldLabel"
                                       style="display:none" th:text="#{stock.form.salePrice}">Ціна продажу</label>
                                <div class="col-8" id="priceField" style="display:none">
                                    <div class="input-group">
                                        <input type="number" step="0.01" min="0.01" max="99999.99" id="unitPriceInput"
                                               class="form-control"
                                               th:field="*{unitPrice}"
                                               th:classappend="${#fields.hasErrors('unitPrice')} ? 'is-invalid'"/>
                                        <span class="input-group-text">zł</span>
                                        <button type="button" id="clearPriceBtn"
                                                class="btn btn-outline-secondary d-md-none px-1"
                                                onclick="document.getElementById('unitPriceInput').value=''; checkPriceWarning(); updateTotal(); syncClearBtns();"
                                                tabindex="-1" style="display:none">
                                            <i class="bi bi-x-lg" style="font-size:0.89rem"></i>
                                        </button>
                                    </div>
                                    <div class="invalid-feedback" th:errors="*{unitPrice}"></div>
                                </div>
                                <div class="col-12" id="priceWarning" style="display:none">
                                    <div class="alert alert-warning py-1 px-2 mb-0 small text-center">
                                        <i class="bi bi-exclamation-triangle-fill me-1"></i><span id="priceWarningText"></span>
                                    </div>
                                </div>

                                <!-- Client (hidden until SALE or GIFT selected) -->
                                <label class="col-4 col-form-label fw-semibold" id="saleFieldsLabel"
                                       style="display:none" th:text="#{stock.form.client}">Клієнт</label>
                                <div class="col-8" id="saleFields" style="display:none">
                                    <div class="filter-select-wrap">
                                        <select class="form-select ts-client" th:field="*{clientId}">
                                            <option value="" th:text="#{stock.form.selectClient}">-- Оберіть клієнта --</option>
                                            <option th:each="c : ${clients}"
                                                    th:value="${c.id}"
                                                    th:text="${c.name}">
                                            </option>
                                        </select>
                                        <button type="button" id="clearClientBtn"
                                                class="btn btn-outline-secondary btn-sm d-md-none px-1"
                                                onclick="clearClientSelect()" tabindex="-1" style="display:none">
                                            <i class="bi bi-x-lg" style="font-size:0.89rem"></i>
                                        </button>
                                    </div>
                                    <div class="mt-1" id="createClientRow">
                                        <span class="text-muted small" th:text="#{common.or}">або</span>
                                        <a id="newClientLink" href="/clients/new?returnTo=expense"
                                           class="small fw-semibold text-decoration-none ms-1"
                                           style="color:var(--accent)"
                                           th:text="#{client.createNew}">Створити нового клієнта →</a>
                                    </div>
                                </div>

                                <!-- Date -->
                                <label class="col-4 col-form-label fw-semibold" th:text="#{stock.form.saleDate}">Дата</label>
                                <div class="col-8">
                                    <input type="date" class="form-control text-center"
                                           th:field="*{saleDate}"
                                           th:max="${#temporals.format(#temporals.createToday(), 'yyyy-MM-dd')}"
                                           th:classappend="${#fields.hasErrors('saleDate')} ? 'is-invalid'"
                                           onclick="this.showPicker&&this.showPicker()"/>
                                    <div class="invalid-feedback" th:errors="*{saleDate}"></div>
                                </div>

                            </div>
                        </div>

                        <!-- Total -->
                        <div class="col-12" id="saleTotalBox" style="display:none">
                            <div class="d-flex justify-content-between align-items-center px-3 py-2 rounded fw-semibold"
                                 style="background:var(--accent-light)">
                                <span class="text-muted small" th:text="#{stock.form.total}">До сплати</span>
                                <span class="fs-5" id="saleTotalAmount" style="color:var(--accent)"></span>
                            </div>
                        </div>

                        <!-- Notes -->
                        <div class="col-12">
                            <label class="form-label fw-semibold" th:text="#{stock.form.notes}">Примітки</label>
                            <textarea class="form-control" rows="2" th:field="*{notes}"></textarea>
                        </div>

                        <!-- Buttons -->
                        <div class="col-12 d-flex flex-column flex-sm-row-reverse gap-2 justify-content-end">
                            <button type="submit" class="btn btn-primary">
                                <i class="bi bi-arrow-up-circle me-1"></i>
                                <span th:text="#{stock.expense.submit}">Зареєструвати витрату</span>
                            </button>
                            <a th:href="${returnTo != null ? returnTo : '/'}" class="btn btn-outline-secondary" th:text="#{btn.cancel}">Скасувати</a>
                        </div>

                    </div>
                </th:block>

            </form>
        </div>
    </div>
    <script th:inline="javascript">
        const inStockLabel = /*[[#{stock.hint.available}]]*/ 'В наявності';
        const unitLabels = {
            'ML': /*[[#{unit.ML}]]*/ 'мл',
            'G': /*[[#{unit.G}]]*/ 'гр',
            'PCS': /*[[#{unit.PCS}]]*/ 'шт'
        };

        function updateStockHint(select) {
            const option = select.options[select.selectedIndex];
            const hint = document.getElementById('stockHint');
            const quantityInput = document.getElementById('quantity');
            const barcodeBlock = document.getElementById('barcodeBlock');
            const clearProductBtn = document.getElementById('clearProductBtn');
            if (option && option.dataset.qty) {
                const qty = option.dataset.qty;
                const unit = option.dataset.unit;
                hint.textContent = inStockLabel + ': ' + qty + ' ' + (unitLabels[unit] || unit);
                hint.className = 'form-text text-success mt-1';
                if (quantityInput) {
                    if (option.dataset.rawQty) quantityInput.max = option.dataset.rawQty;
                    quantityInput.step = unit === 'PCS' ? '1' : '0.001';
                    if (unit === 'PCS' && quantityInput.value) {
                        quantityInput.value = Math.floor(parseFloat(quantityInput.value));
                    }
                }
                if (barcodeBlock) barcodeBlock.style.display = 'none';
                if (clearProductBtn) clearProductBtn.style.display = '';
            } else {
                hint.textContent = '';
                if (quantityInput) {
                    quantityInput.removeAttribute('max');
                    quantityInput.step = '1';
                }
                if (barcodeBlock) barcodeBlock.style.display = '';
                if (clearProductBtn) clearProductBtn.style.display = 'none';
            }
            checkPriceWarning();
            syncFieldsLock();
        }

        function clearProduct() {
            const productSelect = document.getElementById('productSelect');
            if (!productSelect) return;
            if (productSelect.tomselect) productSelect.tomselect.clear();
            else productSelect.value = '';
            productSelect.disabled = false;
            const hidden = document.getElementById('productIdHidden');
            if (hidden) hidden.disabled = true;
            updateStockHint(productSelect);
        }

        const selectProductFirst = /*[[#{stock.expense.selectProductFirst}]]*/ 'Для початку операції оберіть товар';

        function updateTotal() {
            const qty = parseFloat(document.getElementById('quantity')?.value);
            const price = parseFloat(document.getElementById('unitPriceInput')?.value);
            const box = document.getElementById('saleTotalBox');
            const amountEl = document.getElementById('saleTotalAmount');
            if (!box || !amountEl) return;
            const typeSelect = document.querySelector('[name="movementType"]');
            const isSale = !typeSelect || typeSelect.value === 'SALE';
            if (isSale && qty > 0 && price > 0) {
                amountEl.textContent = (qty * price).toFixed(2);
                box.style.display = '';
            } else {
                box.style.display = 'none';
            }
        }

        function syncFieldsLock() {
            const productSelect = document.getElementById('productSelect');
            const hasProduct = !!(productSelect && productSelect.value);
            const qty = document.getElementById('quantity');
            const price = document.getElementById('unitPriceInput');
            const typeSelect = document.querySelector('[name="movementType"]');
            const saleDate = document.getElementById('saleDate');
            const notes = document.querySelector('textarea[name="notes"]');
            if (qty) qty.disabled = !hasProduct;
            if (price) price.disabled = !hasProduct;
            if (typeSelect) typeSelect.disabled = !hasProduct;
            if (saleDate) saleDate.disabled = !hasProduct;
            if (notes) notes.disabled = !hasProduct;

            // Show/create hint above compact fields when no product selected
            let hint = document.getElementById('noProductHint');
            if (!hint) {
                hint = document.createElement('div');
                hint.id = 'noProductHint';
                hint.className = 'alert alert-warning py-2 px-3 mb-2 small text-center';
                hint.innerHTML = '<i class="bi bi-exclamation-triangle-fill me-1"></i>' + selectProductFirst;
                const compactRow = document.querySelector('.compact-fields');
                if (compactRow) compactRow.closest('.col-12').insertBefore(hint, compactRow);
            }
            hint.style.display = hasProduct ? 'none' : '';
        }

        const saleNoClientMsg = /*[[#{stock.expense.confirm.noClient}]]*/ 'Продаж без клієнта. Продовжити?';
        const priceBelowCostWarning = /*[[#{stock.expense.warning.priceBelowCost}]]*/ 'Ціна нижча за закупівельну:';
        const priceBelowCostConfirm = /*[[#{stock.expense.confirm.priceBelowCost}]]*/ 'Ціна продажу нижча за закупівельну. Зберегти операцію?';

        let isBelowCost = false;

        function checkPriceWarning() {
            const productSelect = document.getElementById('productSelect');
            const priceInput = document.getElementById('unitPriceInput');
            const warningDiv = document.getElementById('priceWarning');
            const warningText = document.getElementById('priceWarningText');
            if (!productSelect || !priceInput || !warningDiv) return;

            const option = productSelect.options[productSelect.selectedIndex];
            const fifoPrice = option ? parseFloat(option.dataset.fifoPrice) : NaN;
            const unitPrice = parseFloat(priceInput.value);

            if (!isNaN(fifoPrice) && fifoPrice > 0 && !isNaN(unitPrice) && unitPrice > 0 && unitPrice < fifoPrice) {
                warningText.textContent = priceBelowCostWarning + ' ' + fifoPrice.toFixed(2);
                warningDiv.style.display = '';
                isBelowCost = true;
            } else {
                warningDiv.style.display = 'none';
                isBelowCost = false;
            }
        }

        function toggleTypeFields() {
            const typeSelect = document.querySelector('[name="movementType"]');
            const writeOffReasonSelect = document.getElementById('writeOffReasonSelect');
            const type = typeSelect ? typeSelect.value : '';
            const reason = writeOffReasonSelect ? writeOffReasonSelect.value : '';
            const isSale = type === 'SALE';
            const isWriteOff = type === 'WRITE_OFF';
            const isGift = isWriteOff && reason === 'GIFT';
            const showClient = isSale || isGift;

            const saleFields = document.getElementById('saleFields');
            const priceField = document.getElementById('priceField');
            const priceInput = document.getElementById('unitPriceInput');
            const writeOffReasonField = document.getElementById('writeOffReasonField');

            if (saleFields) saleFields.style.display = showClient ? '' : 'none';
            const saleFieldsLabel = document.getElementById('saleFieldsLabel');
            if (saleFieldsLabel) saleFieldsLabel.style.display = showClient ? '' : 'none';
            if (priceField) priceField.style.display = isSale ? '' : 'none';
            const priceFieldLabel = document.getElementById('priceFieldLabel');
            if (priceFieldLabel) priceFieldLabel.style.display = isSale ? '' : 'none';
            if (priceInput) {
                priceInput.required = isSale;
                if (!isSale) {
                    priceInput.value = '';
                    isBelowCost = false;
                    const warningDiv = document.getElementById('priceWarning');
                    if (warningDiv) warningDiv.style.display = 'none';
                }
            }
            if (!showClient && !CLIENT_LOCKED) {
                const clientSelect = document.querySelector('[name="clientId"]');
                if (clientSelect) {
                    if (clientSelect.tomselect) clientSelect.tomselect.clear();
                    else clientSelect.value = '';
                }
            }

            if (writeOffReasonField) writeOffReasonField.style.display = isWriteOff ? '' : 'none';
            const writeOffReasonLabel = document.getElementById('writeOffReasonLabel');
            if (writeOffReasonLabel) writeOffReasonLabel.style.display = isWriteOff ? '' : 'none';
            if (writeOffReasonSelect && !isWriteOff) writeOffReasonSelect.value = '';
            updateTotal();
        }

        const PRESELECTED_CLIENT_ID = /*[[${dto.clientId}]]*/ null;
        const CLIENT_LOCKED = /*[[${clientLocked == true}]]*/ false;

function updateNewClientLink() {
            const link = document.getElementById('newClientLink');
            if (!link) return;
            const typeSelect = document.querySelector('[name="movementType"]');
            const productSelect = document.getElementById('productSelect');
            const quantityInput = document.getElementById('quantity');
            let href = '/clients/new?returnTo=expense';
            if (productSelect && productSelect.value) href += '&productId=' + encodeURIComponent(productSelect.value);
            if (typeSelect && typeSelect.value) href += '&movementType=' + encodeURIComponent(typeSelect.value);
            if (quantityInput && quantityInput.value) href += '&quantity=' + encodeURIComponent(quantityInput.value);
            link.href = href;
        }

        function syncClearBtns() {
            const qty = document.getElementById('quantity');
            const price = document.getElementById('unitPriceInput');
            const clearQty = document.getElementById('clearQtyBtn');
            const clearPrice = document.getElementById('clearPriceBtn');
            if (clearQty) clearQty.style.display = (qty && qty.value) ? '' : 'none';
            if (clearPrice) clearPrice.style.display = (price && price.value) ? '' : 'none';
            const barcode = document.getElementById('barcodeInput');
            const clearBarcode = document.getElementById('clearBarcodeBtn');
            if (clearBarcode) clearBarcode.style.display = (barcode && barcode.value) ? '' : 'none';
        }

        function clearClientSelect() {
            const clientSel = document.querySelector('[name="clientId"]');
            if (!clientSel) return;
            if (clientSel.tomselect) clientSel.tomselect.clear();
            else clientSel.value = '';
            syncCreateClientLink();
        }

        function syncScannerLink() {
            const link = document.getElementById('scannerLink');
            if (!link) return;
            let href = '/scan?mode=expense';
            const clientHidden = document.querySelector('input[name="clientId"][type="hidden"]');
            if (clientHidden && clientHidden.value) href += '&clientId=' + encodeURIComponent(clientHidden.value);
            const returnToHidden = document.querySelector('input[name="returnTo"][type="hidden"]');
            if (returnToHidden && returnToHidden.value) href += '&returnTo=' + encodeURIComponent(returnToHidden.value);
            link.href = href;
        }

        function syncCreateClientLink() {
            const clientSel = document.querySelector('[name="clientId"]');
            const createRow = document.getElementById('createClientRow');
            const clearBtn = document.getElementById('clearClientBtn');
            const hasClient = !!(clientSel && clientSel.value);
            if (createRow) createRow.style.display = hasClient ? 'none' : '';
            if (clearBtn) clearBtn.style.display = hasClient ? '' : 'none';
        }

        document.addEventListener('DOMContentLoaded', function() {
            const productSelect = document.getElementById('productSelect');
            if (productSelect && productSelect.value) updateStockHint(productSelect);
            syncFieldsLock();

            const typeSelect = document.querySelector('[name="movementType"]');
            if (typeSelect) {
                toggleTypeFields();
                // Restore a pre-selected client that toggleTypeFields may have cleared on init
                if (PRESELECTED_CLIENT_ID) {
                    const clientSel = document.querySelector('[name="clientId"]');
                    if (clientSel) {
                        clientSel.value = PRESELECTED_CLIENT_ID;
                        const sf = document.getElementById('saleFields');
                        if (sf) sf.style.display = '';
                    }
                }
                typeSelect.addEventListener('change', function () {
                    toggleTypeFields();
                    updateNewClientLink();
                });
            }
            updateNewClientLink();

            const writeOffReasonSelect = document.getElementById('writeOffReasonSelect');
            if (writeOffReasonSelect) {
                writeOffReasonSelect.addEventListener('change', toggleTypeFields);
            }

            const priceInput = document.getElementById('unitPriceInput');
            if (priceInput) {
                priceInput.addEventListener('input', checkPriceWarning);
                priceInput.addEventListener('input', updateTotal);
                priceInput.addEventListener('input', syncClearBtns);
            }

            const quantityInput = document.getElementById('quantity');
            if (quantityInput) {
                quantityInput.addEventListener('input', updateNewClientLink);
                quantityInput.addEventListener('input', updateTotal);
                quantityInput.addEventListener('input', syncClearBtns);
            }
            const barcodeInput = document.getElementById('barcodeInput');
            if (barcodeInput) barcodeInput.addEventListener('input', syncClearBtns);
            updateTotal();
            syncClearBtns();

            const clientSelectEl = document.querySelector('[name="clientId"]');
            if (clientSelectEl) clientSelectEl.addEventListener('change', syncCreateClientLink);
            syncCreateClientLink();
            syncScannerLink();

            const form = document.querySelector('form');
            if (form) {
                form.addEventListener('submit', function(e) {
                    const type = document.querySelector('[name="movementType"]');
                    if (type && type.value === 'SALE') {
                        if (isBelowCost && !confirm(priceBelowCostConfirm)) {
                            e.preventDefault();
                            return;
                        }
                        const client = document.querySelector('[name="clientId"]');
                        if (client && !client.value && !confirm(saleNoClientMsg)) {
                            e.preventDefault();
                        }
                    }
                });
            }
        });

        (function () {
            var barcodeInput = document.getElementById('barcodeInput');
            var barcodeError = document.getElementById('barcodeError');
            var productSelect = document.getElementById('productSelect');
            var notFoundMsg = /*[[#{scan.notFound.title}]]*/ 'Штрихкод не знайдено';
            var createNewMsg = /*[[#{scan.notFound.createNew}]]*/ 'Створити новий товар';
            var outOfStockMsg = /*[[#{scan.outOfStock.message}]]*/ 'Товар відсутній у наявності';

            if (!barcodeInput || !productSelect) return;

            var barcodeTimer;
            barcodeInput.addEventListener('input', function () {
                clearTimeout(barcodeTimer);
                var code = this.value.trim();
                if (code.length < 8) {
                    barcodeError.style.display = 'none';
                    return;
                }
                barcodeTimer = setTimeout(function () { lookupBarcode(code); }, 600);
            });

            function showBarcodeNotFound(code) {
                barcodeError.innerHTML = '';
                var span = document.createElement('span');
                span.className = 'text-danger';
                span.textContent = notFoundMsg + ' ';
                var a = document.createElement('a');
                a.href = '/products/new?barcode=' + encodeURIComponent(code) + '&returnTo=expense';
                a.textContent = createNewMsg + ' \u2192';
                a.className = 'fw-semibold text-decoration-none';
                a.style.color = 'var(--accent)';
                barcodeError.appendChild(span);
                barcodeError.appendChild(a);
                barcodeError.style.display = '';
            }

            function lookupBarcode(code) {
                fetch('/products/by-barcode?code=' + encodeURIComponent(code))
                    .then(function (r) {
                        if (r.ok) {
                            return r.json().then(function (p) {
                                if (!(p.availableQty > 0)) {
                                    barcodeError.innerHTML = '';
                                    var span = document.createElement('span');
                                    span.className = 'text-danger';
                                    span.textContent = (p.name || '') + ': ' + outOfStockMsg;
                                    barcodeError.appendChild(span);
                                    barcodeError.style.display = '';
                                    return;
                                }
                                if (productSelect.tomselect) productSelect.tomselect.setValue(String(p.id));
                                else productSelect.value = p.id;
                                barcodeError.style.display = 'none';
                                updateStockHint(productSelect);
                            });
                        } else {
                            showBarcodeNotFound(code);
                        }
                    })
                    .catch(function () {
                        showBarcodeNotFound(code);
                    });
            }
        })();
    </script>
</div>
</body>
</html>
