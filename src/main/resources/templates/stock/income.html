<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout/main :: layout(#{stock.income.title}, ~{::content})}">
<body>
<div th:fragment="content">
    <style>
        #submitIncomeBtn:disabled { background-color: transparent; border-color: #6c757d; color: #6c757d; opacity: 0.65; }
        .card-body { overflow-x: visible !important; }
        .compact-fields .form-control { text-align: right; }
        .compact-fields input[type="date"] { text-align: center; }
        .filter-select-wrap > .ts-wrapper { flex: 1; min-width: 0; }
        .filter-select-wrap .ts-wrapper.has-items .ts-control > input { width: 0 !important; min-width: 0 !important; }
        .ts-control .placeholder { font-size: 0.875em; }
    </style>
    <div class="page-header">
        <h1 class="page-title" th:text="#{stock.income.title}">Прихід товару</h1>
        <a th:if="${returnTo != null}" th:href="${returnTo}" class="btn btn-outline-secondary">
            <i class="bi bi-arrow-left me-1"></i>
            <span class="d-none d-sm-inline" th:text="#{btn.back}">Назад</span>
        </a>
    </div>

    <div th:if="${successMessage}" class="alert alert-success alert-dismissible fade show mb-3">
        <span th:text="${successMessage}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
    </div>
    <div th:if="${errorMessage}" class="alert alert-danger alert-dismissible fade show mb-3">
        <span th:text="${errorMessage}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
    </div>

    <div class="card">
        <div class="card-body">
            <form id="incomeForm" th:action="@{/movements/income}" th:object="${dto}" method="post">
                <input th:if="${returnTo != null}" type="hidden" name="returnTo" th:value="${returnTo}"/>
                <div class="row g-3">

                    <!-- Product (full width) -->
                    <div class="col-12">
                        <label class="form-label fw-semibold" th:text="#{stock.form.product}">Товар</label>
                        <div class="filter-select-wrap">
                            <select class="form-select ts-client" id="productSelect" th:field="*{productId}"
                                    th:classappend="${#fields.hasErrors('productId')} ? 'is-invalid'"
                                    th:disabled="${dto.productId != null}"
                                    onchange="onProductChange(this)">
                                <option value="" th:text="#{stock.form.selectProduct}">-- Оберіть товар --</option>
                                <option th:each="p : ${products}"
                                        th:value="${p.id}"
                                        th:text="${p.name} + ' (' + #{unit.__${p.unit}__} + ')'"
                                        th:attr="data-unit=${p.unit},data-last-price=${lastPurchaseInfo[p.id]?.price},data-last-price-date=${lastPurchaseInfo[p.id]?.date},data-last-supplier-id=${lastSupplierInfo[p.id]?.supplierId},data-last-supplier-name=${lastSupplierInfo[p.id]?.supplierName}">
                                </option>
                            </select>
                            <button th:if="${dto.productId == null}" type="button" id="clearProductBtn"
                                    class="btn btn-outline-secondary btn-sm d-md-none px-1"
                                    onclick="clearProduct()" tabindex="-1" style="display:none">
                                <i class="bi bi-x-lg" style="font-size:0.89rem"></i>
                            </button>
                        </div>
                        <input th:if="${dto.productId != null}" id="productIdHidden" type="hidden" name="productId" th:value="${dto.productId}"/>
                        <div class="invalid-feedback" th:errors="*{productId}"></div>
                        <div id="barcodeBlock" th:if="${dto.productId == null}">
                            <div class="d-flex align-items-center gap-2 mt-2">
                                <span class="text-muted small flex-shrink-0" th:text="#{common.or}">або</span>
                                <div class="input-group input-group-sm flex-grow-1">
                                    <span class="input-group-text"><i class="bi bi-upc-scan"></i></span>
                                    <input type="text" id="barcodeInput" class="form-control"
                                           th:placeholder="#{scan.barcode.placeholder}"
                                           inputmode="numeric"
                                           oninput="this.value=this.value.replace(/\D/g,'')"
                                           autocomplete="off"/>
                                    <button type="button" id="clearBarcodeBtn"
                                            class="btn btn-outline-secondary d-md-none px-1"
                                            onclick="document.getElementById('barcodeInput').value=''; document.getElementById('clearBarcodeBtn').style.display='none'; document.getElementById('barcodeError').style.display='none';"
                                            tabindex="-1" style="display:none">
                                        <i class="bi bi-x-lg" style="font-size:0.89rem"></i>
                                    </button>
                                </div>
                            </div>
                            <div id="barcodeError" class="form-text mt-1" style="display:none"></div>
                        </div>
                    </div>

                    <!-- Compact label | input pairs -->
                    <div class="col-12">
                        <div class="row gy-2 gx-0 align-items-center compact-fields">

                            <!-- Step hint: select supplier -->
                            <div class="col-12" id="stepHintSupplier" style="display:none">
                                <div class="alert alert-warning py-1 px-2 mb-0 small text-center">
                                    <i class="bi bi-exclamation-triangle-fill me-1"></i><span th:text="#{stock.income.hint.selectSupplier}">Оберіть постачальника</span><i class="bi bi-arrow-down ms-1"></i>
                                </div>
                            </div>

                            <!-- Supplier -->
                            <label class="col-4 col-form-label fw-semibold align-self-start" th:text="#{stock.form.supplier}">Постачальник</label>
                            <div class="col-8">
                                <div class="filter-select-wrap">
                                    <select class="form-select ts-client" th:field="*{supplierId}"
                                            th:classappend="${#fields.hasErrors('supplierId')} ? 'is-invalid'">
                                        <option value="" th:text="#{stock.form.selectSupplier}">-- Оберіть постачальника --</option>
                                        <option th:each="s : ${suppliers}"
                                                th:value="${s.id}"
                                                th:text="${s.name}">
                                        </option>
                                    </select>
                                    <button type="button" id="clearSupplierBtn"
                                            class="btn btn-outline-secondary btn-sm d-md-none px-1"
                                            onclick="clearSupplierSelect()" tabindex="-1" style="display:none">
                                        <i class="bi bi-x-lg" style="font-size:0.89rem"></i>
                                    </button>
                                </div>
                                <div class="invalid-feedback" th:errors="*{supplierId}"></div>
                                <div class="mt-1" id="createSupplierRow">
                                    <span class="text-muted small" th:text="#{common.or}">або</span>
                                    <a th:href="@{/suppliers/new(returnTo='income')}"
                                       class="small fw-semibold text-decoration-none ms-1"
                                       style="color:var(--accent)"
                                       th:text="#{supplier.createNew}">Створити нового постачальника →</a>
                                </div>
                            </div>
                            <div class="col-12" id="lastSupplierHint" style="display:none">
                                <div class="alert mb-0 py-1 px-2"
                                     style="background:var(--accent-light); border-left:3px solid var(--accent); border-radius:4px; border-top:none; border-right:none; border-bottom:none; font-size:0.78rem">
                                    <i class="bi bi-info-circle-fill me-1" style="color:var(--accent)"></i><span id="lastSupplierHintText"></span>
                                </div>
                            </div>

                            <!-- Quantity -->
                            <label class="col-4 col-form-label fw-semibold" th:text="#{stock.form.quantity}">Кількість</label>
                            <div class="col-8">
                                <div class="input-group">
                                    <input type="number" step="1" class="form-control"
                                           id="quantity"
                                           th:field="*{quantity}"
                                           th:classappend="${#fields.hasErrors('quantity')} ? 'is-invalid'"
                                           oninput="syncFieldsLock()"/>
                                    <button type="button" id="clearQtyBtn"
                                            class="btn btn-outline-secondary d-md-none px-1"
                                            onclick="document.getElementById('quantity').value=''; syncClearBtns(); syncFieldsLock();"
                                            tabindex="-1" style="display:none">
                                        <i class="bi bi-x-lg" style="font-size:0.89rem"></i>
                                    </button>
                                </div>
                                <div class="invalid-feedback" th:errors="*{quantity}"></div>
                            </div>

                            <!-- Step hint: enter quantity -->
                            <div class="col-12" id="stepHintQty" style="display:none">
                                <div class="alert alert-warning py-1 px-2 mb-0 small text-center">
                                    <i class="bi bi-exclamation-triangle-fill me-1"></i><span th:text="#{stock.income.hint.enterQty}">Введіть кількість</span>
                                </div>
                            </div>

                            <!-- Purchase price -->
                            <label class="col-4 col-form-label fw-semibold" th:text="#{stock.form.purchasePrice}">Ціна закупки</label>
                            <div class="col-8">
                                <div class="input-group">
                                    <input type="number" step="0.01" min="0" max="99999.99" class="form-control"
                                           id="purchasePriceInput"
                                           th:field="*{purchasePrice}"
                                           th:classappend="${#fields.hasErrors('purchasePrice')} ? 'is-invalid'"/>
                                    <span class="input-group-text">zł</span>
                                    <button type="button" id="clearPriceBtn"
                                            class="btn btn-outline-secondary d-md-none px-1"
                                            onclick="document.getElementById('purchasePriceInput').value=''; onPriceInput();"
                                            tabindex="-1" style="display:none">
                                        <i class="bi bi-x-lg" style="font-size:0.89rem"></i>
                                    </button>
                                </div>
                                <div class="invalid-feedback" th:errors="*{purchasePrice}"></div>
                            </div>
                            <div class="col-12" id="lastPriceHint" style="display:none">
                                <div class="alert mb-0 py-1 px-2"
                                     style="background:var(--accent-light); border-left:3px solid var(--accent); border-radius:4px; border-top:none; border-right:none; border-bottom:none; font-size:0.78rem">
                                    <i class="bi bi-info-circle-fill me-1" style="color:var(--accent)"></i><span id="lastPriceHintText"></span>
                                </div>
                            </div>

                            <!-- Expiry date -->
                            <label class="col-4 col-form-label fw-semibold" th:text="#{stock.form.expiryDate}">Термін придатності</label>
                            <div class="col-8">
                                <div class="input-group">
                                    <input type="date" class="form-control" id="expiryDateInput"
                                           th:field="*{expiryDate}"
                                           onclick="this.showPicker&&this.showPicker()"/>
                                    <button type="button" id="clearExpiryBtn"
                                            class="btn btn-outline-secondary d-md-none px-1"
                                            onclick="document.getElementById('expiryDateInput').value=''; syncClearBtns();"
                                            tabindex="-1" style="display:none">
                                        <i class="bi bi-x-lg" style="font-size:0.89rem"></i>
                                    </button>
                                </div>
                            </div>

                            <!-- Batch number -->
                            <label class="col-4 col-form-label fw-semibold">
                                <span th:text="#{stock.form.batchNumber}">Номер партії</span>
                                <span class="text-muted fw-normal"> *</span>
                            </label>
                            <div class="col-8">
                                <div class="input-group">
                                    <input type="text" class="form-control" id="batchNumberInput"
                                           th:field="*{batchNumber}"/>
                                    <button type="button" id="clearBatchBtn"
                                            class="btn btn-outline-secondary d-md-none px-1"
                                            onclick="document.getElementById('batchNumberInput').value=''; syncClearBtns();"
                                            tabindex="-1" style="display:none">
                                        <i class="bi bi-x-lg" style="font-size:0.89rem"></i>
                                    </button>
                                </div>
                            </div>
                            <div class="col-12 text-center">
                                <span class="form-text text-muted">* <span th:text="#{stock.form.batchNumber.hint}"></span></span>
                            </div>

                        </div>
                    </div>

                    <!-- Total -->
                    <div class="col-12" id="incomeTotalBox" style="display:none">
                        <div class="d-flex justify-content-between align-items-center px-3 py-2 rounded fw-semibold"
                             style="background:var(--accent-light)">
                            <span class="text-muted small" th:text="#{stock.income.total}">Сума закупки</span>
                            <span class="fs-5" id="incomeTotalAmount" style="color:var(--accent)"></span>
                        </div>
                    </div>

                    <!-- Notes -->
                    <div class="col-12">
                        <label class="form-label fw-semibold" th:text="#{stock.form.notes}">Примітки</label>
                        <textarea class="form-control" rows="2" th:field="*{notes}"></textarea>
                    </div>

                    <!-- Buttons -->
                    <div class="col-12 d-flex flex-column flex-sm-row gap-2 justify-content-center">
                        <button type="submit" id="submitIncomeBtn" class="btn btn-primary" disabled>
                            <i class="bi bi-arrow-down-circle me-1"></i>
                            <span th:text="#{stock.income.submit}">Зареєструвати прихід</span>
                        </button>
                        <a th:href="${returnTo != null ? returnTo : '/'}" class="btn btn-outline-secondary" th:text="#{btn.cancel}">Скасувати</a>
                    </div>

                </div>
            </form>
        </div>
    </div>
    <script th:inline="javascript">
        const selectProductFirst = /*[[#{stock.expense.selectProductFirst}]]*/ 'Для початку операції оберіть товар';
        const lastPriceHintLabel = /*[[#{stock.income.lastPriceHint}]]*/ 'Last purchase price:';
        const lastPriceConfirmTpl = /*[[#{stock.income.lastPriceConfirm}]]*/ 'Last purchase price set ({0}, {1} zł). Continue?';
        const zeroPriceConfirm = /*[[#{stock.income.zeroPriceConfirm}]]*/ 'Purchase price is 0. Register as a free receipt?';
        const lastSupplierHintLabel = /*[[#{stock.income.lastSupplierHint}]]*/ 'Supplier from last purchase';
        const hintSelectSupplier = /*[[#{stock.income.hint.selectSupplier}]]*/ 'Select supplier';
        const hintEnterQty = /*[[#{stock.income.hint.enterQty}]]*/ 'Enter quantity';

        var priceIsDefault = false;
        var lastPriceDate = '';
        var suppressNextSupplierChange = false;

        function showLastPriceHint(date, price) {
            var hint = document.getElementById('lastPriceHint');
            var hintText = document.getElementById('lastPriceHintText');
            if (!hint || !hintText) return;
            hintText.innerHTML = lastPriceHintLabel + ' ' + date + ':  <strong>' + price + ' z\u0142</strong>';
            hint.style.display = '';
        }

        function hideLastPriceHint() {
            var hint = document.getElementById('lastPriceHint');
            if (hint) hint.style.display = 'none';
        }

        function showLastSupplierHint(name) {
            var hint = document.getElementById('lastSupplierHint');
            var hintText = document.getElementById('lastSupplierHintText');
            if (!hint || !hintText) return;
            hintText.textContent = lastSupplierHintLabel;
            hint.style.display = '';
        }

        function hideLastSupplierHint() {
            var hint = document.getElementById('lastSupplierHint');
            if (hint) hint.style.display = 'none';
        }

        function onPriceInput() {
            if (priceIsDefault) {
                priceIsDefault = false;
                lastPriceDate = '';
                hideLastPriceHint();
            }
            syncClearBtns();
            syncFieldsLock();
        }

        function syncFieldsLock() {
            var productSelect = document.getElementById('productSelect');
            var hasProduct = !!(productSelect && productSelect.value);

            var supplierSel = document.querySelector('[name="supplierId"]');
            var hasSupplier = !!(supplierSel && supplierSel.value);

            var qtyInput = document.getElementById('quantity');
            var hasQty = !!(qtyInput && qtyInput.value && parseFloat(qtyInput.value) > 0);

            var priceInput2 = document.getElementById('purchasePriceInput');
            var hasPrice = !!(priceInput2 && priceInput2.value !== '');

            // step 0: no product | 1: need supplier | 2: need qty | 3: all good
            var step = !hasProduct ? 0 : !hasSupplier ? 1 : !hasQty ? 2 : 3;

            // Supplier — enabled from step 1
            if (supplierSel) {
                var supplierOn = step >= 1;
                if (supplierSel.tomselect) {
                    supplierOn ? supplierSel.tomselect.enable() : supplierSel.tomselect.disable();
                } else {
                    supplierSel.disabled = !supplierOn;
                }
            }

            // Quantity — enabled from step 2
            if (qtyInput) qtyInput.disabled = step < 2;

            // Price, expiry, batch, notes — enabled from step 3
            ['purchasePriceInput', 'expiryDateInput', 'batchNumberInput'].forEach(function (id) {
                var el = document.getElementById(id);
                if (el) el.disabled = step < 3;
            });
            var notes = document.querySelector('textarea[name="notes"]');
            if (notes) notes.disabled = step < 3;

            syncCreateSupplierLink();

            // noProductHint — step 0 only
            var noHint = document.getElementById('noProductHint');
            if (!noHint) {
                noHint = document.createElement('div');
                noHint.id = 'noProductHint';
                noHint.className = 'alert alert-warning py-2 px-3 mb-2 small text-center';
                noHint.innerHTML = '<i class="bi bi-exclamation-triangle-fill me-1"></i>' + selectProductFirst;
                var compactRow = document.querySelector('.compact-fields');
                if (compactRow) compactRow.closest('.col-12').insertBefore(noHint, compactRow);
            }
            noHint.style.display = step === 0 ? '' : 'none';

            // step hints — static elements in correct positions
            var stepHintSupplier = document.getElementById('stepHintSupplier');
            var stepHintQty = document.getElementById('stepHintQty');
            if (stepHintSupplier) stepHintSupplier.style.display = step === 1 ? '' : 'none';
            if (stepHintQty) stepHintQty.style.display = step === 2 ? '' : 'none';

            // Submit — enabled only at step 3 AND price filled
            var submitBtn = document.getElementById('submitIncomeBtn');
            if (submitBtn) submitBtn.disabled = step < 3 || !hasPrice;
        }

        function onProductChange(select) {
            var option = select.options[select.selectedIndex];
            var quantityInput = document.getElementById('quantity');
            var barcodeBlock = document.getElementById('barcodeBlock');
            var clearProductBtn = document.getElementById('clearProductBtn');
            var priceInput = document.getElementById('purchasePriceInput');

            var lastPrice = option ? option.dataset.lastPrice : null;
            var lastDate = option ? option.dataset.lastPriceDate : null;
            if (lastPrice && priceInput) {
                priceInput.value = lastPrice;
                priceIsDefault = true;
                lastPriceDate = lastDate || '';
                showLastPriceHint(lastDate, lastPrice);
            } else {
                if (priceInput) priceInput.value = '';
                priceIsDefault = false;
                lastPriceDate = '';
                hideLastPriceHint();
            }

            var lastSupplierId = option ? option.dataset.lastSupplierId : null;
            var lastSupplierName = option ? option.dataset.lastSupplierName : null;
            var supplierSel = document.querySelector('[name="supplierId"]');
            if (lastSupplierId && supplierSel) {
                suppressNextSupplierChange = true;
                if (supplierSel.tomselect) {
                    supplierSel.tomselect.setValue(lastSupplierId);
                    supplierSel.tomselect.blur();
                } else {
                    supplierSel.value = lastSupplierId;
                }
                suppressNextSupplierChange = false;
                showLastSupplierHint(lastSupplierName);
            } else {
                if (supplierSel) {
                    if (supplierSel.tomselect) supplierSel.tomselect.clear();
                    else supplierSel.value = '';
                }
                hideLastSupplierHint();
            }

            var notes = document.querySelector('textarea[name="notes"]');
            if (notes) notes.value = '';

            if (option && option.dataset.unit) {
                var unit = option.dataset.unit;
                if (quantityInput) {
                    quantityInput.value = '';
                    quantityInput.step = unit === 'PCS' ? '1' : '0.001';
                }
                if (barcodeBlock) barcodeBlock.style.display = 'none';
                if (clearProductBtn) clearProductBtn.style.display = '';
            } else {
                if (quantityInput) quantityInput.step = '1';
                if (barcodeBlock) barcodeBlock.style.display = '';
                if (clearProductBtn) clearProductBtn.style.display = 'none';
            }
            syncFieldsLock();
            syncClearBtns();
        }

        function clearProduct() {
            var productSelect = document.getElementById('productSelect');
            if (!productSelect) return;
            if (productSelect.tomselect) productSelect.tomselect.clear();
            else productSelect.value = '';
            productSelect.disabled = false;
            var hidden = document.getElementById('productIdHidden');
            if (hidden) hidden.disabled = true;

            // Clear all dependent fields
            var supplierSel = document.querySelector('[name="supplierId"]');
            if (supplierSel) {
                if (supplierSel.tomselect) supplierSel.tomselect.clear();
                else supplierSel.value = '';
            }
            var qty = document.getElementById('quantity');
            if (qty) qty.value = '';
            var price = document.getElementById('purchasePriceInput');
            if (price) price.value = '';
            var expiry = document.getElementById('expiryDateInput');
            if (expiry) expiry.value = '';
            var batch = document.getElementById('batchNumberInput');
            if (batch) batch.value = '';
            var notes = document.querySelector('textarea[name="notes"]');
            if (notes) notes.value = '';

            priceIsDefault = false;
            lastPriceDate = '';
            hideLastPriceHint();
            hideLastSupplierHint();
            onProductChange(productSelect);
        }

        function syncCreateSupplierLink() {
            var productSelect = document.getElementById('productSelect');
            var hasProduct = !!(productSelect && productSelect.value);
            var supplierSel = document.querySelector('[name="supplierId"]');
            var createRow = document.getElementById('createSupplierRow');
            var clearBtn = document.getElementById('clearSupplierBtn');
            var hasSupplier = !!(supplierSel && supplierSel.value);
            if (createRow) createRow.style.display = (!hasProduct || hasSupplier) ? 'none' : '';
            if (clearBtn) clearBtn.style.display = hasSupplier ? '' : 'none';
        }

        function clearSupplierSelect() {
            var supplierSel = document.querySelector('[name="supplierId"]');
            if (!supplierSel) return;
            if (supplierSel.tomselect) supplierSel.tomselect.clear();
            else supplierSel.value = '';
            hideLastSupplierHint();
            syncFieldsLock();
        }

        function syncClearBtns() {
            var qty = document.getElementById('quantity');
            var price = document.getElementById('purchasePriceInput');
            var expiry = document.getElementById('expiryDateInput');
            var batch = document.getElementById('batchNumberInput');
            var clearQty = document.getElementById('clearQtyBtn');
            var clearPrice = document.getElementById('clearPriceBtn');
            var clearExpiry = document.getElementById('clearExpiryBtn');
            var clearBatch = document.getElementById('clearBatchBtn');
            if (clearQty) clearQty.style.display = (qty && qty.value) ? '' : 'none';
            if (clearPrice) clearPrice.style.display = (price && price.value) ? '' : 'none';
            if (clearExpiry) clearExpiry.style.display = (expiry && expiry.value) ? '' : 'none';
            if (expiry) expiry.style.color = expiry.value ? '' : '#6c757d';
            if (clearBatch) clearBatch.style.display = (batch && batch.value) ? '' : 'none';
            var barcode = document.getElementById('barcodeInput');
            var clearBarcode = document.getElementById('clearBarcodeBtn');
            if (clearBarcode) clearBarcode.style.display = (barcode && barcode.value) ? '' : 'none';
            updateTotal();
        }

        function updateTotal() {
            var qty = parseFloat(document.getElementById('quantity')?.value);
            var price = parseFloat(document.getElementById('purchasePriceInput')?.value);
            var box = document.getElementById('incomeTotalBox');
            var amountEl = document.getElementById('incomeTotalAmount');
            if (!box || !amountEl) return;
            if (qty > 0 && price > 0) {
                amountEl.textContent = (qty * price).toFixed(2) + ' z\u0142';
                box.style.display = '';
            } else {
                box.style.display = 'none';
            }
        }

        document.addEventListener('DOMContentLoaded', function () {
            var expiryInput = document.getElementById('expiryDateInput');
            if (expiryInput) expiryInput.min = new Date().toISOString().split('T')[0];

            var productSelect = document.getElementById('productSelect');
            if (productSelect && productSelect.value) onProductChange(productSelect);
            syncFieldsLock();

            var supplierSel = document.querySelector('[name="supplierId"]');
            if (supplierSel) supplierSel.addEventListener('change', function () {
                if (!suppressNextSupplierChange) hideLastSupplierHint();
                syncFieldsLock();
            });
            syncCreateSupplierLink();

            ['quantity', 'expiryDateInput', 'batchNumberInput', 'barcodeInput'].forEach(function (id) {
                var el = document.getElementById(id);
                if (el) el.addEventListener('input', syncClearBtns);
            });
            var priceInput = document.getElementById('purchasePriceInput');
            if (priceInput) priceInput.addEventListener('input', onPriceInput);

            syncClearBtns();
            updateTotal();

            var incomeForm = document.getElementById('incomeForm');
            if (incomeForm) {
                incomeForm.addEventListener('submit', function (e) {
                    var priceVal = parseFloat(document.getElementById('purchasePriceInput').value);
                    if (priceIsDefault) {
                        var price = document.getElementById('purchasePriceInput').value;
                        var msg = lastPriceConfirmTpl.replace('{0}', lastPriceDate).replace('{1}', price);
                        if (!window.confirm(msg)) { e.preventDefault(); return; }
                    }
                    if (priceVal === 0) {
                        if (!window.confirm(zeroPriceConfirm)) { e.preventDefault(); }
                    }
                });
            }
        });

        (function () {
            var barcodeInput = document.getElementById('barcodeInput');
            var barcodeError = document.getElementById('barcodeError');
            var productSelect = document.getElementById('productSelect');
            var notFoundMsg = /*[[#{scan.notFound.title}]]*/ 'Штрихкод не знайдено';
            var createNewMsg = /*[[#{scan.notFound.createNew}]]*/ 'Створити новий товар';

            if (!barcodeInput || !productSelect) return;

            var barcodeTimer;
            barcodeInput.addEventListener('input', function () {
                clearTimeout(barcodeTimer);
                var code = this.value.trim();
                if (code.length < 8) {
                    barcodeError.style.display = 'none';
                    return;
                }
                barcodeTimer = setTimeout(function () { lookupBarcode(code); }, 600);
            });

            function showBarcodeNotFound(code) {
                barcodeError.innerHTML = '';
                var span = document.createElement('span');
                span.className = 'text-danger';
                span.textContent = notFoundMsg + ' ';
                var a = document.createElement('a');
                a.href = '/products/new?barcode=' + encodeURIComponent(code) + '&returnTo=income';
                a.textContent = createNewMsg + ' \u2192';
                a.className = 'fw-semibold text-decoration-none';
                a.style.color = 'var(--accent)';
                barcodeError.appendChild(span);
                barcodeError.appendChild(a);
                barcodeError.style.display = '';
            }

            function lookupBarcode(code) {
                fetch('/products/by-barcode?code=' + encodeURIComponent(code))
                    .then(function (r) {
                        if (r.ok) {
                            return r.json().then(function (p) {
                                if (productSelect.tomselect) productSelect.tomselect.setValue(String(p.id));
                                else productSelect.value = p.id;
                                barcodeError.style.display = 'none';
                                onProductChange(productSelect);
                            });
                        } else {
                            showBarcodeNotFound(code);
                        }
                    })
                    .catch(function () {
                        showBarcodeNotFound(code);
                    });
            }
        })();
    </script>
</div>
</body>
</html>
