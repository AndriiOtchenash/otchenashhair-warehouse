<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout/main :: layout(#{stock.income.title}, ~{::content})}">
<body>
<div th:fragment="content">
    <div class="page-header">
        <h1 class="page-title" th:text="#{stock.income.title}">Прихід товару</h1>
    </div>

    <div th:if="${successMessage}" class="alert alert-success alert-dismissible fade show mb-3">
        <span th:text="${successMessage}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
    </div>
    <div th:if="${errorMessage}" class="alert alert-danger alert-dismissible fade show mb-3">
        <span th:text="${errorMessage}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
    </div>

    <div class="card">
        <div class="card-body">
            <form th:action="@{/movements/income}" th:object="${dto}" method="post">
                <div class="row g-3">
                    <div class="col-md-6">
                        <label class="form-label fw-semibold" th:text="#{stock.form.product}">Товар</label>
                        <select class="form-select" th:field="*{productId}"
                                th:classappend="${#fields.hasErrors('productId')} ? 'is-invalid'">
                            <option value="">-- Оберіть товар --</option>
                            <option th:each="p : ${products}"
                                    th:value="${p.id}"
                                    th:text="${p.name} + ' (' + #{unit.__${p.unit}__} + ')'">
                            </option>
                        </select>
                        <div class="invalid-feedback" th:errors="*{productId}"></div>
                    </div>

                    <div class="col-md-6">
                        <label class="form-label fw-semibold" th:text="#{stock.form.supplier}">Постачальник</label>
                        <select class="form-select" th:field="*{supplierId}"
                                th:classappend="${#fields.hasErrors('supplierId')} ? 'is-invalid'">
                            <option value="">-- Оберіть постачальника --</option>
                            <option th:each="s : ${suppliers}"
                                    th:value="${s.id}"
                                    th:text="${s.name}">
                            </option>
                        </select>
                        <div class="invalid-feedback" th:errors="*{supplierId}"></div>
                    </div>

                    <div class="col-md-3">
                        <label class="form-label fw-semibold" th:text="#{stock.form.quantity}">Кількість</label>
                        <input type="number" step="0.001" class="form-control"
                               th:field="*{quantity}"
                               th:classappend="${#fields.hasErrors('quantity')} ? 'is-invalid'"/>
                        <div class="invalid-feedback" th:errors="*{quantity}"></div>
                    </div>

                    <div class="col-md-3">
                        <label class="form-label fw-semibold" th:text="#{stock.form.purchasePrice}">Ціна закупки</label>
                        <input type="number" step="0.01" class="form-control"
                               th:field="*{purchasePrice}"
                               th:classappend="${#fields.hasErrors('purchasePrice')} ? 'is-invalid'"/>
                        <div class="invalid-feedback" th:errors="*{purchasePrice}"></div>
                    </div>

                    <div class="col-md-3">
                        <label class="form-label fw-semibold" th:text="#{stock.form.expiryDate}">Термін придатності</label>
                        <input type="date" class="form-control" th:field="*{expiryDate}"/>
                    </div>

                    <div class="col-md-3">
                        <label class="form-label fw-semibold" th:text="#{stock.form.batchNumber}">Номер партії</label>
                        <input type="text" class="form-control" th:field="*{batchNumber}"/>
                        <div class="form-text text-muted" th:text="#{stock.form.batchNumber.hint}"></div>
                    </div>

                    <div class="col-12">
                        <label class="form-label fw-semibold" th:text="#{stock.form.notes}">Примітки</label>
                        <textarea class="form-control" rows="2" th:field="*{notes}"></textarea>
                    </div>

                    <div class="col-12">
                        <button type="submit" class="btn btn-primary">
                            <i class="bi bi-arrow-down-circle me-1"></i>
                            <span th:text="#{stock.income.submit}">Зареєструвати прихід</span>
                        </button>
                    </div>
                </div>
            </form>
        </div>
    </div>
</div>
</body>
</html>
