<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout/main :: layout(#{supplier.form.title.edit}, ~{::content})}">
<body>
<div th:fragment="content">
    <div class="page-header">
        <h1 class="page-title" th:text="#{supplier.form.title.edit}">Редагувати постачальника</h1>
        <a th:href="@{/suppliers}" class="btn btn-outline-secondary">
            <i class="bi bi-arrow-left me-1"></i>
            <span th:text="#{btn.back}">Назад</span>
        </a>
    </div>
    <div class="card">
        <div class="card-body">
            <form th:action="@{/suppliers/{id}/edit(id=${supplier.id})}"
                  th:object="${supplier}" method="post">
                <div class="row g-3">
                    <div class="col-md-6">
                        <label class="form-label fw-semibold" th:text="#{supplier.form.name}">Назва</label>
                        <input type="text" class="form-control" th:field="*{name}"
                               th:classappend="${#fields.hasErrors('name')} ? 'is-invalid'"/>
                        <div class="invalid-feedback" th:errors="*{name}"></div>
                    </div>
                    <div class="col-md-6">
                        <label class="form-label fw-semibold" th:text="#{supplier.form.contactInfo}">Контакт</label>
                        <input type="text" class="form-control" th:field="*{contactInfo}"/>
                    </div>
                    <div class="col-12">
                        <label class="form-label fw-semibold" th:text="#{supplier.form.notes}">Примітки</label>
                        <textarea class="form-control" rows="3" th:field="*{notes}"></textarea>
                    </div>
                    <div class="col-12 d-flex gap-2">
                        <button type="submit" class="btn btn-primary">
                            <i class="bi bi-check-lg me-1"></i>
                            <span th:text="#{btn.save}">Зберегти</span>
                        </button>
                        <a th:href="@{/suppliers}" class="btn btn-outline-secondary"
                           th:text="#{btn.cancel}">Скасувати</a>
                    </div>
                </div>
            </form>
        </div>
    </div>
</div>
</body>
</html>
