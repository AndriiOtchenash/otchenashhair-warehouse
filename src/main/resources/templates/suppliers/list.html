<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout/main :: layout(#{supplier.list.title}, ~{::content})}">
<body>
<div th:fragment="content">
    <div class="page-header">
        <h1 class="page-title" th:text="#{supplier.list.title}">Постачальники</h1>
        <button class="btn btn-primary btn-sm" type="button"
                data-bs-toggle="collapse" data-bs-target="#newSupplierForm"
                aria-expanded="false">
            <i class="bi bi-plus-lg"></i>
            <span class="d-none d-md-inline ms-1" th:text="#{supplier.form.title.new}">Новий постачальник</span>
        </button>
    </div>

    <div th:if="${successMessage}" class="alert alert-success alert-dismissible fade show mb-3">
        <span th:text="${successMessage}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
    </div>
    <div th:if="${errorMessage}" class="alert alert-danger alert-dismissible fade show mb-3">
        <span th:text="${errorMessage}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
    </div>

    <!-- Collapsible new-supplier form -->
    <div class="collapse mb-3" id="newSupplierForm">
        <div class="card">
            <div class="card-header" th:text="#{supplier.form.title.new}">Новий постачальник</div>
            <div class="card-body">
                <form th:action="@{/suppliers}" th:object="${newSupplier}" method="post">
                    <div class="row g-2">
                        <div class="col-md-4">
                            <input type="text" class="form-control" th:field="*{name}"
                                   th:placeholder="#{supplier.form.name}"
                                   th:classappend="${#fields.hasErrors('name')} ? 'is-invalid'"/>
                            <div class="invalid-feedback" th:errors="*{name}"></div>
                        </div>
                        <div class="col-md-4">
                            <input type="text" class="form-control" th:field="*{contactInfo}"
                                   th:placeholder="#{supplier.form.contactInfo}"/>
                        </div>
                        <div class="col-md-4">
                            <textarea class="form-control" th:field="*{notes}" rows="1"
                                      th:placeholder="#{supplier.form.notes}"></textarea>
                        </div>
                        <div class="col-12">
                            <button type="submit" class="btn btn-primary btn-sm">
                                <i class="bi bi-check-lg me-1"></i>
                                <span th:text="#{btn.save}">Зберегти</span>
                            </button>
                        </div>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <!-- Search -->
    <div class="mb-3">
        <div class="input-group input-group-sm" style="max-width:300px;">
            <span class="input-group-text"><i class="bi bi-search"></i></span>
            <input type="text" class="form-control"
                   th:placeholder="#{common.search}"
                   oninput="filterSearch(this.value); toggleClearBtn(this)"/>
            <button type="button" class="btn btn-outline-secondary d-md-none"
                    onclick="clearSearch()" tabindex="-1" style="display:none">
                <i class="bi bi-x-lg"></i>
            </button>
        </div>
    </div>

    <div class="row g-3">
        <div class="col-12">
            <div class="card">
                <div class="card-body p-0">
                    <div th:if="${suppliers.empty}" class="text-center text-muted py-5">
                        <i class="bi bi-truck fs-1 d-block mb-2"></i>
                        <span th:text="#{supplier.list.empty}">Постачальники не знайдено</span>
                    </div>
                    <table th:unless="${suppliers.empty}" class="table table-hover mb-0 table-auto">
                        <thead class="table-light">
                        <tr>
                            <th th:text="#{supplier.form.name}">Назва</th>
                            <th class="d-none d-md-table-cell" th:text="#{supplier.form.contactInfo}">Контакт</th>
                            <th class="text-end" th:text="#{table.actions}">Дії</th>
                        </tr>
                        </thead>
                        <tbody>
                        <tr th:each="s : ${suppliers}"
                            th:attr="data-name=${s.name},data-contact=${s.contactInfo ?: ''}"
                            th:onclick="|window.location='@{/suppliers/{id}(id=${s.id})}'|"
                            style="cursor:pointer">
                            <td>
                                <span class="fw-semibold"
                                      th:text="${s.name}"
                                      th:if="${s.notes == null or s.notes.isEmpty()}">
                                </span>
                                <span class="fw-semibold"
                                      th:unless="${s.notes == null or s.notes.isEmpty()}"
                                      th:text="${s.name}"
                                      th:title="${s.notes}"
                                      data-bs-toggle="tooltip"
                                      data-bs-placement="right"
                                      style="cursor: help; border-bottom: 1px dashed #6c757d;">
                                </span>
                            </td>
                            <td class="d-none d-md-table-cell" th:text="${s.contactInfo}"></td>
                            <td class="text-end" onclick="event.stopPropagation()">
                                <div class="d-flex gap-1 justify-content-end">
                                    <a th:href="@{/suppliers/{id}/edit(id=${s.id})}"
                                       class="btn btn-sm btn-outline-secondary"
                                       th:title="#{btn.edit}"
                                       data-bs-toggle="tooltip">
                                        <i class="bi bi-pencil"></i>
                                    </a>
                                    <button th:if="${!suppliersWithMovements.contains(s.id)}"
                                            type="button"
                                            class="btn btn-sm btn-outline-danger"
                                            th:title="#{btn.delete}"
                                            data-bs-toggle="modal"
                                            data-bs-target="#deleteSupplierModal"
                                            th:attr="data-supplier-name=${s.name},
                                                     data-action=@{/suppliers/{id}/delete(id=${s.id})}">
                                        <i class="bi bi-trash"></i>
                                    </button>
                                    <button th:if="${suppliersWithMovements.contains(s.id)}"
                                            type="button"
                                            class="btn btn-sm btn-outline-secondary"
                                            disabled
                                            th:title="#{supplier.delete.error.hasMovements}"
                                            data-bs-toggle="tooltip">
                                        <i class="bi bi-trash"></i>
                                    </button>
                                </div>
                            </td>
                        </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <!-- Delete confirmation modal -->
    <div class="modal fade" id="deleteSupplierModal" tabindex="-1">
        <div class="modal-dialog modal-sm">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" th:text="#{btn.delete}">Видалити</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <p class="mb-0">
                        <span th:text="#{confirm.delete.supplier}">Видалити постачальника</span>
                        <strong id="deleteSupplierName"></strong>?
                    </p>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary btn-sm"
                            data-bs-dismiss="modal" th:text="#{btn.no}">Ні</button>
                    <form id="deleteSupplierForm" method="post">
                        <input type="hidden" name="_csrf" th:value="${_csrf.token}" th:if="${_csrf != null}"/>
                        <button type="submit" class="btn btn-danger btn-sm" th:text="#{btn.yes}">Так</button>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <script>
        function filterSearch(value) {
            const q = value.toLowerCase();
            document.querySelectorAll('tbody tr').forEach(row => {
                const name = (row.dataset.name || '').toLowerCase();
                const contact = (row.dataset.contact || '').toLowerCase();
                row.style.display = (!q || name.includes(q) || contact.includes(q)) ? '' : 'none';
            });
        }

        function toggleClearBtn(input) {
            var btn = input.nextElementSibling;
            if (btn) btn.style.display = input.value ? '' : 'none';
        }

        function clearSearch() {
            var input = document.querySelector('.input-group input[type="text"]');
            if (input) { input.value = ''; filterSearch(''); toggleClearBtn(input); }
        }

        document.addEventListener('DOMContentLoaded', function() {
            document.querySelectorAll('[data-bs-toggle="tooltip"]').forEach(el => {
                new bootstrap.Tooltip(el);
            });

            var deleteModal = document.getElementById('deleteSupplierModal');
            if (deleteModal) {
                deleteModal.addEventListener('show.bs.modal', function(event) {
                    var btn = event.relatedTarget;
                    document.getElementById('deleteSupplierName').textContent = btn.getAttribute('data-supplier-name');
                    document.getElementById('deleteSupplierForm').action = btn.getAttribute('data-action');
                });
            }
        });
    </script>
</div>
</body>
</html>
