<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout/main :: layout(#{report.trends.title}, ~{::content})}">
<body>
<div th:fragment="content">
    <style>
        .chart-card .card-body { padding: 1rem; }
        .page-header { flex-direction: row !important; align-items: center !important; }
        .page-header .btn { flex: 0 !important; white-space: nowrap; }
    </style>

    <div class="page-header">
        <h1 class="page-title" th:text="#{report.trends.title}">Тренди</h1>
        <a th:href="@{/reports}" class="btn btn-outline-secondary btn-sm">
            <i class="bi bi-arrow-left me-1"></i>
            <span class="d-none d-sm-inline" th:text="#{nav.reports}">Звіти</span>
        </a>
    </div>

    <!-- Period selector -->
    <div class="card mb-3">
        <div class="card-header fw-semibold text-center" th:text="#{report.period.title}">Період</div>
        <div class="card-body">
            <div class="d-flex flex-column align-items-center gap-2">
                <div class="btn-group btn-group-sm">
                    <a th:href="@{/reports/trends(preset='THIS_MONTH')}"
                       th:classappend="${period.preset == 'THIS_MONTH'} ? 'active'"
                       class="btn btn-outline-secondary"
                       th:text="#{report.thisMonth}">Цей місяць</a>
                    <a th:href="@{/reports/trends(preset='LAST_MONTH')}"
                       th:classappend="${period.preset == 'LAST_MONTH'} ? 'active'"
                       class="btn btn-outline-secondary"
                       th:text="#{report.lastMonth}">Минулий місяць</a>
                    <a th:href="@{/reports/trends(preset='ALL_TIME')}"
                       th:classappend="${period.preset == 'ALL_TIME'} ? 'active'"
                       class="btn btn-outline-secondary"
                       th:text="#{report.allTime}">Весь час</a>
                </div>
                <form th:action="@{/reports/trends}" method="get"
                      class="d-flex gap-2 align-items-center w-100" style="max-width:480px">
                    <input type="hidden" name="preset" value="CUSTOM"/>
                    <input type="date" class="form-control form-control-sm"
                           style="flex: 0.85 1 0; min-width: 0;"
                           id="reportDateFrom" name="from"
                           th:value="${#temporals.format(period.from, 'yyyy-MM-dd')}"
                           onchange="syncReportDateRange('from')"/>
                    <input type="date" class="form-control form-control-sm"
                           style="flex: 0.85 1 0; min-width: 0;"
                           id="reportDateTo" name="to"
                           th:value="${#temporals.format(period.to, 'yyyy-MM-dd')}"
                           onchange="syncReportDateRange('to')"/>
                    <button type="submit" class="btn btn-primary btn-sm flex-shrink-0"
                            th:text="#{report.apply}">Застосувати</button>
                </form>
            </div>
        </div>
    </div>

    <!-- Period label -->
    <div class="text-center text-muted small mb-3">
        <i class="bi bi-calendar3 me-1"></i>
        <span th:if="${period.preset == 'THIS_MONTH'}" th:text="#{report.thisMonth}"></span>
        <span th:if="${period.preset == 'LAST_MONTH'}" th:text="#{report.lastMonth}"></span>
        <span th:if="${period.preset == 'ALL_TIME'}" th:text="#{report.allTime}"></span>
        <span th:if="${period.preset == 'CUSTOM'}"
              th:text="${#temporals.format(period.from, 'dd.MM.yyyy')} + ' – ' + ${#temporals.format(period.to, 'dd.MM.yyyy')}"></span>
    </div>

    <!-- Chart 1: Revenue vs Purchases -->
    <div class="card mb-3 chart-card">
        <div class="card-header fw-semibold" th:text="#{report.trends.revenueVsPurchases}">Виручка vs Закупки</div>
        <div class="card-body">
            <div id="noDataMsg" class="text-center text-muted py-4" style="display:none">
                <i class="bi bi-bar-chart fs-1 d-block mb-2"></i>
                <span th:text="#{report.noData}">Немає даних за період</span>
            </div>
            <div id="revenueChartWrap" style="position:relative;height:280px">
                <canvas id="revenueChart"></canvas>
            </div>
        </div>
    </div>

    <!-- Chart 2: Sales count -->
    <div class="card mb-3 chart-card">
        <div class="card-header fw-semibold" th:text="#{report.trends.salesActivity}">Кількість продажів</div>
        <div class="card-body">
            <div id="salesChartWrap" style="position:relative;height:220px">
                <canvas id="salesChart"></canvas>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/chart.js@4/dist/chart.umd.min.js"></script>
    <script th:inline="javascript">
        /*<![CDATA[*/
        const rawLabels    = /*[[${trendLabels}]]*/ [];
        const revenue      = /*[[${trendRevenue}]]*/ [];
        const purchases    = /*[[${trendPurchases}]]*/ [];
        const salesCount   = /*[[${trendSalesCount}]]*/ [];

        // Format labels as "Лис 2025", "Nov 2025" etc. using browser locale
        const lang = document.documentElement.lang || 'uk';
        const displayLabels = rawLabels.map(l => {
            const [y, m] = l.split('-');
            return new Date(parseInt(y), parseInt(m) - 1, 1)
                .toLocaleDateString(lang, { month: 'short', year: 'numeric' });
        });

        // Read accent color from CSS custom property
        const accent     = getComputedStyle(document.documentElement).getPropertyValue('--accent').trim() || '#5d8a5e';
        const accentRgba = (a) => {
            // accent might be hex or rgb — try to convert
            const tmp = document.createElement('div');
            tmp.style.color = accent;
            document.body.appendChild(tmp);
            const rgb = getComputedStyle(tmp).color; // "rgb(r, g, b)"
            document.body.removeChild(tmp);
            const parts = rgb.match(/\d+/g);
            return parts ? `rgba(${parts[0]},${parts[1]},${parts[2]},${a})` : accent;
        };

        const hasData = revenue.some(v => v > 0) || purchases.some(v => v > 0);
        if (!hasData) {
            document.getElementById('noDataMsg').style.display = '';
            document.getElementById('revenueChartWrap').style.display = 'none';
        }

        // Chart 1 — Revenue vs Purchases (line)
        new Chart(document.getElementById('revenueChart'), {
            type: 'line',
            data: {
                labels: displayLabels,
                datasets: [
                    {
                        label: /*[[#{report.summary.revenue}]]*/ 'Виручка',
                        data: revenue,
                        borderColor: accent,
                        backgroundColor: accentRgba(0.08),
                        fill: true,
                        tension: 0.3,
                        pointRadius: rawLabels.length > 12 ? 2 : 4,
                        pointHoverRadius: 5,
                        borderWidth: 2
                    },
                    {
                        label: /*[[#{report.summary.purchases}]]*/ 'Закупки',
                        data: purchases,
                        borderColor: '#6c757d',
                        backgroundColor: 'rgba(108,117,125,0.06)',
                        fill: true,
                        tension: 0.3,
                        pointRadius: rawLabels.length > 12 ? 2 : 4,
                        pointHoverRadius: 5,
                        borderWidth: 2,
                        borderDash: [4, 3]
                    }
                ]
            },
            options: {
                responsive: true,
                maintainAspectRatio: false,
                interaction: { mode: 'index', intersect: false },
                plugins: {
                    legend: { position: 'bottom' },
                    tooltip: {
                        callbacks: {
                            label: ctx => ' ' + ctx.dataset.label + ': ' + ctx.parsed.y.toFixed(2) + ' zł'
                        }
                    }
                },
                scales: {
                    y: {
                        beginAtZero: true,
                        ticks: { callback: v => v.toFixed(0) + ' zł' }
                    },
                    x: { grid: { display: false } }
                }
            }
        });

        // Chart 2 — Sales count (bar)
        new Chart(document.getElementById('salesChart'), {
            type: 'bar',
            data: {
                labels: displayLabels,
                datasets: [{
                    label: /*[[#{report.trends.salesActivity}]]*/ 'Продажі',
                    data: salesCount,
                    backgroundColor: accentRgba(0.55),
                    borderColor: accent,
                    borderWidth: 1,
                    borderRadius: 3
                }]
            },
            options: {
                responsive: true,
                maintainAspectRatio: false,
                plugins: {
                    legend: { display: false },
                    tooltip: {
                        callbacks: {
                            label: ctx => ' ' + ctx.parsed.y + ' ' + /*[[#{report.summary.salesCount}]]*/ 'продажів'
                        }
                    }
                },
                scales: {
                    y: {
                        beginAtZero: true,
                        ticks: { stepSize: 1, precision: 0 }
                    },
                    x: { grid: { display: false } }
                }
            }
        });
        /*]]>*/
    </script>
    <script>
        function syncReportDateRange(changed) {
            const fromEl = document.getElementById('reportDateFrom');
            const toEl   = document.getElementById('reportDateTo');
            if (!fromEl || !toEl) return;
            if (fromEl.value) toEl.min = fromEl.value; else toEl.removeAttribute('min');
            if (toEl.value)   fromEl.max = toEl.value; else fromEl.removeAttribute('max');
            if (fromEl.value && toEl.value && toEl.value < fromEl.value) {
                if (changed === 'from') { toEl.value = ''; toEl.removeAttribute('min'); }
                else                   { fromEl.value = ''; fromEl.removeAttribute('max'); }
            }
        }
        document.addEventListener('DOMContentLoaded', function() {
            const fromEl = document.getElementById('reportDateFrom');
            const toEl   = document.getElementById('reportDateTo');
            if (fromEl && fromEl.value) toEl.min = fromEl.value;
            if (toEl   && toEl.value)  fromEl.max = toEl.value;
        });
    </script>
</div>
</body>
</html>
